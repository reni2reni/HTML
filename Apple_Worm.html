<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple Worm - Complete Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1b2838 0%, #0d131a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            background: #7ec0ee;
        }

        canvas {
            display: block;
        }

        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 16px;
        }

        #editor-palette {
            display: none;
            gap: 5px;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 640px;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .chip-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.3);
        }

        #controller-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #dpad {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 3px;
        }

        .d-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .d-btn:active {
            background: #2ed573;
        }

        #action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .c-btn {
            background: rgba(255, 255, 255, 0.85);
            color: #222;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .c-btn:active {
            transform: translateY(1px);
        }

        .edit-btn {
            background: #5352ed;
            color: #fff;
        }

        .undo-btn {
            background: #ffa502;
            color: #fff;
        }

        .reset-btn {
            background: #ff4757;
            color: #fff;
        }

        .nav-btn {
            background: #70a1ff;
            color: #fff;
        }

        #clear-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #clear-modal h2 {
            font-size: 32px;
            color: #ffd700;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div class="header">
            <div id="level-display">LEVEL 1</div>
            <!-- ★ 追加: BGMトグルボタン -->
            <button id="bgm-toggle-btn"

        </div>

        </div>
    </div>

    <!-- コード入出力用モーダル -->
    <div id="io-modal"

        <button class="chip-btn" onclick="setChip('<', this)">◀ 針左</button>
        <button class="chip-btn" onclick="setChip('>', this)">▶ 針右</button>
        <button class="chip-btn" onclick="setChip('A', this)">🍎 リンゴ</button>
        <button class="chip-btn" onclick="setChip('P', this)">🌀 ゴール</button>
        <button class="chip-btn" onclick="setChip('W', this)">🐛 ワーム</button>
        <button class="chip-btn" onclick="setChip('.', this)">🧹 消去</button>
        <button class="chip-btn" style="background:#3742fa;" onclick="addNewCustomMap()">➕ 新規追加</button>
        <button class="chip-btn" style="background:#2ed573;" onclick="saveCustomMap()">💾 保存</button>
        <!-- ★ 追加：書き出し＆読み込みボタン -->
        <button class="chip-btn" style="background:#e056fd;" onclick="exportMapCode()">📋 書出</button>
        <button class="chip-btn" style="background:#f0932b;" onclick="importMapCode()">📥 読込</button>
        <button class="chip-btn" style="background:#ff4757;" onclick="clearCustomMap()">全消去</button>
    </div>

    <!-- コントローラー（全UIを集約） -->
    <div id="controller-panel">
        <div id="dpad">
            <div></div>
            <div class="d-btn" onpointerdown="handleInput(0, -1)">▲</div>
            <div></div>

        /* ============================================================
   効果音＆本家風BGMエンジン (Web Audio API)
============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let bgmEnabled = true;
let isMusicPlaying = false;
let bgmTimer = null;
let currentBgmStep = 0;

// ボリューム調整
const bgmMasterGain = audioCtx.createGain();
bgmMasterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
bgmMasterGain.connect(audioCtx.destination);

// クリック等でAudioContextを開始＆BGMループ起動
function ensureAudioRunning() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!isMusicPlaying && bgmEnabled) startBgmLoop();
}

function toggleBGM(e) {
    if (e) e.stopPropagation();
    bgmEnabled = !bgmEnabled;
    const btn = document.getElementById('bgm-toggle-btn');
    if (bgmEnabled) {
        btn.innerText = "🎵 BGM: ON";
        bgmMasterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        ensureAudioRunning();
    } else {
        btn.innerText = "🔇 BGM: OFF";
        bgmMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
    }
}

// マリンバ／木琴風のぽこぽこした音
function playMarimba(freq, time, vol = 0.22, duration = 0.18) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    osc.connect(gain); gain.connect(bgmMasterGain);
    osc.start(time); osc.stop(time + duration);
}

// ウクレレ風のコードストローク（ポロロン♪）
function playUkuleleChord(freqs, time, vol = 0.15) {
    freqs.forEach((freq, i) => {
        const strumTime = time + i * 0.014;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, strumTime);
        gain.gain.setValueAtTime(0.0001, strumTime);
        gain.gain.linearRampToValueAtTime(vol, strumTime + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, strumTime + 0.28);
        osc.connect(gain); gain.connect(bgmMasterGain);
        osc.start(strumTime); osc.stop(strumTime + 0.3);
    });
}

// 本家特有の軽快なウクレレ＆マリンバループ（BPM約140、16拍サイクル）
const CHORD_NOTES = {
    C:  [261.63, 329.63, 392.00, 523.25], // ド・ミ・ソ・ド
    G:  [196.00, 246.94, 293.66, 392.00], // ソ・シ・レ・ソ
    Am: [220.00, 261.63, 329.63, 440.00], // ラ・ド・ミ・ラ
    F:  [174.61, 220.00, 261.63, 349.23]  // ファ・ラ・ド・ファ
};
const bgmChords = ['C', 'C', 'G', 'G', 'Am', 'Am', 'F', 'G'];
const bgmMelody = [
    523.25, 659.25, 783.99, 659.25, 587.33, 493.88, 392.00, 493.88,
    440.00, 523.25, 659.25, 523.25, 349.23, 440.00, 392.00, null
];

function startBgmLoop() {
    isMusicPlaying = true;
    const stepTime = 135; // テンポ（ミリ秒）

    bgmTimer = setInterval(() => {
        if (!bgmEnabled) return;
        const now = audioCtx.currentTime;
        const chordIdx = Math.floor(currentBgmStep / 2) % bgmChords.length;

        // 2拍ごとにコードストローク（ウクレレ）
        if (currentBgmStep % 2 === 0) {
            playUkuleleChord(CHORD_NOTES[bgmChords[chordIdx]], now);
        }
        // メロディ（マリンバ）
        const melNote = bgmMelody[currentBgmStep % bgmMelody.length];
        if (melNote) {
            playMarimba(melNote, now, 0.2, 0.16);
        }

        currentBgmStep = (currentBgmStep + 1) % 16;
    }, stepTime);
}

// 単音再生（SE用）
function playTone(freq, type, duration, startGain = 0.15) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(startGain, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
        // りんごをかじる音：通常速度のノイズ混じり「ザクッ、カリッ」
        function playCrunch() {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                // ざらっとした噛み砕きノイズ
                const length = Math.floor(audioCtx.sampleRate * 0.19);
                const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    const fade = Math.pow(1 - i / length, 2.2);
                    data[i] = (Math.random() * 2 - 1) * fade;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1750, now);
                filter.Q.setValueAtTime(0.75, now);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.23, now + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 0.2);
                // 2回の小さな「カリッ」で、かじった感じを出す
                [0, 0.075].forEach((delay, index) => {
                    const osc = audioCtx.createOscillator();
                    const biteGain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(index === 0 ? 1150 : 820, now + delay);
                    biteGain.gain.setValueAtTime(0.0001, now + delay);
                    biteGain.gain.linearRampToValueAtTime(0.075, now + delay + 0.006);
                    biteGain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.045);
                    osc.connect(biteGain); biteGain.connect(audioCtx.destination);
                    osc.start(now + delay); osc.stop(now + delay + 0.05);
                });
            }
        let eatAnimationUntil = 0;
            let eatAnimationFramePending = false;

            // ★ 指定ミリ秒間、大口アニメーションを描画更新する
            function triggerEatAnimation(duration = 380) {
                eatAnimationUntil = performance.now() + duration;
                if (!eatAnimationFramePending) {
                    eatAnimationFramePending = true;
                    const tick = () => {
                        draw();
                        if (performance.now() < eatAnimationUntil) {
                            requestAnimationFrame(tick);
                        } else {
                            eatAnimationFramePending = false;
                            draw();
                        }
                    };
                    requestAnimationFrame(tick);
                }
                return new Promise(resolve => setTimeout(resolve, duration));
            }

            // sfx.eat では効果音のみ鳴らすようにシンプル化

        function parseRaw(raw) {
            const tiles = Array.from({ length: gridRows }, () => Array(gridCols).fill(0));
            const apples = [];
            const stones = [];
            let portal = { x: 14, y: 3 };
            let worm = [];

            for (let y = 0; y < gridRows; y++) {
                for (let x = 0; x < gridCols; x++) {
                    const ch = (raw.map[y] && raw.map[y][x]) ? raw.map[y][x] : '.';
                    if (ch === '#') tiles[y][x] = 1;
                    else if (ch === 'B') tiles[y][x] = 7;
                    else if (ch === 'X') tiles[y][x] = 2;
                    else if (ch === '^') tiles[y][x] = 3;
                    else if (ch === 'v') tiles[y][x] = 4;
                    else if (ch === '<') tiles[y][x] = 5;
                    else if (ch === '>') tiles[y][x] = 6;
                    else if (ch === 'S') stones.push({ x, y });
                    else if (ch === 'A') apples.push({ x, y });
                    else if (ch === 'P') portal = { x, y };
                    else if (ch === 'W') {
                        worm = [];
                        for (let len = 0; len < (raw.length || 3); len++) worm.push({ x: x - len, y });
                    }
                }
            }
            if (worm.length === 0) worm = [{ x: 3, y: 3 }, { x: 2, y: 3 }, { x: 1, y: 3 }];
            return { tiles, apples, stones, portal, worm, wormDir: raw.dir || { x: 1, y: 0 } };
        }

        let STAGES = [];
        function loadAllStages() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    STAGES = JSON.parse(saved);
                } catch (e) {
                    STAGES = DEFAULT_MAPS.map(parseRaw);
                }
            } else {
                STAGES = DEFAULT_MAPS.map(parseRaw);
            }
        }
        loadAllStages();

        let currentLevelIndex = 0;
        let tiles = [];
        let apples = [];
        let stones = [];
        let portal = { x: 0, y: 0 };
        let worm = [];
        let wormDir = { x: 1, y: 0 };
        let history = [];
        let isAnimating = false;
        let isClear = false;
        let isSucking = false;
        let portalAngle = 0;
        let sawAngle = 0;
            // ★ 追加：スムーズアニメーション用
            let prevWorm = null;
            let moveStartTime = 0;
            const MOVE_DURATION = 200;

        function loadLevel(idx) {
            if (STAGES.length === 0) loadAllStages();
            currentLevelIndex = (idx + STAGES.length) % STAGES.length;

            const data = STAGES[currentLevelIndex];
            document.getElementById('level-display').innerText = `LEVEL ${currentLevelIndex + 1} / ${STAGES.length}`;
            document.getElementById('clear-modal').style.display = 'none';

            tiles = JSON.parse(JSON.stringify(data.tiles));
            apples = JSON.parse(JSON.stringify(data.apples));
            stones = JSON.parse(JSON.stringify(data.stones));
            portal = { ...data.portal };
            worm = JSON.parse(JSON.stringify(data.worm));
            wormDir = { ...data.wormDir };

            history = [];
            isClear = false;
            isSucking = false;
            isAnimating = false;
            prevWorm = null; // ★ 追加
            draw();
        }

        /* ============================================================
       📋 マップコードの書き出し（エクスポート）＆ 読み込み（インポート）
    ============================================================ */
            // 現在の全ステージを指定された形式のコード文字列に変換して出力
            function exportMapCode() {
                // 現在編集中のステージを最新化
                STAGES[currentLevelIndex] = {
                    tiles: JSON.parse(JSON.stringify(tiles)),
                    apples: JSON.parse(JSON.stringify(apples)),
                    stones: JSON.parse(JSON.stringify(stones)),
                    portal: { ...portal },
                    worm: JSON.parse(JSON.stringify(worm)),
                    wormDir: { ...wormDir }
                };

                let output = "const DEFAULT_MAPS = [\n";
                STAGES.forEach((stage, idx) => {
                    output += "    {\n        map: [\n";
                    for (let y = 0; y < gridRows; y++) {
                        let row = "            \"";
                        for (let x = 0; x < gridCols; x++) {
                            if (stage.worm[0] && stage.worm[0].x === x && stage.worm[0].y === y) row += 'W';
                            else if (stage.apples.some(a => a.x === x && a.y === y)) row += 'A';
                            else if (stage.stones.some(s => s.x === x && s.y === y)) row += 'S';
                            else if (stage.portal.x === x && stage.portal.y === y) row += 'P';
                            else {
                                const t = stage.tiles[y][x];
                                if (t === 1) row += '#';
                                else if (t === 7) row += 'B';
                                else if (t === 2) row += 'X';
                                else if (t === 3) row += '^';
                                else if (t === 4) row += 'v';
                                else if (t === 5) row += '<';
                                else if (t === 6) row += '>';
                                else row += '.';
                            }
                        }
                        row += (y < gridRows - 1) ? "\",\n" : "\"\n";
                        output += row;
                    }
                    output += `        ],\n        length: ${stage.worm.length}, dir: { x: ${stage.wormDir.x}, y: ${stage.wormDir.y} }\n    }${idx < STAGES.length - 1 ? ',' : ''}\n`;
                });
                output += "];";

                // モーダルに表示＆自動クリップボードコピー
                document.getElementById('io-title').innerText = "📋 マップコードの書き出し (コピー完了)";
                document.getElementById('io-textarea').value = output;
                document.getElementById('io-action-btn').style.display = "none";
                document.getElementById('io-modal').style.display = "flex";
                navigator.clipboard.writeText(output).catch(() => { });
            }

            // 読み込みダイアログを開く
            function importMapCode() {
                document.getElementById('io-title').innerText = "📥 マップコードの読み込み (貼り付けてください)";
                document.getElementById('io-textarea').value = "";
                document.getElementById('io-action-btn').style.display = "block";
                document.getElementById('io-modal').style.display = "flex";
            }

            // 貼り付けられたコードを解析して読み込む
            function executeImport() {
                const text = document.getElementById('io-textarea').value;
                try {
                    // map: [ ... ] の配列部分を正規表現で抽出
                    const mapMatches = [...text.matchAll(/map:\s*\[([\s\S]*?)\]/g)];
                    if (mapMatches.length === 0) throw new Error("有効なマップデータが見つかりません。");

                    const newStages = [];
                    for (let match of mapMatches) {
                        const rows = match[1].match(/"([^"]+)"/g).map(s => s.replace(/"/g, ''));
                        // length 抽出
                        const lenMatch = text.slice(match.index).match(/length:\s*(\d+)/);
                        const length = lenMatch ? parseInt(lenMatch[1]) : 3;
                        newStages.push(parseRaw({ map: rows, length: length, dir: { x: 1, y: 0 } }));
                    }

                    STAGES = newStages;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(STAGES));
                    loadLevel(0);
                    document.getElementById('io-modal').style.display = 'none';
                    alert(`${STAGES.length} 個のステージを正常に読み込みました！`);
                } catch (e) {
                    alert("読み込みエラー: コードの形式が正しくありません。\n" + e.message);
                }
            }

            
        function restartLevel() { loadLevel(currentLevelIndex); }
        function nextLevel() { loadLevel(currentLevelIndex + 1); }
        function prevLevel() { loadLevel(currentLevelIndex - 1); }

        /* ============================================================
           物理＆アクションエンジン（剛体物理・石押し・トゲ破壊）
        ============================================================ */
        function isSolid(x, y) {
            if (y < 0 || y >= gridRows || x < 0 || x >= gridCols) return true;
            return tiles[y][x] === 1 || tiles[y][x] === 7;
        }
        function isDanger(x, y) {
            if (y < 0 || y >= gridRows || x < 0 || x >= gridCols) return false;
            return tiles[y][x] >= 2 && tiles[y][x] <= 6;
        }
        function isStoneAt(x, y) {
            return stones.find(s => s.x === x && s.y === y);
        }
        function isWormSupported() {
                for (let part of worm) {
                    const by = part.y + 1;
                    if (by < gridRows) {
                        // 地面または石があるなら支えられる
                        if (tiles[by][part.x] === 1 || tiles[by][part.x] === 7 || isStoneAt(part.x, by)) return true;

                        // ★ 真下にリンゴがあるなら、落下をストップしてリンゴの上に着地！
                        if (apples.some(a => a.x === part.x && a.y === by)) {
                            return true;
                        }
                    }
                }
                return false;
            }

        function saveState() {
            history.push({
                tiles: JSON.parse(JSON.stringify(tiles)),
                apples: JSON.parse(JSON.stringify(apples)),
                stones: JSON.parse(JSON.stringify(stones)),
                worm: JSON.parse(JSON.stringify(worm)),
                wormDir: { ...wormDir }
            });
        }

        function undo() {
                if (isEditMode) {
                    editorUndo();
                    return;
                }
                if (isAnimating || history.length === 0 || isClear) return;
                const last = history.pop();
                tiles = last.tiles; apples = last.apples; stones = last.stones;
                worm = last.worm; wormDir = last.wormDir;
                prevWorm = null; // ★ 追加
                sfx.step(); draw();
            }

        async function handleInput(dx, dy) {
                if (isClear) { nextLevel(); return; }
                if (isAnimating) return;

                if (worm.length > 1 && worm[0].x + dx === worm[1].x && worm[0].y + dy === worm[1].y) return;

                const nextHead = { x: worm[0].x + dx, y: worm[0].y + dy };
                if (isSolid(nextHead.x, nextHead.y)) return;

                // 石ブロックを押す判定
                const pushedStone = isStoneAt(nextHead.x, nextHead.y);
                if (pushedStone) {
                    if (dx === 0) return;
                    const stoneTargetX = pushedStone.x + dx;
                    const stoneTargetY = pushedStone.y;

                    if (isSolid(stoneTargetX, stoneTargetY) || isStoneAt(stoneTargetX, stoneTargetY)) return;
                    if (worm.some(p => p.x === stoneTargetX && p.y === stoneTargetY)) return;
                    if (apples.some(a => a.x === stoneTargetX && a.y === stoneTargetY)) return;

                    saveState();
                    pushedStone.x = stoneTargetX;
                } else {
                    for (let i = 0; i < worm.length; i++) {
                        if (worm[i].x === nextHead.x && worm[i].y === nextHead.y) return;
                    }
                    saveState();
                }

                wormDir = { x: dx, y: dy };

                // ★ リンゴが次のマスにあるか判定
                const appleIdx = apples.findIndex(a => a.x === nextHead.x && a.y === nextHead.y);
                const willEat = (appleIdx !== -1);

                isAnimating = true;

                // ★★★ リンゴの横に顔がある（食べる）なら、移動する前にまず口を大きく開ける！ ★★★
                if (willEat) {
                    triggerEatAnimation(420);
                    await new Promise(r => setTimeout(r, 120)); // 口がパカッと開くのを待つ
                }

                // 口を開けたまま、スムーズにリンゴへ向かってスライド前進
                prevWorm = JSON.parse(JSON.stringify(worm));
                moveStartTime = performance.now();

                worm.unshift(nextHead);
                if (!willEat) worm.pop();

                await new Promise(r => setTimeout(r, MOVE_DURATION));

                // ★★★ 頭がリンゴに届いた瞬間、リンゴが消えて「パクリ！」効果音 ★★★
                if (willEat) {
                    apples.splice(appleIdx, 1);
                    sfx.eat();
                    await new Promise(r => setTimeout(r, 120)); // パクリと口が閉じる余韻
                } else {
                    sfx.step();
                }

                isAnimating = false;
                draw();

                if (worm[0].x === portal.x && worm[0].y === portal.y) {
                    checkWinCondition();
                    return;
                }

                isAnimating = true;
                await applyAllPhysics();
                isAnimating = false;

                if (worm.some(p => isDanger(p.x, p.y))) {
                    sfx.die();
                    await new Promise(r => setTimeout(r, 300));
                    restartLevel();
                    return;
                }

                checkWinCondition();
            }

        async function applyAllPhysics() {
                let moved = true;
                while (moved) {
                    moved = false;

                    // ① 石ブロックの落下（リンゴの上で着地）
                    for (let stone of stones) {
                        const underY = stone.y + 1;
                        const hasAppleUnder = apples.some(a => a.x === stone.x && a.y === underY);

                        if (underY < gridRows && !isSolid(stone.x, underY) && !isStoneAt(stone.x, underY) && !worm.some(p => p.x === stone.x && p.y === underY) && !hasAppleUnder) {
                            if (tiles[underY][stone.x] >= 3 && tiles[underY][stone.x] <= 6) {
                                tiles[underY][stone.x] = 0;
                                sfx.crush();
                            }
                            stone.y += 1;
                            moved = true;
                        }
                    }

                    // ② ワームの落下処理
                    if (!isWormSupported()) {
                        prevWorm = JSON.parse(JSON.stringify(worm)); // ★ 落下前位置を記録
                        moveStartTime = performance.now();

                        for (let part of worm) part.y += 1;
                        sfx.fall();
                        moved = true;

                        // ★ 口が下を向いている（wormDir.y === 1）時だけ、落ちてリンゴを食べる！
                        if (wormDir.y === 1) {
                            const appleIdx = apples.findIndex(a => a.x === worm[0].x && a.y === worm[0].y);
                            if (appleIdx !== -1) {
                                // 一旦リンゴを残したまま口を開ける
                                triggerEatAnimation(380);
                                await new Promise(r => setTimeout(r, 140));

                                apples.splice(appleIdx, 1); // 噛みついて消去！
                                sfx.eat();
                                const tail = worm[worm.length - 1];
                                worm.push({ x: tail.x, y: tail.y });

                                await new Promise(r => setTimeout(r, 200));
                            }
                        }
                    }

                    if (moved) {
                        draw();
                        // 落下アニメーションの完了に合わせてウェイト
                        await new Promise(r => setTimeout(r, Math.max(90, MOVE_DURATION)));
                    }

                    // 画面外落下判定
                    if (worm.some(p => p.y >= gridRows)) {
                        sfx.die();
                        await new Promise(r => setTimeout(r, 200)); // 即座にやり直す
                        restartLevel();
                        return;
                    }
                }
            }

        // クリア判定＆リアル吸い込み演出（頭が消えて最後にお尻が消える）
        async function checkWinCondition() {
            if (worm.length > 0 && worm[0].x === portal.x && worm[0].y === portal.y) {
                isAnimating = true;
                isSucking = true; // 頭（目玉）を非表示にして穴に突入

                while (worm.length > 0) {
                    await new Promise(r => setTimeout(r, 110));
                    sfx.step();
                    for (let i = worm.length - 1; i > 0; i--) {
                        worm[i] = { x: worm[i - 1].x, y: worm[i - 1].y };
                    }
                    worm.shift();
                    draw();
                }

                await new Promise(r => setTimeout(r, 200));
                isSucking = false; isClear = true; isAnimating = false;
                sfx.win();
                document.getElementById('clear-modal').style.display = 'flex';
            }
        }

        /* ============================================================
           キャンバス描画（角丸ワーム・スプライト描画）
        ============================================================ */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#68b8f8'); skyGrad.addColorStop(1, '#a6daf8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawTerrainAndTraps();
            drawPortal();
            for (let apple of apples) drawApple(apple.x * TILE_SIZE, apple.y * TILE_SIZE);
            for (let stone of stones) drawStone(stone.x * TILE_SIZE, stone.y * TILE_SIZE);
            drawWorm();

            if (isEditMode) {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
                ctx.lineWidth = 1;
                for (let x = 0; x <= canvas.width; x += TILE_SIZE) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += TILE_SIZE) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }
        }

        function drawTerrainAndTraps() {
            for (let y = 0; y < gridRows; y++) {
                for (let x = 0; x < gridCols; x++) {
                    const t = tiles[y][x];
                    const px = x * TILE_SIZE; const py = y * TILE_SIZE;

                    if (t === 1) { // 芝の地面
                        ctx.fillStyle = '#654321'; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#4a2f13'; ctx.lineWidth = 1; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                        if (y === 0 || tiles[y - 1][x] === 0) {
                            ctx.fillStyle = '#48b32d'; ctx.fillRect(px, py, TILE_SIZE, 8);
                            ctx.fillStyle = '#2f7c1d'; ctx.fillRect(px, py + 8, TILE_SIZE, 2);
                        }
                    } else if (t === 7) { // 赤レンガ（黒い目地・互い違い）
                        // 参考画像に合わせた赤茶色のレンガと黒い太めの目地
                        ctx.fillStyle = '#b9431d';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#211b18';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(px + 1.5, py + 1.5, TILE_SIZE - 3, TILE_SIZE - 3);
                        ctx.beginPath();
                        ctx.moveTo(px, py + TILE_SIZE / 2);
                        ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE / 2);
                        if (y % 2 === 0) {
                            ctx.moveTo(px + TILE_SIZE / 2, py);
                            ctx.lineTo(px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                            ctx.moveTo(px + TILE_SIZE / 4, py + TILE_SIZE / 2);
                            ctx.lineTo(px + TILE_SIZE / 4, py + TILE_SIZE);
                            ctx.moveTo(px + TILE_SIZE, py + TILE_SIZE / 2);
                            ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE);
                        } else {
                            ctx.moveTo(px + TILE_SIZE / 4, py);
                            ctx.lineTo(px + TILE_SIZE / 4, py + TILE_SIZE / 2);
                            ctx.moveTo(px + TILE_SIZE * 3 / 4, py);
                            ctx.lineTo(px + TILE_SIZE * 3 / 4, py + TILE_SIZE / 2);
                            ctx.moveTo(px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                            ctx.lineTo(px + TILE_SIZE / 2, py + TILE_SIZE);
                        }
                        ctx.stroke();
                    } else if (t === 2) { // 丸ノコ（適度な回転速度）
                        ctx.save();
                        ctx.translate(px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        ctx.rotate(sawAngle);
                        ctx.fillStyle = '#dcdde1'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#718093'; ctx.lineWidth = 2;
                        for (let i = 0; i < 8; i++) {
                            ctx.rotate(Math.PI / 4);
                            ctx.beginPath(); ctx.moveTo(12, -4); ctx.lineTo(19, 0); ctx.lineTo(12, 4); ctx.fill();
                        }
                        ctx.fillStyle = '#2f3640'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
                        ctx.restore();
                    } else if (t >= 3 && t <= 6) { // トゲ4方向
                        ctx.fillStyle = '#7f8c8d'; ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1.5;
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            if (t === 3) { ctx.moveTo(px + i * 13, py + TILE_SIZE); ctx.lineTo(px + i * 13 + 6.5, py + 12); ctx.lineTo(px + (i + 1) * 13, py + TILE_SIZE); }
                            else if (t === 4) { ctx.moveTo(px + i * 13, py); ctx.lineTo(px + i * 13 + 6.5, py + TILE_SIZE - 12); ctx.lineTo(px + (i + 1) * 13, py); }
                            else if (t === 5) { ctx.moveTo(px + TILE_SIZE, py + i * 13); ctx.lineTo(px + 12, py + i * 13 + 6.5); ctx.lineTo(px + TILE_SIZE, py + (i + 1) * 13); }
                            else if (t === 6) { ctx.moveTo(px, py + i * 13); ctx.lineTo(px + TILE_SIZE - 12, py + i * 13 + 6.5); ctx.lineTo(px, py + (i + 1) * 13); }
                            ctx.fill(); ctx.stroke();
                        }
                    }
                }
            }
        }

        function drawStone(px, py) {
            ctx.fillStyle = '#95a5a6'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4, 8); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(px + 8, py + 10); ctx.lineTo(px + 18, py + 16); ctx.lineTo(px + 28, py + 12); ctx.stroke();
        }

        function drawPortal() {
            const cx = portal.x * TILE_SIZE + TILE_SIZE / 2;
            const cy = portal.y * TILE_SIZE + TILE_SIZE / 2;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(portalAngle);
            const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, TILE_SIZE * 0.55);
            grad.addColorStop(0, '#10002b'); grad.addColorStop(0.5, '#7b2cbf'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, TILE_SIZE * 0.55, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#e0aaff'; ctx.lineWidth = 3; ctx.beginPath();
            for (let i = 0; i < 20; i++) {
                const a = 0.35 * i;
                const x = (1 + 0.9 * a) * Math.cos(a); const y = (1 + 0.9 * a) * Math.sin(a);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke(); ctx.restore();
        }

        function drawApple(px, py) {
            const cx = px + TILE_SIZE / 2; const cy = py + TILE_SIZE / 2 + 2;
            ctx.fillStyle = '#e63946';
            ctx.beginPath(); ctx.arc(cx - 5, cy, 11, 0, Math.PI * 2); ctx.arc(cx + 5, cy, 11, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(cx - 6, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#4a2810'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.quadraticCurveTo(cx - 2, cy - 16, cx + 4, cy - 15); ctx.stroke();
            ctx.fillStyle = '#52b788'; ctx.beginPath(); ctx.ellipse(cx + 6, cy - 13, 5, 2.5, 0.4, 0, Math.PI * 2); ctx.fill();
        }

        // 隙間なく一体化してつながる角丸四角のワーム描画
        // 原作準拠：背中も適度に丸いカプセル状ボディ、区切り線なし、お腹の黄緑、顔パーツ
            function drawWorm() {
                    let t = 1;
                    if (prevWorm && !isEditMode) {
                        t = Math.min(1, (performance.now() - moveStartTime) / MOVE_DURATION);
                        if (t >= 1) prevWorm = null;
                    }

                    const renderWorm = worm.map((part, i) => {
                        if (!prevWorm || isEditMode) return { x: part.x, y: part.y };
                        const prev = prevWorm[i] || prevWorm[prevWorm.length - 1] || part;
                        return {
                            x: prev.x + (part.x - prev.x) * t,
                            y: prev.y + (part.y - prev.y) * t
                        };
                    });

                    const pad = 2;
                    const size = TILE_SIZE - pad * 2;
                    const r = size * 0.45;

                // ========================================================
                // 1. 胴体
                // ========================================================
                for (let i = renderWorm.length - 1; i >= 0; i--) {
                    const part = renderWorm[i];

                    const px = part.x * TILE_SIZE + pad;
                    const py = part.y * TILE_SIZE + pad;

                    // この節の前後から向きを求める
                    let dx = 1;
                    let dy = 0;
                    let bendDirection = 0; // 0: 直進, 1: お腹側がへこみ(内側), -1: 背中側がへこみ(お腹が出っ張り)

                    if (i === 0 && renderWorm.length > 1) {
                        dx = renderWorm[0].x - renderWorm[1].x;
                        dy = renderWorm[0].y - renderWorm[1].y;
                    } else if (i > 0 && i < renderWorm.length - 1) {
                        const prev = renderWorm[i - 1];
                        const next = renderWorm[i + 1];

                        // 角を通って斜めになっているかの判定
                        if (Math.abs(prev.x - next.x) > 0.01 && Math.abs(prev.y - next.y) > 0.01) {
                            // 前後のベクトルから曲がり方向（外積）を算出
                            // v1: 後ろからこの節へ (part - next)
                            // v2: この節から前へ (prev - part)
                            const v1x = part.x - next.x;
                            const v1y = part.y - next.y;
                            const v2x = prev.x - part.x;
                            const v2y = prev.y - part.y;
                            const cross = v1x * v2y - v1y * v2x;

                            // 右向き基準でお腹は「下(+Y)側」にあるため、
                            // 外積の符号によって「お腹側へ曲がっている(へこみ)」か「背中側へ曲がっている(出っ張り)」かを判別
                            bendDirection = (cross > 0) ? 1 : -1;
                        }

                        dx = renderWorm[i - 1].x - renderWorm[i + 1].x;
                        dy = renderWorm[i - 1].y - renderWorm[i + 1].y;
                    } else if (i > 0) {
                        dx = renderWorm[i - 1].x - renderWorm[i].x;
                        dy = renderWorm[i - 1].y - renderWorm[i].y;
                    }

                    // 正規化
                    const len = Math.hypot(dx, dy) || 1;
                    dx /= len;
                    dy /= len;

                    // 右向き基準の胴体を、進行方向に合わせて回転
                    const angle = Math.atan2(dy, dx);

                    ctx.save();

                    // 通常時は完全に元のまま（size * 0.42）
                    ctx.translate(
                        px + size / 2,
                        py + size * 0.42
                    );

                    ctx.rotate(angle);

                    // ★★★ ここでお腹へこみ角／お腹出っ張り角を個別に微調整！ ★★★
                    if (bendDirection === 1) {
                        // 【パターンA: お腹側がへこむ角（お腹が内側カーブ）】
                        // プラス(+)  : お腹側へ移動
                        // マイナス(-): 背中側へ移動
                        const innerBellyShift = 4; // ← ★ここを調整（へこみ角の時の位置）
                        ctx.translate(0, innerBellyShift);

                    } else if (bendDirection === -1) { // ← ★ここを「-1」に修正しました！
                        // 【パターンB: お腹側が出っ張る角（背中が内側、お腹が外側カーブ）】
                        // プラス(+)  : お腹側へ移動
                        // マイナス(-): 背中側へ移動
                        const outerBellyShift = -8; // ← ★ここを調整（出っ張り角の時の位置）
                        ctx.translate(0, outerBellyShift);
                    }

                    // -----------------------------
                    // お腹（元のコードそのまま）
                    // -----------------------------
                    ctx.fillStyle = '#b0ea08';
                    ctx.beginPath();
                    ctx.roundRect(
                        -size * 0.60,
                        0,
                        size * 1.20,
                        size * 0.58,
                        size * 0.28
                    );
                    ctx.fill();

                    // -----------------------------
                    // 背中（元のコードそのまま）
                    // -----------------------------
                    ctx.fillStyle = '#1fae49';
                    ctx.beginPath();
                    ctx.ellipse(
                        0,
                        0,
                        size * 0.60,
                        size * 0.42,
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();

                    ctx.restore();
                }

                    // 隣接節の間を自然につなぐ緑の帯
                    ctx.fillStyle = '#1fae49';
                for (let i = 0; i < renderWorm.length - 1; i++) {
                    const c = renderWorm[i];
                    const n = renderWorm[i + 1];
                    const cx = (c.x + n.x) * TILE_SIZE / 2 + TILE_SIZE / 2;
                    const cy = (c.y + n.y) * TILE_SIZE / 2 + TILE_SIZE / 2;

                    ctx.beginPath();
                    if (Math.abs(c.x - n.x) > 0) {
                        // 横移動のつなぎ目（角丸）
                        ctx.roundRect(
                            cx - TILE_SIZE * 0.45,
                            cy - TILE_SIZE * 0.35,
                            TILE_SIZE * 0.9,
                            TILE_SIZE * 0.52,
                            8 // ← 角の丸み（半径）
                        );
                    } else if (Math.abs(c.y - n.y) > 0) {
                        // 縦移動のつなぎ目（角丸）
                        ctx.roundRect(
                            cx - TILE_SIZE * 0.35,
                            cy - TILE_SIZE * 0.45,
                            TILE_SIZE * 0.52,
                            TILE_SIZE * 0.9,
                            8 // ← 角の丸み（半径）
                        );
                    }
                    ctx.fill();
                }

                    // ========================================================
                    // 3. 頭部パーツ（下側に唇、上側に目玉、正しい重なり順・大口パクリ）
                    // ========================================================
                    if (renderWorm.length > 0 && !isSucking) {
                        const head = renderWorm[0];
                        const cx = head.x * TILE_SIZE + TILE_SIZE / 2;
                        const cy = head.y * TILE_SIZE + TILE_SIZE / 2;

                        const isEating = performance.now() < eatAnimationUntil;
                        let eatProgress = 0;
                        if (isEating) {
                            const remaining = eatAnimationUntil - performance.now();
                            eatProgress = Math.sin(Math.max(0, Math.min(1, remaining / 420)) * Math.PI);
                        }

                        ctx.save();
                        ctx.translate(cx, cy);

                        const angle = Math.atan2(wormDir.y, wormDir.x);
                        ctx.rotate(angle);

                        //if (wormDir.x < 0) {
                        //    ctx.scale(1, -1);
                        //}

                        // --- 口・唇 ---
                        if (isEating && eatProgress > 0.05) {
                            const openH = 14 * eatProgress;
                            const mouthX = 10;

                            ctx.fillStyle = '#1c0018';
                            ctx.beginPath();
                            ctx.ellipse(mouthX - 2, 2, 9, openH + 2, 0, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.fillStyle = '#b6009f';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(mouthX, 2 - openH, 7, 4.5, -0.2, 0, Math.PI * 2);
                            ctx.fill(); ctx.stroke();

                            ctx.beginPath();
                            ctx.ellipse(mouthX, 2 + openH, 7, 4.5, 0.2, 0, Math.PI * 2);
                            ctx.fill(); ctx.stroke();
                        } else {
                            const lipX = 10;
                            const lipY = 9;
                            ctx.fillStyle = '#b6009f';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1.8;
                            ctx.beginPath();
                            ctx.roundRect(lipX - 4, lipY - 5, 13, 11, 5);
                            ctx.fill(); ctx.stroke();

                            ctx.beginPath();
                            ctx.moveTo(lipX - 2, lipY + 0.5);
                            ctx.lineTo(lipX + 7, lipY + 0.5);
                            ctx.stroke();
                        }

                        // --- 目玉（奥の目を描いてから手前の目で上書き） ---
                        const drawEye = (ex, ey, r) => {
                            ctx.fillStyle = '#ffffff';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1.8;
                            ctx.beginPath();
                            ctx.arc(ex, ey, r, 0, Math.PI * 2);
                            ctx.fill(); ctx.stroke();

                            ctx.fillStyle = '#000000';
                            ctx.beginPath();
                            ctx.arc(ex + 1.8, ey, isEating ? 2.8 : 2.2, 0, Math.PI * 2);
                            ctx.fill();

                            if (!isEating) {
                                ctx.fillStyle = '#4a3b50';
                                ctx.strokeStyle = '#000000';
                                ctx.lineWidth = 1.5;
                                ctx.beginPath();
                                ctx.arc(ex, ey, r, Math.PI, 0, false);
                                ctx.closePath();
                                ctx.fill(); ctx.stroke();
                            }
                        };

                        if (isEating && eatProgress > 0.05) {
                            // 手前 → 奥
                            drawEye(7, 4, 6.2);
                            drawEye(3, -2, 6.2);
                        } else {
                            // 手前 → 奥
                            drawEye(10, -4, 5.5);
                            drawEye(4, -4, 5.5);
                        }

                        ctx.restore();
                    }
                }

        /* ============================================================
           エディタ機能（お尻延長・胴体短縮・頭ドラッグ・右クリックスポイト）
        ============================================================ */
        let isEditMode = false;
        let selectedChip = '#';
        let isPainting = false;
        let isDraggingHead = false;

        let editorUndoStack = [];
        let editorRedoStack = [];

        function saveEditorState() {
            if (!isEditMode) return;
            editorUndoStack.push({
                tiles: JSON.parse(JSON.stringify(tiles)),
                apples: JSON.parse(JSON.stringify(apples)),
                stones: JSON.parse(JSON.stringify(stones)),
                portal: { ...portal },
                worm: JSON.parse(JSON.stringify(worm))
            });
            editorRedoStack = [];
        }

        function editorUndo() {
            if (editorUndoStack.length === 0) return;
            editorRedoStack.push({
                tiles: JSON.parse(JSON.stringify(tiles)),
                apples: JSON.parse(JSON.stringify(apples)),
                stones: JSON.parse(JSON.stringify(stones)),
                portal: { ...portal },
                worm: JSON.parse(JSON.stringify(worm))
            });
            const prev = editorUndoStack.pop();
            tiles = prev.tiles; apples = prev.apples; stones = prev.stones;
            portal = prev.portal; worm = prev.worm;
            sfx.step(); draw();
        }

        function editorRedo() {
            if (editorRedoStack.length === 0) return;
            editorUndoStack.push({
                tiles: JSON.parse(JSON.stringify(tiles)),
                apples: JSON.parse(JSON.stringify(apples)),
                stones: JSON.parse(JSON.stringify(stones)),
                portal: { ...portal },
                worm: JSON.parse(JSON.stringify(worm))
            });
            const next = editorRedoStack.pop();
            tiles = next.tiles; apples = next.apples; stones = next.stones;
            portal = next.portal; worm = next.worm;
            sfx.step(); draw();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-toggle-btn');
            const palette = document.getElementById('editor-palette');

            if (isEditMode) {
                btn.innerText = "🎮 プレイ"; btn.style.background = "#2ed573"; btn.style.color = "#fff";
                palette.style.display = "flex"; isAnimating = false;
            } else {
                btn.innerText = "🛠️ エディタ"; btn.style.background = ""; btn.style.color = "";
                palette.style.display = "none";

                // 編集内容をステージに自動同期
                STAGES[currentLevelIndex] = {
                    tiles: JSON.parse(JSON.stringify(tiles)),
                    apples: JSON.parse(JSON.stringify(apples)),
                    stones: JSON.parse(JSON.stringify(stones)),
                    portal: { ...portal },
                    worm: JSON.parse(JSON.stringify(worm)),
                    wormDir: { ...wormDir }
                };

                history = []; isClear = false; isSucking = false;
                isAnimating = true;
                applyAllPhysics().then(() => { isAnimating = false; });
            }
            draw();
        }

        function setChip(chip, el) {
            selectedChip = chip;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function clearCustomMap() {
            if (!confirm("全消去しますか？")) return;
            saveEditorState();
            tiles = Array.from({ length: gridRows }, () => Array(gridCols).fill(0));
            apples = []; stones = []; draw();
        }

        function applyChipToGrid(e) {
            if (!isEditMode) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            if (x < 0 || x >= gridCols || y < 0 || y >= gridRows) return;

            tiles[y][x] = 0;
            apples = apples.filter(a => !(a.x === x && a.y === y));
            stones = stones.filter(s => !(s.x === x && s.y === y));

            if (selectedChip === '#') tiles[y][x] = 1;
            else if (selectedChip === 'B') tiles[y][x] = 7;
            else if (selectedChip === 'X') tiles[y][x] = 2;
            else if (selectedChip === '^') tiles[y][x] = 3;
            else if (selectedChip === 'v') tiles[y][x] = 4;
            else if (selectedChip === '<') tiles[y][x] = 5;
            else if (selectedChip === '>') tiles[y][x] = 6;
            else if (selectedChip === 'S') stones.push({ x, y });
            else if (selectedChip === 'A') apples.push({ x, y });
            else if (selectedChip === 'P') portal = { x, y };
            else if (selectedChip === 'W') worm = [{ x, y }, { x: Math.max(0, x - 1), y }, { x: Math.max(0, x - 2), y }];
            draw();
        }

        // 右クリック：スポイト機能
        canvas.addEventListener('contextmenu', (e) => {
            if (!isEditMode) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            if (x < 0 || x >= gridCols || y < 0 || y >= gridRows) return;

            let picked = '.';
            if (worm.some(p => p.x === x && p.y === y)) picked = 'W';
            else if (apples.some(a => a.x === x && a.y === y)) picked = 'A';
            else if (stones.some(s => s.x === x && s.y === y)) picked = 'S';
            else if (portal.x === x && portal.y === y) picked = 'P';
            else {
                const t = tiles[y][x];
                if (t === 1) picked = '#';
                else if (t === 7) picked = 'B';
                else if (t === 2) picked = 'X';
                else if (t === 3) picked = '^';
                else if (t === 4) picked = 'v';
                else if (t === 5) picked = '<';
                else if (t === 6) picked = '>';
            }

            selectedChip = picked;
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick')?.includes(`'${picked}'`));
            });
            sfx.step();
        });

        // 左クリック：配置・お尻延長・胴体短縮・頭ドラッグ
        canvas.addEventListener('pointerdown', (e) => {
            if (!isEditMode || e.button !== 0) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            if (x < 0 || x >= gridCols || y < 0 || y >= gridRows) return;

            // ① お尻をクリック → 1マス延長
            const tail = worm[worm.length - 1];
            if (tail && x === tail.x && y === tail.y) {
                saveEditorState();
                let dx = worm.length >= 2 ? tail.x - worm[worm.length - 2].x : -wormDir.x;
                let dy = worm.length >= 2 ? tail.y - worm[worm.length - 2].y : -wormDir.y;
                const nx = tail.x + dx, ny = tail.y + dy;
                if (nx >= 0 && nx < gridCols && ny >= 0 && ny < gridRows) {
                    worm.push({ x: nx, y: ny });
                    sfx.eat(); draw();
                }
                return;
            }

            // ② 胴体（頭・お尻以外）をクリック → 1マス短縮
            const isBody = worm.some((p, idx) => idx > 0 && idx < worm.length - 1 && p.x === x && p.y === y);
            if (isBody && worm.length > 2) {
                saveEditorState();
                worm.pop();
                sfx.fall(); draw();
                return;
            }

            // ③ 頭をクリック → ドラッグ移動
            const head = worm[0];
            if (head && x === head.x && y === head.y) {
                saveEditorState();
                isDraggingHead = true;
                return;
            }

            // 通常のチップ配置
            saveEditorState();
            isPainting = true;
            applyChipToGrid(e);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isEditMode) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            if (isDraggingHead) {
                if (x >= 0 && x < gridCols && y >= 0 && y < gridRows) {
                    const dx = x - worm[0].x, dy = y - worm[0].y;
                    if (dx !== 0 || dy !== 0) {
                        for (let seg of worm) { seg.x += dx; seg.y += dy; }
                        draw();
                    }
                }
                return;
            }
            if (isPainting) applyChipToGrid(e);
        });

        window.addEventListener('pointerup', () => {
            isDraggingHead = false;
            isPainting = false;
        });

        /* ============================================================
           操作（キーボード＆ゲームパッド対応）
        ============================================================ */
        let lastPadButtons = {};
        let stickCooldown = 0;

        function pollGamepad() {
            const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
            if (!gp) return;
            const stickX = gp.axes[0] || 0; const stickY = gp.axes[1] || 0;
            if (stickCooldown <= 0) {
                if (gp.buttons[12]?.pressed || stickY < -0.5) { handleInput(0, -1); stickCooldown = 15; }
                else if (gp.buttons[13]?.pressed || stickY > 0.5) { handleInput(0, 1); stickCooldown = 15; }
                else if (gp.buttons[14]?.pressed || stickX < -0.5) { handleInput(-1, 0); stickCooldown = 15; }
                else if (gp.buttons[15]?.pressed || stickX > 0.5) { handleInput(1, 0); stickCooldown = 15; }
            } else stickCooldown--;

            const checkBtn = (idx, fn) => {
                if (gp.buttons[idx]?.pressed) { if (!lastPadButtons[idx]) fn(); lastPadButtons[idx] = true; }
                else lastPadButtons[idx] = false;
            };
            checkBtn(0, () => { if (isClear) nextLevel(); });
            checkBtn(1, undo); checkBtn(3, restartLevel); checkBtn(4, prevLevel); checkBtn(5, nextLevel);
        }

        function animate() {
            portalAngle += 0.04;
            sawAngle += 0.04;
            pollGamepad();
            draw();
            requestAnimationFrame(animate);
        }

        window.addEventListener('keydown', (e) => {
            // CTRL+Z (Undo) / CTRL+SHIFT+Z, CTRL+Y (Redo)
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    if (e.shiftKey) editorRedo();
                    else undo();
                    return;
                }
                if (e.key === 'y' || e.key === 'Y') {
                    e.preventDefault();
                    editorRedo();
                    return;
                }
            }

            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': handleInput(0, -1); break;
                case 'ArrowDown': case 's': case 'S': handleInput(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': handleInput(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': handleInput(1, 0); break;
                case 'z': case 'Z': undo(); break;
                case 'r': case 'R': restartLevel(); break;
                case 'u': case 'U': prevLevel(); break;
                case 'i': case 'I': nextLevel(); break;
            }
        });

        // 開始
        loadLevel(0);
        requestAnimationFrame(animate);
    </script>
</body>
