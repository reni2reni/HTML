        function getAzimuthAtLocation(phi, dec, H, alt) {
            const east = -Math.cos(dec) * Math.sin(H);
            const north = Math.sin(dec) * Math.cos(phi) - Math.cos(dec) * Math.cos(H) * Math.sin(phi);
            if (Math.hypot(east, north) < 1e-12) return 0;
            let az = Math.atan2(east, north);
            if (az < 0) az += 2 * Math.PI;
            return az;
        }

        // ==========================================
        // 4. 地平座標変換 & 月の満ち欠け
        // ==========================================
        function toHorizontal(geoX, geoY, geoZ, dDays) {
            const eps = 23.4392911 * (Math.PI / 180);
            const phi = currentCity.lat * (Math.PI / 180);
            const lon = currentCity.lon;

            const eqX = geoX;
            const eqY = geoY * Math.cos(eps) - geoZ * Math.sin(eps);
            const eqZ = geoY * Math.sin(eps) + geoZ * Math.cos(eps);

            const ra = Math.atan2(eqY, eqX);
            const dec = Math.atan2(eqZ, Math.sqrt(eqX * eqX + eqY * eqY));

            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + lon) % 360) * (Math.PI / 180);
            const H = lmstRad - ra;

            const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
            const alt = Math.asin(sinAlt);
            const az = getAzimuthAtLocation(phi, dec, H, alt);

            return { alt: alt * (180 / Math.PI), az: az * (180 / Math.PI) };
        }

        function raDecToHorizontal(raDeg, decDeg, dDays) {
            const phi = currentCity.lat * (Math.PI / 180);
            const dec = decDeg * (Math.PI / 180);
            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + currentCity.lon) % 360) * (Math.PI / 180);
            const H = lmstRad - (raDeg * Math.PI / 180);

            const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
            const alt = Math.asin(sinAlt);
            const cosAz = (Math.sin(dec) - Math.sin(phi) * sinAlt) / (Math.cos(phi) * Math.cos(alt));
            const sinAz = -Math.cos(dec) * Math.sin(H) / Math.cos(alt);
            let az = Math.atan2(sinAz, cosAz);
            if (az < 0) az += 2 * Math.PI;

            return { alt: alt * (180 / Math.PI), az: az * (180 / Math.PI) };
        }

        function getMoonGeocentricVector3D(dDays, T) {
            const moonData = (planetsConfig.find(p => p.isEarth)?.moons || []).find(m => m.name === '月');
            const rad = Math.PI / 180;
            const angleRad = getMoonGeocentricEclipticLon(dDays, T) * rad;
            const inc = ((moonData && moonData.incDeg) || 5.145) * rad;
            const nodeDeg = ((moonData && moonData.node0Deg) || 125.0445) + ((moonData && moonData.nodeRateDegPerDay) || -0.05295392) * dDays;
            const node = nodeDeg * rad;
            const u = angleRad - node;
            const distKm = 384400;
            const xEcl = distKm * (Math.cos(node) * Math.cos(u) - Math.sin(node) * Math.sin(u) * Math.cos(inc));
            const yEcl = distKm * (Math.sin(node) * Math.cos(u) + Math.cos(node) * Math.sin(u) * Math.cos(inc));
            const zEcl = distKm * (Math.sin(u) * Math.sin(inc));
            return { x: xEcl, y: yEcl, z: zEcl };
        }

        function getObserverGeocentricVector3D(dDays) {
            const eps = 23.4392911 * (Math.PI / 180);
            const phi = currentCity.lat * (Math.PI / 180);
            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + currentCity.lon) % 360) * (Math.PI / 180);
            const rEarthKm = 6378;

            const eqX = rEarthKm * Math.cos(phi) * Math.cos(lmstRad);
            const eqY = rEarthKm * Math.cos(phi) * Math.sin(lmstRad);
            const eqZ = rEarthKm * Math.sin(phi);

            const xEcl = eqX;
            const yEcl = eqY * Math.cos(eps) + eqZ * Math.sin(eps);
            const zEcl = -eqY * Math.sin(eps) + eqZ * Math.cos(eps);
            return { x: xEcl, y: yEcl, z: zEcl };
        }

        function drawMoonPhase3D(ctx, cx, cy, r, dDays, T, ePos, skyBgColor) {
            const vecSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
            const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
            const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
            const len = (a) => Math.hypot(a.x, a.y, a.z);
            const norm = (a) => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l, z: a.z / l }; };

            const AU_TO_KM = 149597870.7;
            const sunGeoKm = { x: -ePos.x * AU_TO_KM, y: -ePos.y * AU_TO_KM, z: -ePos.z * AU_TO_KM };
            const moonGeoKm = getMoonGeocentricVector3D(dDays, T);
            const obsGeoKm = getObserverGeocentricVector3D(dDays);

            const viewDir = norm(vecSub(moonGeoKm, obsGeoKm));
            const toSunDir = norm(vecSub(sunGeoKm, moonGeoKm));

            let screenUp3D = { x: 0, y: 0, z: 1 };
            const upDotView = dot(screenUp3D, viewDir);
            screenUp3D = { x: screenUp3D.x - upDotView * viewDir.x, y: screenUp3D.y - upDotView * viewDir.y, z: screenUp3D.z - upDotView * viewDir.z };
            if (len(screenUp3D) < 1e-6) screenUp3D = { x: 0, y: 1, z: 0 };
            screenUp3D = norm(screenUp3D);
            const screenRight3D = norm(cross(viewDir, screenUp3D));

            const sunInDisk = {
                x: toSunDir.x - dot(toSunDir, viewDir) * viewDir.x,
                y: toSunDir.y - dot(toSunDir, viewDir) * viewDir.y,
                z: toSunDir.z - dot(toSunDir, viewDir) * viewDir.z
            };

            const cosPhase = Math.max(-1, Math.min(1, dot(toSunDir, viewDir)));
            const diskProjLen = len(sunInDisk);

            const sunCanvasX = dot(sunInDisk, screenRight3D);
            const sunCanvasY = -dot(sunInDisk, screenUp3D);

            ctx.save();
            ctx.translate(cx, cy);

            const shadowColor = skyBgColor || '#020208';
            const lightColor = '#fffdf0';

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = shadowColor;
            ctx.fill();

            if (diskProjLen < 1e-4 && cosPhase > 0.9995) {
                ctx.restore();
                return;
            }

            if (diskProjLen < 1e-4 && cosPhase < -0.9995) {
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = lightColor;
                ctx.shadowColor = '#ffffcc';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
                return;
            }

            const lightAngle = Math.atan2(sunCanvasY, sunCanvasX);
            ctx.rotate(lightAngle);

            const litCos = Math.max(-1, Math.min(1, -cosPhase));
            const terminatorXFactor = -litCos;

            const steps = 64;
            ctx.beginPath();
            ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
            for (let i = steps; i >= 0; i--) {
                const theta = -Math.PI / 2 + (Math.PI * i) / steps;
                const y = r * Math.sin(theta);
                const maxX = r * Math.cos(theta);
                const x = terminatorXFactor * maxX;
                ctx.lineTo(x, y);
            }
            ctx.closePath();

            ctx.fillStyle = lightColor;
            ctx.shadowColor = '#ffffcc';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }

        // ==========================================
        // 4.5 背景薄雲・雨・雪の描画処理
        // ==========================================
        let cloudAnimTime = 0;
        function drawBackgroundClouds(ctx, w, horizonY, zenithY, sunAlt, weatherOpacity) {
            if (!showWeather || weatherOpacity <= 0 || currentWeather.cloudCover <= 3) return;

            const cloudBrightness = sunAlt > 0 ? 1.0 : (sunAlt > -6 ? 0.65 : 0.10);
            const nightFactor = sunAlt <= -6 ? 0.2 : 1.0;
            const maxAlpha = Math.min(0.28, (currentWeather.cloudCover / 100) * 0.32)
                * weatherOpacity * cloudBrightness;
            const skyH = Math.max(100, horizonY - zenithY);
            const t = cloudAnimTime * 0.00008;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, zenithY, w, horizonY - zenithY);
            ctx.clip();

            if (currentWeather.isRaining) {
                const cloudGrad = ctx.createLinearGradient(0, zenithY, 0, horizonY);

                cloudGrad.addColorStop(0, `rgba(105, 115, 130, ${0.78 * nightFactor})`);
                cloudGrad.addColorStop(0.5, `rgba(125, 135, 150, ${0.68 * nightFactor})`);
                cloudGrad.addColorStop(1, `rgba(150, 155, 165, ${0.55 * nightFactor})`);

                ctx.globalAlpha = weatherOpacity;
                ctx.fillStyle = cloudGrad;
                ctx.fillRect(0, zenithY, w, horizonY - zenithY);
                ctx.globalAlpha = 1;
            }

            const cloudColor = sunAlt > 0
                ? 'rgba(255, 255, 255,'
                : (sunAlt > -6 ? 'rgba(220, 190, 210,' : 'rgba(160, 185, 225,');

            const cloudBlobs = [
                { fx: 0.18, fy: 0.35, rx: w * 0.42, ry: skyH * 0.28, speed: 1.0 },
                { fx: 0.55, fy: 0.45, rx: w * 0.48, ry: skyH * 0.32, speed: 0.75 },
                { fx: 0.88, fy: 0.30, rx: w * 0.38, ry: skyH * 0.26, speed: 1.2 },
                { fx: 0.32, fy: 0.65, rx: w * 0.52, ry: skyH * 0.35, speed: 0.6 },
                { fx: 0.76, fy: 0.70, rx: w * 0.45, ry: skyH * 0.30, speed: 0.9 }
            ];

            cloudBlobs.forEach((b) => {
                const shiftX = ((b.fx + t * b.speed) % 1.4) - 0.2;
                const cx = shiftX * w;
                const cy = zenithY + b.fy * skyH;

                const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(b.rx, b.ry));
                grad.addColorStop(0, `${cloudColor} ${maxAlpha.toFixed(3)})`);
                grad.addColorStop(0.5, `${cloudColor} ${(maxAlpha * 0.5).toFixed(3)})`);
                grad.addColorStop(1, `${cloudColor} 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(cx, cy, b.rx, b.ry, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function drawPrecipitation(ctx, w, horizonY, zenithY, weatherOpacity) {
            if (!showWeather || weatherOpacity <= 0) return;
            const isRaining = currentWeather.isRaining;
            const isSnowing = currentWeather.isSnowing;
            if (!isRaining && !isSnowing) return;

            const skyH = Math.max(100, horizonY - zenithY);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, zenithY, w, horizonY - zenithY);
            ctx.clip();

            ctx.globalAlpha = weatherOpacity;
            if (isRaining) {
                // 降水量(mm)に応じて雨粒の本数を増減。弱い雨でも視認できる最低本数を確保。
                const rainMm = Math.max(0, Number(currentWeather.precipitation) || 0);
                const rainRatio = Math.min(1, rainMm / 12);
                const activeRainCount = Math.min(
                    MAX_RAIN_PARTICLES,
                    Math.round(24 + rainRatio * (MAX_RAIN_PARTICLES - 24))
                );
                ctx.strokeStyle = 'rgba(80, 80, 255, 0.62)';
                ctx.lineWidth = 2.0;
                for (let i = 0; i < activeRainCount; i++) {
                    const p = rainParticles[i];
                    p.y += p.speed;
                    p.x += p.speed * 0.22;
                    if (p.y > 1) { p.y = 0; p.x = Math.random(); }
                    if (p.x > 1) { p.x = 0; }

                    const px = p.x * w;
                    const py = zenithY + p.y * skyH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + p.len * 0.22, py + p.len);
                    ctx.stroke();
                }
            } else if (isSnowing) {
                snowParticles.forEach(p => {
                    p.y += p.speedY;
                    p.swing += p.swingSpeed;
                    if (p.y > 1) { p.y = 0; p.x = Math.random(); }

                    const px = (p.x + Math.sin(p.swing) * 0.02) * w;
                    const py = zenithY + p.y * skyH;
                    ctx.beginPath();
                    ctx.arc(px, py, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(240, 250, 255, 0.65)';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                    ctx.shadowBlur = 3;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            ctx.restore();
        }

        const CONSTELLATION_STORAGE_KEY = 'solarCustomConstellationsV1';
        function cloneConstellations(data) {
            return JSON.parse(JSON.stringify(data));

        function loadConstellationsData() {
            const base = cloneConstellations(DEFAULT_CONSTELLATIONS);
            base.forEach(c => { c.visible = true; });
            try {
                const raw = localStorage.getItem(CONSTELLATION_STORAGE_KEY);
                if (!raw) return base;
                const savedMap = JSON.parse(raw);
                if (!savedMap || typeof savedMap !== 'object') return base;
                base.forEach(c => {
                    const saved = savedMap[c.name];
                    if (!saved) return;
                    if (typeof saved.visible === 'boolean') {
                        c.visible = saved.visible;
                    }
                    if (saved.starStyles && typeof saved.starStyles === 'object') {
                        c.starStyles = c.starStyles || {};
                        for (const k in saved.starStyles) {
                            const st = saved.starStyles[k];
                            if (!st || typeof st !== 'object') continue;
                            const size = Number(st.size), color = String(st.color || '');
                            c.starStyles[k] = {
                                size: Number.isFinite(size) ? Math.max(0.5, Math.min(4, size)) : 1,
                                color: /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#ffffff'
                            };
                        }
                    }
                    if (saved.stars && typeof saved.stars === 'object') {
                        for (const k in saved.stars) {
                            if (Array.isArray(saved.stars[k]) && saved.stars[k].length === 2 &&
                                Number.isFinite(Number(saved.stars[k][0])) && Number.isFinite(Number(saved.stars[k][1]))) {
                                c.stars[k] = [Number(saved.stars[k][0]), Number(saved.stars[k][1])];
                            }
                        }
                    }
                    if (Array.isArray(saved.lines)) {
                        c.lines = saved.lines.filter(pair =>
                            Array.isArray(pair) && pair.length === 2 &&
                            Object.prototype.hasOwnProperty.call(c.stars, pair[0]) &&
                            Object.prototype.hasOwnProperty.call(c.stars, pair[1])
                        );
                    }
                });
            } catch (_) { }
            return base;
        }

                        lines: c.lines

        function computeConstEditorProjection(c, w, h) {
            const keys = Object.keys(c.stars);
            if (keys.length === 0) return null;

            // 赤経(RA)の0/360跨ぎに対応した中心算出
            const rad = Math.PI / 180;
            let sumSin = 0, sumCos = 0, minDec = 90, maxDec = -90;
            keys.forEach(k => {
                const [ra, dec] = c.stars[k];
                sumSin += Math.sin(ra * rad);
                sumCos += Math.cos(ra * rad);
                if (dec < minDec) minDec = dec;
                if (dec > maxDec) maxDec = dec;
            });
            const centerRa = ((Math.atan2(sumSin, sumCos) / rad) + 360) % 360;
            const centerDec = (minDec + maxDec) / 2;
            const cosDec = Math.max(0.2, Math.cos(centerDec * rad));

            // 各星のローカル相対座標 (東が左: -dRa * cosDec, 北が上: dDec)
            const localPts = {};
            let maxAbsX = 2.5, maxAbsY = 2.5;
            keys.forEach(k => {
                const [ra, dec] = c.stars[k];
                const dRa = ((ra - centerRa + 540) % 360) - 180;
                const lx = -dRa * cosDec;
                const ly = dec - centerDec;
                localPts[k] = { lx, ly };
                if (Math.abs(lx) > maxAbsX) maxAbsX = Math.abs(lx);
                if (Math.abs(ly) > maxAbsY) maxAbsY = Math.abs(ly);
            });

            const pad = 48;
            const scaleX = (w / 2 - pad) / maxAbsX;
            const scaleY = (h / 2 - pad) / maxAbsY;
            const baseScale = Math.max(4, Math.min(scaleX, scaleY));
            const scale = baseScale * editorZoom;

            const cx = w / 2 + editorPanX;
            const cy = h / 2 + editorPanY;
            const starPts = {};
            keys.forEach(k => {
                starPts[k] = {
                    x: cx + localPts[k].lx * scale,
                    y: cy - localPts[k].ly * scale
                };
            });

            const activeSet = new Set();
            c.lines.forEach(([a, b]) => {
                const pairKey = a < b ? `${a}|${b}` : `${b}|${a}`;
                activeSet.add(pairKey);
            });

            const segments = [];
            for (let i = 0; i < keys.length; i++) {
                for (let j = i + 1; j < keys.length; j++) {
                    const k1 = keys[i];
                    const k2 = keys[j];
                    const pairKey = k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`;
                    segments.push({
                        k1, k2,
                        pairKey,
                        active: activeSet.has(pairKey),
                        x1: starPts[k1].x,
                        y1: starPts[k1].y,
                        x2: starPts[k2].x,
                        y2: starPts[k2].y
                    });
                }
            }

            return { starPts, segments, cx, cy, baseScale, scale, centerRa, centerDec, cosDec };
        }

        function drawEditorScene(c, proj) {
            const w = constEditorCanvas.width;
            const h = constEditorCanvas.height;
            const ctx = constEditorCtx;

            ctx.clearRect(0, 0, w, h);

            // 背景グリッド（パン・ズーム連動）
            const gridStep = 32 * editorZoom;
            if (gridStep >= 8) {
                ctx.strokeStyle = 'rgba(70, 120, 190, 0.14)';
                ctx.lineWidth = 1;
                const startX = ((w / 2 + editorPanX) % gridStep + gridStep) % gridStep;
                const startY = ((h / 2 + editorPanY) % gridStep + gridStep) % gridStep;
                for (let x = startX; x < w; x += gridStep) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                }
                for (let y = startY; y < h; y += gridStep) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                }
            }

            // 星座名タイトル＆ズーム倍率
            ctx.fillStyle = 'rgba(160, 215, 255, 0.88)';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`${getConstDisplayName(c)}  (${editorZoom.toFixed(2)}x)`, 12, 10);

            // 1. すべての候補ラインをまず破線で描画
            proj.segments.forEach(seg => {
                if (!seg.active) {
                    ctx.save();
                    ctx.setLineDash([5, 5]);
                    ctx.strokeStyle = 'rgba(125, 175, 235, 0.36)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // 2. 有効化されたラインを実線で描画
            proj.segments.forEach(seg => {
                if (seg.active) {
                    ctx.save();
                    ctx.setLineDash([]);
                    ctx.strokeStyle = '#38e8ff';
                    ctx.lineWidth = 2.6;
                    ctx.shadowColor = 'rgba(0, 225, 255, 0.65)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(seg.x2, seg.y2);
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // 3. 星ノードの描画
            for (const key in proj.starPts) {
                const pt = proj.starPts[key];
                const isSelected = (key === editorSelectedStarKey);

                if (isSelected) {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffdd55';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                const starStyle = getConstellationStarStyle(c, key);
                const starColor = isSelected ? '#ffee66' : (starStyle.color || '#ffffff');
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, (isSelected ? 6.5 : 5.2) * starStyle.size, 0, Math.PI * 2);
                ctx.fillStyle = starColor;
                ctx.shadowColor = isSelected ? '#ffcc00' : starColor;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = isSelected ? '#ffee88' : '#cfe6ff';
                ctx.font = isSelected ? 'bold 12px sans-serif' : '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(key, pt.x, pt.y - 9);
            }
        }

        function renderConstEditorCanvas() {
            resizeConstEditorCanvas();
            const w = constEditorCanvas.width;
            const h = constEditorCanvas.height;
            const c = CONSTELLATIONS[editorSelectedConstIdx];
            if (!c) return;

            const proj = computeConstEditorProjection(c, w, h);
            editorProjCache = proj;
            if (!proj) return;

            drawEditorScene(c, proj);
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        function applyConstellationEditAndRefresh() {
            saveConstellationsData();
            renderConstEditorCanvas();
            if (isSkyMode) renderTokyoSky(simDate);
        }

        // ホイールでカーソル位置を中心に拡大・縮小
        constEditorCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = constEditorCanvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const w = constEditorCanvas.width;
            const h = constEditorCanvas.height;

            const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            const prevZoom = editorZoom;
            const nextZoom = Math.max(0.4, Math.min(10.0, prevZoom * zoomFactor));
            if (nextZoom === prevZoom) return;

            const ratio = nextZoom / prevZoom;
            const baseCx = w / 2;
            const baseCy = h / 2;
            editorPanX = mx - baseCx - ratio * (mx - (baseCx + editorPanX));
            editorPanY = my - baseCy - ratio * (my - (baseCy + editorPanY));
            editorZoom = nextZoom;

            renderConstEditorCanvas();
        }, { passive: false });

        constEditorCanvas.addEventListener('pointerdown', (e) => {
            if (!editorProjCache) return;
            const rect = constEditorCanvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            // 星のヒット判定（優先）
            let hitStar = null;
            let bestStarDist = 16;
            for (const key in editorProjCache.starPts) {
                const pt = editorProjCache.starPts[key];
                const d = Math.hypot(px - pt.x, py - pt.y);
                if (d < bestStarDist) {
                    bestStarDist = d;
                    hitStar = key;
                }
            }

            if (hitStar) {
                editorSelectedStarKey = hitStar;
                editorDraggingStarKey = hitStar;
                editorDragMoved = false;
                constEditorCanvas.setPointerCapture(e.pointerId);
                updateSelectedStarInfo();
                renderConstEditorCanvas();
                return;
            }

            // 星以外をドラッグした場合はキャンバス全体をパン移動
            editorIsPanning = true;
            editorDragMoved = false;
            editorPanStartX = e.clientX;
            editorPanStartY = e.clientY;
            editorPanOriginX = editorPanX;
            editorPanOriginY = editorPanY;
            constEditorCanvas.style.cursor = 'grabbing';
            constEditorCanvas.setPointerCapture(e.pointerId);
        });

        constEditorCanvas.addEventListener('pointermove', (e) => {
            if (editorIsPanning) {
                const dx = e.clientX - editorPanStartX;
                const dy = e.clientY - editorPanStartY;
                if (Math.hypot(dx, dy) > 4) editorDragMoved = true;
                editorPanX = editorPanOriginX + dx;
                editorPanY = editorPanOriginY + dy;
                renderConstEditorCanvas();
                return;
            }

            if (!editorDraggingStarKey || !editorProjCache) return;
            const c = CONSTELLATIONS[editorSelectedConstIdx];
            if (!c || !c.stars[editorDraggingStarKey]) return;

            const rect = constEditorCanvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            editorDragMoved = true;

            const { cx, cy, scale, centerRa, centerDec, cosDec } = editorProjCache;
            const lx = (px - cx) / scale;
            const ly = (cy - py) / scale;

            const newDec = Math.max(-89.9, Math.min(89.9, centerDec + ly));
            const dRa = -lx / cosDec;
            const newRa = (((centerRa + dRa) % 360) + 360) % 360;

            c.stars[editorDraggingStarKey] = [Number(newRa.toFixed(3)), Number(newDec.toFixed(3))];
            updateSelectedStarInfo();
            saveConstellationsData();

            // ドラッグ中は現在の投影スケールを維持したまま再描画して暴れを防止
            editorProjCache.starPts[editorDraggingStarKey] = { x: px, y: py };
            editorProjCache.segments.forEach(seg => {
                if (seg.k1 === editorDraggingStarKey) { seg.x1 = px; seg.y1 = py; }
                if (seg.k2 === editorDraggingStarKey) { seg.x2 = px; seg.y2 = py; }
            });
            drawEditorScene(c, editorProjCache);

            if (isSkyMode) renderTokyoSky(simDate);
        });

        constEditorCanvas.addEventListener('pointerup', (e) => {
            if (editorIsPanning) {
                editorIsPanning = false;
                constEditorCanvas.style.cursor = 'crosshair';
                if (constEditorCanvas.hasPointerCapture && constEditorCanvas.hasPointerCapture(e.pointerId)) {
                    constEditorCanvas.releasePointerCapture(e.pointerId);
                }
                if (editorDragMoved) {
                    editorDragMoved = false;
                    return;
                }
            }

            if (editorDraggingStarKey) {
                editorDraggingStarKey = null;
                if (constEditorCanvas.hasPointerCapture && constEditorCanvas.hasPointerCapture(e.pointerId)) {
                    constEditorCanvas.releasePointerCapture(e.pointerId);
                }
                if (editorDragMoved) {
                    renderConstEditorCanvas();
                }
                return;
            }

            if (!editorProjCache) return;
            const rect = constEditorCanvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            // 星の上ならライン切り替えしない
            for (const key in editorProjCache.starPts) {
                const pt = editorProjCache.starPts[key];
                if (Math.hypot(px - pt.x, py - pt.y) < 14) return;
            }

            // ライン（破線・実線）のクリック判定
            let hitSeg = null;
            let bestSegDist = 11;
            editorProjCache.segments.forEach(seg => {
                const d = distToSegment(px, py, seg.x1, seg.y1, seg.x2, seg.y2);
                if (d < bestSegDist) {
                    bestSegDist = d;
                    hitSeg = seg;
                }
            });

            if (hitSeg) {
                const c = CONSTELLATIONS[editorSelectedConstIdx];
                if (hitSeg.active) {
                    // 実線 → 削除（破線に戻る）
                    c.lines = c.lines.filter(([a, b]) => !((a === hitSeg.k1 && b === hitSeg.k2) || (a === hitSeg.k2 && b === hitSeg.k1)));
                } else {
                    // 破線 → 実線として追加
                    c.lines.push([hitSeg.k1, hitSeg.k2]);
                }
                applyConstellationEditAndRefresh();
            }
        });

        // 選択中の星を微調整する関数
        function nudgeSelectedStar(dRaStep, dDecStep) {
            const c = CONSTELLATIONS[editorSelectedConstIdx];
            if (!c || !editorSelectedStarKey || !c.stars[editorSelectedStarKey]) return;
            const [ra, dec] = c.stars[editorSelectedStarKey];
            const nextRa = (((ra + dRaStep) % 360) + 360) % 360;
            const nextDec = Math.max(-89.9, Math.min(89.9, dec + dDecStep));
            c.stars[editorSelectedStarKey] = [Number(nextRa.toFixed(3)), Number(nextDec.toFixed(3))];
            updateSelectedStarInfo();
            applyConstellationEditAndRefresh();
        }

        selectedStarSize.addEventListener('input', () => {
            selectedStarSizeValue.textContent = Number(selectedStarSize.value).toFixed(1);
            updateSelectedStarStyle({ size: Number(selectedStarSize.value) });
        });
        selectedStarColor.addEventListener('input', () => {
            updateSelectedStarStyle({ color: selectedStarColor.value });
        });

        document.getElementById('btnStarLeft').addEventListener('click', () => nudgeSelectedStar(+0.4, 0));
        document.getElementById('btnStarRight').addEventListener('click', () => nudgeSelectedStar(-0.4, 0));
        document.getElementById('btnStarUp').addEventListener('click', () => nudgeSelectedStar(0, +0.4));
        document.getElementById('btnStarDown').addEventListener('click', () => nudgeSelectedStar(0, -0.4));

        document.addEventListener('keydown', (e) => {
            if (constEditorModal.hidden || !editorSelectedStarKey) return;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                e.preventDefault();
                if (e.key === 'ArrowLeft') nudgeSelectedStar(+0.3, 0);
                if (e.key === 'ArrowRight') nudgeSelectedStar(-0.3, 0);
                if (e.key === 'ArrowUp') nudgeSelectedStar(0, +0.3);
                if (e.key === 'ArrowDown') nudgeSelectedStar(0, -0.3);
            }
        });

        document.getElementById('btnAddConstStar').addEventListener('click', () => {
                const c = CONSTELLATIONS[editorSelectedConstIdx];
                if (!c) return;
                const defaultName = 'star' + (Object.keys(c.stars).length + 1);
                const key = prompt(tr('promptStarName'), defaultName);
                if (!key) return;
                const ra = Number(prompt(tr('promptStarRa'), String(c.ra || 0)));
                const dec = Number(prompt(tr('promptStarDec'), String(c.dec || 0)));
                if (!Number.isFinite(ra) || !Number.isFinite(dec) || ra < 0 || ra > 360 || dec < -90 || dec > 90) {
                    alert(tr('promptStarError'));
                    return;
                }
                c.stars[key] = [ra, dec];
                editorSelectedStarKey = key;
                updateSelectedStarInfo();
                applyConstellationEditAndRefresh();
            });

        // ==========================================
        // 6. 空画面描画メイン
        // ==========================================
        function renderTokyoSky(date) {
            if (!isSkyMode) return;

            const w = skyCanvas.width;
            const h = skyCanvas.height;
            const panel = document.querySelector('.control-panel');
            const panelBottom = panel ? panel.getBoundingClientRect().height : 0;
            const horizonY = h * 0.835;
            const zenithY = Math.max(h * 0.07, panelBottom + 24);
            const skyHeight = Math.max(100, horizonY - zenithY);
            const weatherOpacity = getWeatherOpacity(date);
            const centerX = w / 2;
            const halfWidth = Math.max(1, w / 2 - 12);

            const azimuthMap = { north: 0, east: 90, south: 180, west: 270 };
            const centerAz = Object.prototype.hasOwnProperty.call(azimuthMap, viewMode) ? azimuthMap[viewMode] : 180;
            const rad = Math.PI / 180;

            const azimuthHalfRange = 135;
            const zenithConvergence = 0.04;
            const edgeLift = 0.90;

            function azAltToXY(az, alt, edgeSide = 0) {
                let relAz = ((az - centerAz + 540) % 360) - 180;
                if (edgeSide > 0 && Math.abs(relAz + 180) < 1e-7) relAz = 180;
                const visible = Math.abs(relAz) <= azimuthHalfRange + 1e-7;
                const u = Math.max(-1, Math.min(1, relAz / azimuthHalfRange));
                const safeAlt = Math.max(-5, Math.min(90, alt));
                const a = Math.max(0, safeAlt) / 90;

                const convergence = zenithConvergence + (1 - zenithConvergence) * (1 - Math.pow(a, 1.30));
                const x = centerX + u * halfWidth * convergence;
                const vertical = a + edgeLift * u * u * a * (1 - a);
                const y = horizonY - skyHeight * (safeAlt < 0 ? safeAlt / 90 : vertical);
                return { x, y, visible, relAz };
            }

            const timeMs = date.getTime();
            const jd = (timeMs / 86400000.0) + 2440587.5;
            const dDays = jd - 2451545.0;
            const T = dDays / 36525.0;

            const ePos = getPlanetHelioPosition(orbitalElements.earth, T).trueEcl;
            const sunGeo = { x: -ePos.x, y: -ePos.y, z: -ePos.z };
            const sunHoriz = toHorizontal(sunGeo.x, sunGeo.y, sunGeo.z, dDays);
            const moonLonDeg = getMoonGeocentricEclipticLon(dDays, T);
            const moonRad = moonLonDeg * rad;
            const moonHoriz = toHorizontal(Math.cos(moonRad), Math.sin(moonRad), 0, dDays);

            ensureActualTideData(date);
            ensureWeatherData();

            const actualTideM = getActualTideAt(date);
            const actualAnnualRange = getActualAnnualTideRange(date);
            const currentTideM = actualTideM !== null ? actualTideM : tideHeightFromAltitudes(sunHoriz.alt, moonHoriz.alt, dDays, T, ePos.r);
            const annualTideRange = actualAnnualRange || { min: -0.52, max: 0.52 };
            const tideIsActual = actualTideM !== null && actualAnnualRange !== null;
            const annualTideSpan = Math.max(0.001, annualTideRange.max - annualTideRange.min);
            const tideRatio = Math.max(0, Math.min(1, (currentTideM - annualTideRange.min) / annualTideSpan));

            // 1. 空のベース背景
            const skyGrad = skyCtx.createLinearGradient(0, zenithY, 0, h);
            if (sunHoriz.alt > 0) {
                skyGrad.addColorStop(0, '#1052a0');
                skyGrad.addColorStop(0.7, '#4a9fe8');
                skyGrad.addColorStop(1, '#a1d4f7');
            } else if (sunHoriz.alt > -6) {
                skyGrad.addColorStop(0, '#0c1a30');
                skyGrad.addColorStop(0.6, '#432344');
                skyGrad.addColorStop(1, '#c85a32');
            } else {
                skyGrad.addColorStop(0, '#020208');
                skyGrad.addColorStop(1, '#081024');
            }
            skyCtx.fillStyle = skyGrad;
            skyCtx.fillRect(0, 0, w, h);

            if (viewMode !== 'zenith') {
                drawBackgroundClouds(skyCtx, w, horizonY, zenithY, sunHoriz.alt, weatherOpacity);
            }

            // 海面と潮位メーター
            if (viewMode !== 'zenith') {
                const seaPanelTop = horizonY;
                const seaPanelBottom = h;
                const seaPanelHeight = Math.max(1, seaPanelBottom - seaPanelTop);
                const groundGrad = skyCtx.createLinearGradient(0, seaPanelTop, 0, seaPanelBottom);
                groundGrad.addColorStop(0, sunHoriz.alt > 0 ? '#102b35' : '#071522');
                groundGrad.addColorStop(1, '#020913');
                skyCtx.fillStyle = groundGrad;
                skyCtx.fillRect(0, seaPanelTop, w, seaPanelHeight);

                const waterY = seaPanelBottom - tideRatio * seaPanelHeight;
                if (waterY < seaPanelBottom) {
                    const waterGrad = skyCtx.createLinearGradient(0, waterY, 0, seaPanelBottom);
                    waterGrad.addColorStop(0, '#168fc3');
                    waterGrad.addColorStop(0.35, '#08649c');
                    waterGrad.addColorStop(1, '#03264f');
                    skyCtx.fillStyle = waterGrad;
                    skyCtx.fillRect(0, waterY, w, seaPanelBottom - waterY);

                    skyCtx.beginPath();
                    skyCtx.moveTo(0, waterY);
                    skyCtx.lineTo(w, waterY);
                    skyCtx.strokeStyle = 'rgba(104, 220, 255, 0.95)';
                    skyCtx.lineWidth = 1.6;
                    skyCtx.shadowColor = 'rgba(35, 170, 235, 0.65)';
                    skyCtx.shadowBlur = 7;
                    skyCtx.stroke();
                    skyCtx.shadowBlur = 0;
                }

                const infoX = 16;
                const infoY = Math.min(h - 54, horizonY + 40);
                const infoW = Math.max(190, Math.min(480, w - 78));
                skyCtx.fillStyle = 'rgba(1, 8, 20, 0.76)';
                skyCtx.fillRect(infoX, infoY, infoW, 43);
                skyCtx.fillStyle = 'rgba(235, 247, 255, 0.95)';
                skyCtx.font = 'bold 12px sans-serif';
                skyCtx.textAlign = 'left';

                const locationLine = `${tr('observed')}: ${getCurrentCityDisplayName()}`;
                skyCtx.fillText(locationLine, infoX + 8, infoY + 15, infoW - 16);

                const signedTide = `${currentTideM >= 0 ? '+' : ''}${currentTideM.toFixed(2)} m`;
                const tideSource = tideIsActual ? tr('tideStation') : tr('tideEstimate');
                const annualText = `${tideSource} ${tr('current')} ${signedTide}   ${tr('annualMax')} ${annualTideRange.max >= 0 ? '+' : ''}${annualTideRange.max.toFixed(2)} / ${tr('annualMin')} ${annualTideRange.min >= 0 ? '+' : ''}${annualTideRange.min.toFixed(2)} m`;
                skyCtx.font = '11px sans-serif';
                skyCtx.fillStyle = '#b9e9ff';
                skyCtx.fillText(annualText, infoX + 8, infoY + 33, infoW - 16);

                const gaugeW = 13;
                const gaugeX = w - 27;
                const gaugeY = seaPanelTop + 9;
                const gaugeBottom = seaPanelBottom - 9;
                const gaugeH = Math.max(12, gaugeBottom - gaugeY);
                skyCtx.fillStyle = '#03143b';
                skyCtx.fillRect(gaugeX, gaugeY, gaugeW, gaugeH);
                skyCtx.fillStyle = '#087db7';
                skyCtx.fillRect(gaugeX + 2, gaugeY + gaugeH * (1 - tideRatio), gaugeW - 4, gaugeH * tideRatio);
                skyCtx.strokeStyle = 'rgba(91, 167, 216, 0.95)';
                skyCtx.lineWidth = 1;
                skyCtx.strokeRect(gaugeX, gaugeY, gaugeW, gaugeH);
                skyCtx.beginPath();
                skyCtx.moveTo(gaugeX - 4, gaugeY);
                skyCtx.lineTo(gaugeX + gaugeW + 3, gaugeY);
                skyCtx.moveTo(gaugeX - 4, gaugeBottom);
                skyCtx.lineTo(gaugeX + gaugeW + 3, gaugeBottom);
                skyCtx.moveTo(gaugeX - 5, gaugeY + gaugeH * (1 - tideRatio));
                skyCtx.lineTo(gaugeX + gaugeW + 4, gaugeY + gaugeH * (1 - tideRatio));
                skyCtx.strokeStyle = '#a6eaff';
                skyCtx.stroke();
                skyCtx.fillStyle = '#a9d8f5';
                skyCtx.font = '10px sans-serif';
                skyCtx.textAlign = 'right';
                skyCtx.fillText(`${currentLang === 'ja' ? '最大' : 'MAX'} ${annualTideRange.max >= 0 ? '+' : ''}${annualTideRange.max.toFixed(2)}m`, gaugeX - 7, gaugeY + 10, Math.max(70, w * 0.35));
                skyCtx.fillText(`${currentLang === 'ja' ? '最小' : 'MIN'} ${annualTideRange.min >= 0 ? '+' : ''}${annualTideRange.min.toFixed(2)}m`, gaugeX - 7, gaugeBottom - 2, Math.max(70, w * 0.35));
            }

            // 天頂／方向切替ボタン
            let zenithBtnRect = null;
            {
                const isZenithActive = (viewMode === 'zenith');
                const returnDirKey = ADJACENT_SKY[skyReturnDirection] ? skyReturnDirection : 'south';
                const returnDirText = tr('backFromZenith').replace('{dir}', tr(returnDirKey));
                const zenithBtnText = isZenithActive ? `↩ ${returnDirText}` : `⬆ ${tr('zenith')}`;
                const baseFontPx = parseFloat(getComputedStyle(document.body).fontSize) || 16;
                const labelFontPx = Math.round(baseFontPx * 0.95 * 10) / 10;
                const labelY = Math.max(18, zenithY - 4);
                skyCtx.save();
                skyCtx.font = `bold ${labelFontPx}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
                const textWidth = skyCtx.measureText(zenithBtnText).width;
                const padX = 16;
                const boxW = textWidth + padX * 2;
                const boxH = Math.round(labelFontPx * 2.0);
                const boxX = centerX - boxW / 2;
                const boxY = labelY - boxH / 2;
                zenithBtnRect = { x: boxX, y: boxY, w: boxW, h: boxH };

                skyCtx.fillStyle = isZenithActive ? 'rgba(30, 88, 155, 0.96)' : 'rgba(14, 24, 48, 0.92)';
                skyCtx.strokeStyle = isZenithActive ? '#00e5ff' : 'rgba(72, 116, 184, 0.95)';
                skyCtx.lineWidth = isZenithActive ? 1.6 : 1.2;
                skyCtx.beginPath();
                skyCtx.roundRect ? skyCtx.roundRect(boxX, boxY, boxW, boxH, 8) : skyCtx.rect(boxX, boxY, boxW, boxH);
                skyCtx.fill();
                skyCtx.stroke();

                skyCtx.fillStyle = isZenithActive ? '#ffffff' : '#e6f4ff';
                skyCtx.textAlign = 'center';
                skyCtx.textBaseline = 'middle';
                skyCtx.fillText(zenithBtnText, centerX, labelY + 0.5);
                skyCtx.restore();
            }
            skyCanvas._zenithBtnRect = zenithBtnRect;

            // 天気・気温表示（真上ボタンの右側）
            if (showWeather) {
                const weatherKnown = weatherAvailable && weatherOpacity > 0 && weatherFetchedAt > 0;
                const weatherLabel = weatherKnown
                    ? `${currentWeather.icon} ${currentLang === 'en' ? currentWeather.textEn : currentWeather.textJa}`
                    : '☁️ --';
                const tempLabel = weatherKnown && currentWeather.temperature !== null
                    ? ` ${currentWeather.temperature.toFixed(1)}°C`
                    : '';
                let windLabel = '';
                if (weatherKnown && currentWeather.windSpeed !== null) {
                    const mps = (currentWeather.windSpeed * 0.27778).toFixed(1);
                    const compass = degToCompass(currentWeather.windDir);

                    // 風が「吹いてくる方向（風向）」を、風が「進む方向（矢印の向き）」に補正 (+180度)
                    // ※ Open-Meteoの風向は「北から吹いてくる(0°=北風)」ため、矢印を下(南)に向かわせるために+180します
                    const deg = currentWeather.windDir !== null ? (currentWeather.windDir + 180) % 360 : 0;

                    // キャンバス（2D context）で描画しているため、テキストの中に記号「⬆」と角度を入れる
                    // ※もしHTML要素として表示する場合はCSSクラスが使えますが、キャンバス描画なので文字としてスッキリ見せます
                    const windTextEn = `Wind: ${mps} m/s ${compass} (${currentWeather.windDir ?? 0}°)`;
                    const windTextJa = `風速: ${mps}m/s ${compass} (${currentWeather.windDir ?? 0}°)`;

                    // 方角に合わせた矢印アイコン (N=北から吹く場合、矢印は南へ向かうため ↓ 系になります)
                    const arrowIcons = ['⬇', '↙', '⬅', '↖', '⬆', '↗', '➡', '↘'];
                    const arrowIdx = currentWeather.windDir !== null ? Math.round(((currentWeather.windDir % 360) / 45)) % 8 : 0;
                    const arrow = arrowIcons[arrowIdx];

                    windLabel = ` 💨 ${arrow} ${currentLang === 'en' ? windTextEn : windTextJa}`;
                }
                const weatherText =  `${weatherLabel}${tempLabel}${windLabel}`;
                const weatherBaseFont = parseFloat(getComputedStyle(document.body).fontSize) || 16;
                const weatherFont = Math.max(15, Math.min(19, weatherBaseFont * 1.12));
                const weatherX = zenithBtnRect ? zenithBtnRect.x + zenithBtnRect.w + 400 : centerX + 90;
                const weatherY = Math.max(18, zenithY - 4);
                const availableW = Math.max(0, w - weatherX - 10);

                if (availableW > 45) {
                    skyCtx.save();
                    skyCtx.globalAlpha = weatherKnown ? Math.max(0.45, weatherOpacity) : 0.9;
                    skyCtx.font = `bold ${weatherFont}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
                    skyCtx.textAlign = 'left';
                    skyCtx.textBaseline = 'middle';
                    const textW = Math.min(availableW, skyCtx.measureText(weatherText).width + 20);
                    const boxH = Math.round(weatherFont * 1.85);
                    const boxY = weatherY - boxH / 2;
                    skyCtx.fillStyle = 'rgba(8, 18, 38, 0.88)';
                    skyCtx.strokeStyle = 'rgba(105, 165, 225, 0.82)';
                    skyCtx.lineWidth = 1.2;
                    skyCtx.beginPath();
                    skyCtx.roundRect
                        ? skyCtx.roundRect(weatherX - 8, boxY, textW, boxH, 8)
                        : skyCtx.rect(weatherX - 8, boxY, textW, boxH);
                    skyCtx.fill();
                    skyCtx.stroke();
                    skyCtx.fillStyle = '#f0f7ff';
                    skyCtx.fillText(weatherText, weatherX + 2, weatherY + 0.5, availableW - 14);
                    skyCtx.restore();
                }
            }

            // 方角ラベル
            {
                const dirText = tr(viewMode);
                const baseFontPx = parseFloat(getComputedStyle(document.body).fontSize) || 16;
                const labelFontPx = Math.round(baseFontPx * 0.95 * 10) / 10;
                const labelY = Math.min(h - 22, horizonY - 20);
                skyCtx.save();
                skyCtx.font = `bold ${labelFontPx}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
                const textWidth = skyCtx.measureText(dirText).width;
                const padX = 14;
                const boxW = textWidth + padX * 2;
                const boxH = Math.round(labelFontPx * 1.85);
                const boxX = centerX - boxW / 2;
                const boxY = labelY - boxH / 2;

                skyCtx.fillStyle = 'rgba(10, 20, 42, 0.88)';
                skyCtx.strokeStyle = 'rgba(110, 175, 255, 0.85)';
                skyCtx.lineWidth = 1.2;
                skyCtx.beginPath();
                skyCtx.roundRect ? skyCtx.roundRect(boxX, boxY, boxW, boxH, 8) : skyCtx.rect(boxX, boxY, boxW, boxH);
                skyCtx.fill();
                skyCtx.stroke();

                skyCtx.fillStyle = '#d8f1ff';
                skyCtx.textAlign = 'center';
                skyCtx.textBaseline = 'middle';
                skyCtx.fillText(dirText, centerX, labelY + 0.5);
                skyCtx.restore();
            }

            // 真上ドームモード
            if (viewMode === 'zenith') {
                const availTop = zenithY + 18;
                const availBottom = h - 22;
                const availH = Math.max(120, availBottom - availTop);
                const availW = Math.max(120, w - 100);
                const baseCircleR = Math.max(70, Math.min(availH, availW) * 0.49);
                const circleR = baseCircleR * zenithZoom;
                const baseCircleY = availTop + availH * 0.5;
                const circleX = centerX + zenithPanX;
                const circleY = baseCircleY + zenithPanY;

                skyCtx.save();
                skyCtx.beginPath();
                skyCtx.rect(0, availTop, w, Math.max(40, availBottom - availTop));
                skyCtx.clip();

                skyCtx.beginPath();
                skyCtx.arc(circleX, circleY, circleR + 18 * zenithZoom, 0, Math.PI * 2);
                skyCtx.fillStyle = sunHoriz.alt > 0 ? 'rgba(16, 43, 53, 0.45)' : 'rgba(6, 16, 30, 0.65)';
                skyCtx.fill();

                const domeGrad = skyCtx.createRadialGradient(circleX, circleY, 4 * zenithZoom, circleX, circleY, circleR);
                if (sunHoriz.alt > 0) {
                    domeGrad.addColorStop(0, '#1864ba');
                    domeGrad.addColorStop(0.75, '#479ce4');
                    domeGrad.addColorStop(1, '#9ad0f5');
                } else if (sunHoriz.alt > -6) {
                    domeGrad.addColorStop(0, '#122646');
                    domeGrad.addColorStop(0.7, '#3f2446');
                    domeGrad.addColorStop(1, '#b95835');
                } else {
                    domeGrad.addColorStop(0, '#050816');
                    domeGrad.addColorStop(0.75, '#09142c');
                    domeGrad.addColorStop(1, '#102242');
                }
                skyCtx.beginPath();
                skyCtx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
                skyCtx.fillStyle = domeGrad;
                skyCtx.fill();
                skyCtx.lineWidth = 2.2;
                skyCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                skyCtx.stroke();

                [75, 60, 45, 30, 15].forEach(altVal => {
                    const rAlt = circleR * ((90 - altVal) / 90);
                    skyCtx.beginPath();
                    skyCtx.arc(circleX, circleY, rAlt, 0, Math.PI * 2);
                    skyCtx.strokeStyle = 'rgba(230, 240, 255, 0.24)';
                    skyCtx.lineWidth = 0.9;
                    skyCtx.stroke();

                    skyCtx.fillStyle = 'rgba(255, 255, 255, 0.72)';
                    skyCtx.font = '11px sans-serif';
                    skyCtx.textAlign = 'left';
                    skyCtx.fillText(`${altVal}°`, circleX + 4, circleY - rAlt + 11);
                });

                const azToZenithXY = (az, alt) => {
                    const clampedAlt = Math.max(0, Math.min(90, alt));
                    const distR = circleR * ((90 - clampedAlt) / 90);
                    const theta = -Math.PI / 2 + (az - zenithTopAz) * rad;
                    return { x: circleX + distR * Math.cos(theta), y: circleY + distR * Math.sin(theta), visible: alt >= -2 };
                };

                for (let az = 0; az < 360; az += 30) {
                    const edgePt = azToZenithXY(az, 0);
                    skyCtx.beginPath();
                    skyCtx.moveTo(circleX, circleY);
                    skyCtx.lineTo(edgePt.x, edgePt.y);
                    skyCtx.strokeStyle = (az % 90 === 0) ? 'rgba(235, 244, 255, 0.34)' : 'rgba(220, 234, 255, 0.16)';
                    skyCtx.lineWidth = (az % 90 === 0) ? 1.1 : 0.75;
                    skyCtx.stroke();
                }

                const zCompass = currentLang === 'ja' ? {
                    0: '北', 45: '北東', 90: '東', 135: '南東', 180: '南', 225: '南西', 270: '西', 315: '北西'
                } : {
                    0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW'
                };
                Object.entries(zCompass).forEach(([azStr, label]) => {
                    const azVal = Number(azStr);
                    const theta = -Math.PI / 2 + (azVal - zenithTopAz) * rad;
                    const labelR = circleR + 14 * zenithZoom;
                    const lx = circleX + labelR * Math.cos(theta);
                    const ly = circleY + labelR * Math.sin(theta);
                    skyCtx.fillStyle = (azVal % 90 === 0) ? '#ffe680' : 'rgba(235, 245, 255, 0.85)';
                    skyCtx.font = (azVal % 90 === 0) ? 'bold 13px sans-serif' : '11px sans-serif';
                    skyCtx.textAlign = 'center';
                    skyCtx.textBaseline = 'middle';
                    skyCtx.fillText(label, lx, ly);
                });

                if (showConstellations && (astroVisibility.constellationLines || astroVisibility.constellationNames)) {
                    CONSTELLATIONS.forEach(c => {
                        if (c.visible === false) return;
                        const starCoords = {};
                        let labelPoint = null;
                        for (const key in c.stars) {
                            const s = c.stars[key];
                            const horiz = raDecToHorizontal(s[0], s[1], dDays);
                            if (horiz.alt >= 0) {
                                const pt = azToZenithXY(horiz.az, horiz.alt);
                                starCoords[key] = pt;
                                if (!labelPoint) labelPoint = pt;
                            }
                        }
                        skyCtx.strokeStyle = 'rgba(160, 200, 255, 0.56)';
                        skyCtx.lineWidth = 1.25;
                        if (astroVisibility.constellationLines) c.lines.forEach(([k1, k2]) => {
                            if (starCoords[k1] && starCoords[k2]) {
                                skyCtx.beginPath();
                                skyCtx.moveTo(starCoords[k1].x, starCoords[k1].y);
                                skyCtx.lineTo(starCoords[k2].x, starCoords[k2].y);
                                skyCtx.stroke();
                            }
                        });
                        for (const key in starCoords) {
                            const pt = starCoords[key];
                            skyCtx.beginPath();
                            const starStyle = getConstellationStarStyle(c, key);
                            const defaultColor = key === 'polaris' ? '#ffee88' : '#ffffff';
                            skyCtx.arc(pt.x, pt.y, (key === 'polaris' ? 3.5 : 2.4) * starStyle.size, 0, Math.PI * 2);
                            skyCtx.fillStyle = starStyle.color || defaultColor;
                            skyCtx.fill();
                        }
                        if (showLabels && astroVisibility.constellationNames && labelPoint) {
                            skyCtx.fillStyle = 'rgba(210, 232, 255, 0.92)';
                            skyCtx.font = 'bold 11px sans-serif';
                            skyCtx.textAlign = 'center';
                            skyCtx.textBaseline = 'alphabetic';
                            skyCtx.fillText(getConstDisplayName(c), labelPoint.x, labelPoint.y - 7);
                        }
                    });
                }

                const zBodies = [{ name: '太陽', alt: sunHoriz.alt, az: sunHoriz.az, isSun: true, size: 13 }];
                for (const id in orbitalElements) {
                    if (id === 'earth') continue;
                    const pPos = getPlanetHelioPosition(orbitalElements[id], T).trueEcl;
                    const horiz = toHorizontal(pPos.x - ePos.x, pPos.y - ePos.y, pPos.z - ePos.z, dDays);
                    const pConf = planetsConfig.find(p => p.id === id);
                    zBodies.push({ name: pConf.name, alt: horiz.alt, az: horiz.az, color: '#' + pConf.color.toString(16).padStart(6, '0'), size: id === 'jupiter' || id === 'venus' ? 6.5 : 4.8 });
                }
                zBodies.push({ name: '月', alt: moonHoriz.alt, az: moonHoriz.az, isMoon: true, size: 12 });

                zBodies.forEach(b => {
                    if (b.alt >= -2) {
                        const pt = azToZenithXY(b.az, Math.max(0, b.alt));
                        if (b.isSun) {
                            const g = skyCtx.createRadialGradient(pt.x, pt.y, 3, pt.x, pt.y, 28);
                            g.addColorStop(0, '#ffffff');
                            g.addColorStop(0.25, '#ffee55');
                            g.addColorStop(1, 'rgba(255,200,0,0)');
                            skyCtx.fillStyle = g;
                            skyCtx.beginPath();
                            skyCtx.arc(pt.x, pt.y, 28, 0, Math.PI * 2);
                            skyCtx.fill();
                        } else if (b.isMoon) {
                            const moonSkyBg = sunHoriz.alt > 0 ? '#2b7cc4' : (sunHoriz.alt > -6 ? '#2a1d39' : '#050914');
                            drawMoonPhase3D(skyCtx, pt.x, pt.y, b.size, dDays, T, ePos, moonSkyBg);
                        } else {
                            skyCtx.beginPath();
                            skyCtx.arc(pt.x, pt.y, b.size, 0, Math.PI * 2);
                            skyCtx.fillStyle = b.color;
                            skyCtx.fill();
                        }
                        if (showLabels) {
                            skyCtx.fillStyle = '#ffffff';
                            skyCtx.font = '11px sans-serif';
                            skyCtx.textAlign = 'center';
                            skyCtx.textBaseline = 'alphabetic';
                            skyCtx.fillText(`${currentLang === 'en' ? (CELESTIAL_NAMES_EN[b.name] || b.name) : b.name} (${b.alt.toFixed(0)}°)`, pt.x, pt.y - b.size - 5);
                        }
                    }
                });

                skyCtx.restore();
                return;
            }

            // 2. 方位線
            for (let rel = -azimuthHalfRange; rel <= azimuthHalfRange; rel += 15) {
                const major = (rel % 30 === 0);
                skyCtx.beginPath();
                for (let alt = 0; alt <= 90; alt += 2) {
                    const pt = azAltToXY(centerAz + rel, alt, rel === azimuthHalfRange ? 1 : 0);
                    if (alt === 0) skyCtx.moveTo(pt.x, pt.y);
                    else skyCtx.lineTo(pt.x, pt.y);
                }
                skyCtx.strokeStyle = major ? 'rgba(230, 238, 255, 0.31)' : 'rgba(220, 232, 255, 0.16)';
                skyCtx.lineWidth = major ? 1.05 : 0.75;
                skyCtx.stroke();
            }

            // 3. 高度線
            [15, 30, 45, 60, 75].forEach(altVal => {
                skyCtx.beginPath();
                for (let rel = -azimuthHalfRange; rel <= azimuthHalfRange; rel += 2) {
                    const pt = azAltToXY(centerAz + rel, altVal, rel === azimuthHalfRange ? 1 : 0);
                    if (rel === -azimuthHalfRange) skyCtx.moveTo(pt.x, pt.y);
                    else skyCtx.lineTo(pt.x, pt.y);
                }
                skyCtx.strokeStyle = 'rgba(235, 242, 255, 0.24)';
                skyCtx.lineWidth = 0.9;
                skyCtx.stroke();

                const labelPt = azAltToXY(centerAz, altVal);
                skyCtx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                skyCtx.font = '12px sans-serif';
                skyCtx.textAlign = 'right';
                skyCtx.fillText(`${altVal}°`, centerX - 9, labelPt.y - 3);
            });

            // 地平線
            skyCtx.beginPath();
            skyCtx.moveTo(0, horizonY);
            skyCtx.lineTo(w, horizonY);
            skyCtx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
            skyCtx.lineWidth = 1.25;
            skyCtx.stroke();

            // 方位目盛り
            for (let rel = -120; rel <= 120; rel += 30) {
                const az = (centerAz + rel + 360) % 360;
                const pt = azAltToXY(az, 0);
                skyCtx.beginPath();
                skyCtx.moveTo(pt.x, horizonY - 5);
                skyCtx.lineTo(pt.x, horizonY + 5);
                skyCtx.strokeStyle = 'rgba(255,255,255,0.58)';
                skyCtx.lineWidth = 1;
                skyCtx.stroke();
                skyCtx.fillStyle = 'rgba(255,255,255,0.72)';
                skyCtx.font = '11px sans-serif';
                skyCtx.textAlign = 'center';
                skyCtx.fillText(String(az), pt.x, horizonY - 8);
            }

            const compassNames = currentLang === 'ja' ? {
                0: '北', 45: '北東', 90: '東', 135: '南東', 180: '南', 225: '南西', 270: '西', 315: '北西'
            } : {
                0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW'
            };
            Object.entries(compassNames).forEach(([azText, name]) => {
                const pt = azAltToXY(Number(azText), 0);
                if (!pt.visible) return;
                skyCtx.fillStyle = 'rgba(255,255,255,0.88)';
                skyCtx.font = 'bold 13px sans-serif';
                skyCtx.textAlign = 'center';
                skyCtx.fillText(name, pt.x, Math.min(h - 4, horizonY + 20));
            });

            // 4. 星座
            if (showConstellations && (astroVisibility.constellationLines || astroVisibility.constellationNames)) {
                CONSTELLATIONS.forEach(c => {
                    if (c.visible === false) return;
                    const starCoords = {};
                    let labelPoint = null;
                    for (const key in c.stars) {
                        const s = c.stars[key];
                        const horiz = raDecToHorizontal(s[0], s[1], dDays);
                        const pt = azAltToXY(horiz.az, horiz.alt);
                        if (pt.visible && horiz.alt >= 0) {
                            starCoords[key] = pt;
                            if (!labelPoint) labelPoint = pt;
                        }
                    }

                    skyCtx.strokeStyle = 'rgba(160, 200, 255, 0.53)';
                    skyCtx.lineWidth = 1.25;
                    if (astroVisibility.constellationLines) c.lines.forEach(([k1, k2]) => {
                        if (starCoords[k1] && starCoords[k2]) {
                            skyCtx.beginPath();
                            skyCtx.moveTo(starCoords[k1].x, starCoords[k1].y);
                            skyCtx.lineTo(starCoords[k2].x, starCoords[k2].y);
                            skyCtx.stroke();
                        }
                    });

                    if (c.isDeepSkyObject && c.dsType === 'pleiades' && starCoords.m45_center) {
                        const cpt = starCoords.m45_center;
                        const glow = skyCtx.createRadialGradient(cpt.x, cpt.y, 2, cpt.x, cpt.y, 22);
                        glow.addColorStop(0, 'rgba(155, 210, 255, 0.42)');
                        glow.addColorStop(0.55, 'rgba(110, 175, 255, 0.16)');
                        glow.addColorStop(1, 'rgba(110, 175, 255, 0)');
                        skyCtx.fillStyle = glow;
                        skyCtx.beginPath();
                        skyCtx.arc(cpt.x, cpt.y, 22, 0, Math.PI * 2);
                        skyCtx.fill();

                        for (const key in starCoords) {
                            if (key === 'm45_center') continue;
                            const pt = starCoords[key];
                            const rStar = (key === 'alcyone' || key === 'atlas' || key === 'electra') ? 2.6 : 2.0;
                            const starStyle = getConstellationStarStyle(c, key);
                            skyCtx.beginPath();
                            skyCtx.arc(pt.x, pt.y, rStar * starStyle.size, 0, Math.PI * 2);
                            skyCtx.fillStyle = starStyle.color || '#d8ecff';
                            skyCtx.shadowColor = '#88c4ff';
                            skyCtx.shadowBlur = 6;
                            skyCtx.fill();
                            skyCtx.shadowBlur = 0;
                        }
                    } else if (c.isDeepSkyObject && c.dsType === 'andromeda' && starCoords.m31_center) {
                        const cpt = starCoords.m31_center;
                        const ptNe = starCoords.m31_ne;
                        const ptSw = starCoords.m31_sw;
                        let angle = -0.55;
                        let semiMajor = 24;
                        if (ptNe && ptSw) {
                            angle = Math.atan2(ptNe.y - ptSw.y, ptNe.x - ptSw.x);
                            semiMajor = Math.max(16, Math.min(34, Math.hypot(ptNe.x - ptSw.x, ptNe.y - ptSw.y) * 0.55));
                        }
                        const semiMinor = Math.max(5.5, semiMajor * 0.28);

                        skyCtx.save();
                        skyCtx.translate(cpt.x, cpt.y);
                        skyCtx.rotate(angle);

                        const halo = skyCtx.createRadialGradient(0, 0, 1, 0, 0, semiMajor);
                        halo.addColorStop(0, 'rgba(255, 248, 210, 0.72)');
                        halo.addColorStop(0.35, 'rgba(225, 215, 185, 0.34)');
                        halo.addColorStop(0.75, 'rgba(175, 190, 235, 0.12)');
                        halo.addColorStop(1, 'rgba(175, 190, 235, 0)');
                        skyCtx.fillStyle = halo;
                        skyCtx.beginPath();
                        skyCtx.ellipse(0, 0, semiMajor, semiMinor, 0, 0, Math.PI * 2);
                        skyCtx.fill();

                        skyCtx.beginPath();
                        skyCtx.ellipse(0, 0, semiMajor * 0.24, semiMinor * 0.35, 0, 0, Math.PI * 2);
                        skyCtx.fillStyle = 'rgba(255, 252, 232, 0.92)';
                        skyCtx.fill();

                        skyCtx.restore();
                    } else {
                        for (const key in starCoords) {
                            const pt = starCoords[key];
                            skyCtx.beginPath();
                            const starStyle = getConstellationStarStyle(c, key);
                            const defaultColor = key === 'polaris' ? '#ffee88' : '#ffffff';
                            skyCtx.arc(pt.x, pt.y, (key === 'polaris' ? 3.5 : 2.5) * starStyle.size, 0, Math.PI * 2);
                            skyCtx.fillStyle = starStyle.color || defaultColor;
                            skyCtx.shadowColor = starStyle.color || '#88bbff';
                            skyCtx.shadowBlur = 4;
                            skyCtx.fill();
                            skyCtx.shadowBlur = 0;
                        }
                    }

                    if (showLabels && astroVisibility.constellationNames && labelPoint) {
                        skyCtx.fillStyle = c.isDeepSkyObject ? 'rgba(220, 238, 255, 0.94)' : 'rgba(200, 225, 255, 0.9)';
                        skyCtx.font = 'bold 12px sans-serif';
                        skyCtx.textAlign = 'center';
                        skyCtx.shadowBlur = 0;
                        const labelYOffset = c.isDeepSkyObject ? -16 : -10;
                        skyCtx.fillText(getConstDisplayName(c), labelPoint.x, labelPoint.y + labelYOffset);
                    }
                });
            }

            // 5. 太陽・月・惑星
            const celestialBodies = [{ name: '太陽', alt: sunHoriz.alt, az: sunHoriz.az, isSun: true, size: 16 }];
            for (const id in orbitalElements) {
                if (id === 'earth') continue;
                const pPos = getPlanetHelioPosition(orbitalElements[id], T).trueEcl;
                const gX = pPos.x - ePos.x;
                const gY = pPos.y - ePos.y;
                const gZ = pPos.z - ePos.z;
                const horiz = toHorizontal(gX, gY, gZ, dDays);
                const pConf = planetsConfig.find(p => p.id === id);
                celestialBodies.push({
                    name: pConf.name, alt: horiz.alt, az: horiz.az,
                    color: '#' + pConf.color.toString(16).padStart(6, '0'),
                    size: id === 'jupiter' || id === 'venus' ? 7 : 5
                });
            }

            celestialBodies.push({
                name: '月', alt: moonHoriz.alt, az: moonHoriz.az, isMoon: true,
                moonLonDeg: moonLonDeg, size: 15
            });

            if (astroVisibility.solarSystem) celestialBodies.forEach(b => {
                const pt = azAltToXY(b.az, b.alt);
                if (pt.visible && b.alt >= -2) {
                    if (b.isSun) {
                        const g = skyCtx.createRadialGradient(pt.x, pt.y, 4, pt.x, pt.y, 40);
                        g.addColorStop(0, '#ffffff');
                        g.addColorStop(0.2, '#ffee55');
                        g.addColorStop(1, 'rgba(255,200,0,0)');
                        skyCtx.fillStyle = g;
                        skyCtx.beginPath();
                        skyCtx.arc(pt.x, pt.y, 40, 0, Math.PI * 2);
                        skyCtx.fill();
                    } else if (b.isMoon) {
                        const moonSkyBg = sunHoriz.alt > 0 ? '#2b7cc4' : (sunHoriz.alt > -6 ? '#2a1d39' : '#050914');
                        drawMoonPhase3D(skyCtx, pt.x, pt.y, b.size, dDays, T, ePos, moonSkyBg);
                    } else {
                        skyCtx.beginPath();
                        skyCtx.arc(pt.x, pt.y, b.size, 0, Math.PI * 2);
                        skyCtx.fillStyle = b.color;
                        skyCtx.shadowColor = b.color;
                        skyCtx.shadowBlur = 6;
                        skyCtx.fill();
                        skyCtx.shadowBlur = 0;
                    }

                    if (showLabels) {
                        skyCtx.fillStyle = '#ffffff';
                        skyCtx.font = '12px sans-serif';
                        skyCtx.textAlign = 'center';
                        skyCtx.fillText(`${currentLang === 'en' ? (CELESTIAL_NAMES_EN[b.name] || b.name) : b.name} (${b.alt.toFixed(0)}°)`, pt.x, pt.y - b.size - 6);
                    }
                }
            });

            if (viewMode !== 'zenith') {
                drawPrecipitation(skyCtx, w, horizonY, zenithY, weatherOpacity);
            }
        }

        // ==========================================
        // 7. 全体シミュレーション更新処理
        // ==========================================
        function updateSimulation(date) {
            const timeMs = date.getTime();
            const jd = (timeMs / 86400000.0) + 2440587.5;
            const dDays = jd - 2451545.0;
            const T = dDays / 36525.0;

            let earthHelio = null;

            const rad = Math.PI / 180;
            const totalHoursSinceJ2000 = dDays * 24;

            for (const id in planetMeshes) {
                const pObj = planetMeshes[id];
                const pos = getPlanetHelioPosition(pObj.elem, T);
                pObj.pivot.position.set(pos.x, pos.y, pos.z);

                if (pObj.orbitLine) {
                    const posAttr = pObj.orbitLine.geometry.getAttribute('position');
                    for (let i = 0; i < posAttr.count; i++) {
                        const nu = (i * (360 / (posAttr.count - 1))) * rad;
                        const pt = computeOrbitPointThreeJS(pObj.elem, nu, T);
                        posAttr.setXYZ(i, pt.x, pt.y, pt.z);
                    }
                    posAttr.needsUpdate = true;
                }

                if (!pObj.config.isEarth && pObj.mesh && pObj.config.rotPeriodHours) {
                    const spinAngle = (totalHoursSinceJ2000 / pObj.config.rotPeriodHours) * Math.PI * 2;
                    pObj.mesh.rotation.y = spinAngle;
                }

                if (pObj.config.isEarth) earthHelio = pos;

                if (pObj.moons) {
                    pObj.moons.forEach(mObj => {
                        const mData = mObj.data;
                        let angleRad;
                        if (mData.name === '月') {
                            angleRad = getMoonGeocentricEclipticLon(dDays, T) * rad;
                        } else {
                            const lonDeg = (mData.meanLon0Deg || 0) + (mData.meanLonRateDegPerDay || (360 / mData.period)) * dDays;
                            angleRad = lonDeg * rad;
                        }

                        const mPos = computeMoonPositionThreeJS(mData, dDays, T, angleRad);
                        mObj.mesh.position.copy(mPos);
                        mObj.mesh.rotation.y = -angleRad;

                        if (mObj.orbitLine) {
                            const mPosAttr = mObj.orbitLine.geometry.getAttribute('position');
                            for (let s = 0; s < mPosAttr.count; s++) {
                                const a = (s / (mPosAttr.count - 1)) * Math.PI * 2;
                                const opt = computeMoonPositionThreeJS(mData, dDays, T, a);

            const btnRect = skyCanvas._zenithBtnRect;

            const rect = skyCanvas.getBoundingClientRect();
            const px = clientX - rect.left;
            const py = clientY - rect.top;

            if (nextZoom === prevZoom) return;

            const mx = e.clientX - rect.left;

            const panel = document.querySelector('.control-panel');

            if (p.visibility) Object.assign(astroVisibility, p.visibility);
        } catch (e) { }

    function astroSavePrefs() {
        try {

            o.flattening = o.type === '銀河' ? 0.30 : 1.00;

        if (typeof sun !== 'undefined') sun.visible = !!astroVisibility.solarSystem;
        if (typeof planetMeshes !== 'undefined') {
            Object.values(planetMeshes).forEach(p => {
                p.pivot.visible = !!astroVisibility.solarSystem;
                p.orbitLine.visible = !!astroVisibility.solarSystem;
                if (p.moons) p.moons.forEach(m => {
                    m.mesh.visible = !!astroVisibility.solarSystem;
                    m.orbitLine.visible = !!astroVisibility.solarSystem;

            });

    function astroDrawNebulaPreview() {
        const c = $astro('nebulaPreview');

        if (!o) return;
        const w = c.width, h = c.height;
        x.clearRect(0, 0, w, h);
        x.fillStyle = '#030813';
        x.fillRect(0, 0, w, h);
        for (let i = 0; i < 180; i++) {
            x.fillStyle = `rgba(190,220,255,${((i * 13) % 50) / 220})`;
            x.fillRect((i * 97 % w), (i * 53 % h), 1.5, 1.5);
        }
        const r = Math.max(12, o.size * 2.1), cx = w * 0.48, cy = h * 0.51;
        const g = x.createRadialGradient(cx, cy, r * 0.04, cx, cy, r * (1.1 + o.spread));
        g.addColorStop(0, o.color + 'ee');
        g.addColorStop(0.24, o.color + '99');
        g.addColorStop(0.62, o.color + '35');
        g.addColorStop(1, o.color + '00');
        x.save();
        x.globalAlpha = Math.min(1, o.brightness);
        x.fillStyle = g;
        x.beginPath();
        if (o.type === '銀河') { x.ellipse(cx, cy, r * 1.8, r * 0.58, -0.3, 0, Math.PI * 2); }
        else if (o.type === '球状星団' || o.type === '散開星団') { x.arc(cx, cy, r * 0.8, 0, Math.PI * 2); }
        else if (o.type === '惑星状星雲') { x.arc(cx, cy, r * 0.75, 0, Math.PI * 2); }
        else { x.ellipse(cx, cy, r * 1.25, r * 0.85, 0.25, 0, Math.PI * 2); }
        x.fill();
        x.restore();
        astroDrawSpiralArms(x, cx, cy, r, o.color, Number(o.spiralIntensity ?? 0.65), Number(o.spiralSpread ?? 1), Number(o.flattening ?? 1));
        x.fillStyle = '#eaf5ff';
        x.font = 'bold 22px sans-serif';
        const name = currentLang === 'en' ? (DEEP_SKY_NAMES_EN[o.name] || o.name) : o.name;
        const displayType = currentLang === 'en' ? (NEBULA_TYPE_EN[o.type] || o.type) : o.type;

        x.fillText(`${displayType}  /  Mag ${o.mag}  /  RA ${o.ra.toFixed(2)}°  Dec ${o.dec.toFixed(2)}°`, 24, h - 22);
    }

    // ==========================================

    // ==========================================
    let customRadarLayer = null;

    async function loadCustomMapRainRadar(mapInstance) {
            if (!mapInstance || !showCustomRadar) return; // OFFなら読み込まない
            try {
                const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                if (!resp.ok) return;
                const data = await resp.json();
                const radar = data?.radar;
                const latest = radar?.nowcast?.[0] || radar?.past?.[radar.past.length - 1];
                if (latest && latest.path) {
                    const url = `https://tilecache.rainviewer.com${latest.path}/256/{z}/{x}/{y}/2/1_1.png`;
                    if (customRadarLayer && mapInstance.hasLayer(customRadarLayer)) {
                        mapInstance.removeLayer(customRadarLayer);
                    }
                    customRadarLayer = L.tileLayer(url, { opacity: 0.75, zIndex: 9999 });
                    customRadarLayer.addTo(mapInstance);
                    customRadarLayer.bringToFront();
                }
            } catch (_) { }
        }

    // カスタム地域マップが開かれたときに雨雲をロードするフック
    const origEnsureCustomRegionMap = window.ensureCustomRegionMap;
    if (typeof origEnsureCustomRegionMap === 'function') {
        window.ensureCustomRegionMap = function () {
            origEnsureCustomRegionMap();
            if (typeof customRegionMap !== 'undefined' && customRegionMap) {
                setTimeout(() => {
                    loadCustomMapRainRadar(customRegionMap);
                }, 300);
            }
        };
    }

    // もしすでにカスタムマップが開かれて初期化されている場合の対策
    document.addEventListener('click', (e) => {

    function degToCompass(deg) {
        if (deg === null || deg === undefined) return '';
        const val = Math.floor((deg / 22.5) + 0.5);
        const arr = currentLang === 'en'
            ? ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW']
            : ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
        return arr[(val % 16)];
    }

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            cloudAnimTime += dt * 1000;

            if (isPlaying) {
                simDate = new Date(simDate.getTime() + stepHours * 3600000 * dt);
                updateSimulation(simDate);
            } else if (isRealtimeMode) {
                simDate = new Date();
                updateSimulation(simDate);
            } else if (isSkyMode && showWeather && weatherAvailable) {
                renderTokyoSky(simDate);

                controls.update();
                renderer.render(scene, camera);
                renderSpaceLabels3D();
            }
        }

            const width = Math.max(1, window.visualViewport ? window.visualViewport.width : window.innerWidth);
            const height = Math.max(1, window.visualViewport ? window.visualViewport.height : window.innerHeight);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.matchMedia('(max-width: 700px)').matches ? 1.5 : 2));
            renderer.setSize(width, height, false);
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
        }
        window.addEventListener('resize', resizeMainRenderer, { passive: true });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeMainRenderer, { passive: true });
        resizeMainRenderer();

        setViewMode('south');
        btnToggleConst.style.background = '#5522aa';
        btnToggleConst.style.color = '#fff';
        updateLanguageUI();
        updateSimulation(simDate);
        ensureWeatherData();
        animate(performance.now());
    </script>

<script>
/* 設定パネルをスクロールする操作バーの外へ移動し、PC/スマホで全体を表示 */
(() => {
    const detachSettingsPanels = () => {
        ['homeSettingsPanel', 'customRegionPanel'].forEach((id) => {
            const panel = document.getElementById(id);
            if (panel && panel.parentElement !== document.body) {
                document.body.appendChild(panel);
            }
        });
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', detachSettingsPanels, { once: true });
    } else {
        detachSettingsPanels();
    }
})();
</script>
