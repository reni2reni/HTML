<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽系 3D ＆ プラネタリウム・シミュレーター</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 上下2段の操作パネル */
        .control-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            box-sizing: border-box;
            background: rgba(8, 14, 28, 0.90);
            border-bottom: 1px solid #1e335a;
            padding: 8px 16px 9px;
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 100;
        }

        .toolbar-row {
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px 18px;
            box-sizing: border-box;
        }

        .toolbar-primary {
            min-height: 34px;
        }

        .toolbar-secondary {
            min-height: 34px;
            padding-top: 6px;
            border-top: 1px solid rgba(90, 125, 180, 0.28);
        }

        .date-home-group {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 0 0 auto;
        }

        /* 直接入力できる日時ピッカー */
        #dateInput {
            background: #101a38;
            border: 1px solid #00a6ff;
            border-radius: 6px;
            color: #00d2ff;
            font-size: 1.0rem;
            font-weight: 600;
            padding: 4px 8px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            color-scheme: dark;
        }

        #dateInput:hover,
        #dateInput:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .button-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .primary-actions {
            justify-content: flex-end;
        }

        button {
            background: #182247;
            border: 1px solid #334e80;
            color: #e0e6ed;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        button:hover {
            background: #253773;
            border-color: #00d2ff;
            color: #fff;
        }

        button:not(.sky-edge-btn):active {
            transform: scale(0.96);
        }

        .location-speed-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex: 0 0 auto;
            min-width: 0;
        }

        #citySelect {
            background: #182247;
            border: 1px solid #334e80;
            color: #fff;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.85rem;
            cursor: pointer;
            width: min(340px, 34vw);
            min-width: 190px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
            white-space: nowrap;
        }

        input[type=range] {
            width: 160px;
            cursor: pointer;
            accent-color: #00a6ff;
        }

        .clock-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 3px 22px;
            min-width: 0;
            color: #a9d8ff;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .clock-row span {
            white-space: normal;
        }

        /* ホーム設定ポップアップ（横幅拡大対応） */
        .home-settings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 10%);
            z-index: 220;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            width: min(1000px, calc(100vw - 32px));
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 16px 18px;
            border: 1px solid #34517e;
            border-radius: 10px;
            background: rgba(8, 14, 28, 0.98);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        #homeRegionMap {
            flex-basis: 100%;
            width: 100%;
            height: 440px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #2d4d7a;
            overflow: hidden;
            background: #071326;
        }

        .home-settings[hidden] {
            display: none !important;
        }

        .home-settings strong {
            color: #b9d8ff;
            font-size: 0.84rem;
            margin-right: 3px;
        }

        .home-settings label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #cbd8ef;
            font-size: 0.80rem;
        }

        .home-settings input,
        .home-settings select {
            box-sizing: border-box;
            min-width: 0;
            height: 29px;
            padding: 3px 6px;
            background: #101a38;
            border: 1px solid #334e80;
            border-radius: 5px;
            color: #fff;
            font: inherit;
            color-scheme: dark;
        }

        #homeName {
            width: 120px;
        }

        #homeLat {
            width: 100px;
        }

        #homeLon {
            width: 115px;
        }

        #homeTimeZone {
            width: 160px;
            max-width: 38vw;
        }

        #btnSaveHome {
            padding: 6px 14px;
        }

        /* カスタム地域設定ポップアップ */
        .custom-region-settings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 10%);
            z-index: 225;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 14px;
            width: min(1000px, calc(100vw - 32px));
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 16px 18px;
            border: 1px solid #3c699e;
            border-radius: 10px;
            background: rgba(8, 14, 28, 0.98);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        #customRegionMap {
            flex-basis: 100%;
            width: 100%;
            height: 440px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #2d4d7a;
            overflow: hidden;
            background: #071326;
        }

        .custom-region-settings[hidden] {
            display: none !important;
        }

        .custom-region-settings strong {
            color: #b9e4ff;
            font-size: 0.84rem;
            margin-right: 3px;
        }

        .custom-region-settings label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #cbd8ef;
            font-size: 0.80rem;
        }

        .custom-region-settings input {
            box-sizing: border-box;
            min-width: 0;
            height: 29px;
            padding: 3px 6px;
            background: #101a38;
            border: 1px solid #334e80;
            border-radius: 5px;
            color: #fff;
            font: inherit;
            color-scheme: dark;
        }

        #customRegionName {
            width: 160px;
        }

        #customRegionLat {
            width: 100px;
        }

        #customRegionLon {
            width: 115px;
        }

        #btnSaveCustomRegion {
            padding: 6px 14px;
        }

        .custom-region-status {
            color: #8fd8ff;
            font-size: 0.76rem;
        }

        @media (max-width: 980px) {
            .toolbar-primary {
                align-items: flex-start;
            }

            .primary-actions {
                justify-content: flex-start;
            }

            .toolbar-row {
                flex-wrap: wrap;
            }

            .toolbar-secondary {
                align-items: flex-start;
            }
        }

        @media (max-width: 640px) {
            .sky-edge-btn {
                top: 152px;
                padding: 9px 11px;
                font-size: 0.85rem;
            }

            .control-panel {
                padding: 7px 8px;
                gap: 6px;
            }

            .toolbar-row {
                gap: 7px;
            }

            .date-home-group {
                width: 100%;
            }

            #dateInput {
                min-width: 0;
                flex: 1 1 190px;
            }

            .primary-actions {
                gap: 4px;
            }

            .primary-actions button {
                padding: 5px 7px;
                font-size: 0.78rem;
            }

            .toolbar-secondary {
                flex-direction: column;
            }

            .clock-row {
                flex-direction: column;
                gap: 2px;
            }

            .location-speed-group {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            #citySelect {
                width: min(100%, 340px);
                min-width: 170px;
                flex: 1 1 190px;
            }

            .home-settings {
                left: 8px;
                transform: translateY(-50%);
                width: calc(100vw - 16px);
                max-width: calc(100vw - 16px);
                gap: 7px;
            }

            .custom-region-settings {
                left: 8px;
                transform: translateY(-50%);
                width: calc(100vw - 16px);
                max-width: calc(100vw - 16px);
            }

            #homeRegionMap,
            #customRegionMap {
                height: 260px;
            }
        }

        .sky-edge-btn {
            position: fixed;
            top: 132px;
            transform: none;
            z-index: 160;
            pointer-events: auto;
            touch-action: manipulation;
            background: rgba(14, 24, 48, 0.92);
            border: 1px solid #4874b8;
            color: #e6f4ff;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .sky-edge-btn:hover {
            background: #243e75;
            border-color: #00e5ff;
            color: #ffffff;
        }

        .sky-edge-btn:active {
            background: #2e5299;
            transform: none;
        }

        #btnSkyEdgeLeft {
            left: 12px;
        }

        #btnSkyEdgeRight {
            right: 12px;
        }

        #skyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            display: block;
        }

        .custom-region-actions {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #btnCloseCustomRegion {
            padding: 6px 12px;
            background: #232c4d;
            border-color: #4a6394;
        }

        #btnCloseCustomRegion:hover {
            background: #354375;
            border-color: #7cc4ff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

    <div id="canvas-container"></div>
    <canvas id="skyCanvas"></canvas>
    <button id="btnSkyEdgeLeft" class="sky-edge-btn" type="button">◀ 東の空</button>

                <button id="btnNextHour">1時 ▶</button>
                <button id="btnNextDay">1日 ▶</button>-
                <button id="btnToggleConst"
                    style="background: #182247; border: 1px solid #6644aa; color: #d0b0ff; font-weight: bold;">✨ 星座:

                <button id="btnToggleLabels" type="button"

                <button id="btnLanguage" type="button" title="Language">🌐 English</button>

        </div>

                <input id="customRegionName" type="text" maxlength="60" placeholder="例：種子島 / Tanegashima"
                    autocomplete="off">
            </label>

                <input id="customRegionLat" type="number" min="-90" max="90" step="0.0001" placeholder="30.7325">

    <script>
        // ==========================================
        // 1. 基本設定 & 3D シーン構築 (Three.js)
        // ==========================================
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 4000);
        camera.position.set(-60, 360, 480);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 2500;
        controls.minDistance = 20;

        const sunLight = new THREE.PointLight(0xffffff, 2.2, 0, 0);
        scene.add(sunLight);
        const ambientLight = new THREE.AmbientLight(0x3a4668);
        scene.add(ambientLight);

        const sunGeo = new THREE.SphereGeometry(14, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // ==========================================
        // 2. NASA JPL Keplerian Elements 軌道要素
        // ==========================================
        const orbitalElements = {
            mercury: { a: 0.38709927, e: 0.20563593, I: 7.00497902, L: 252.25032350, L_dot: 149472.67411175, lp: 77.45779628, lp_dot: 1.55647766, node: 48.33076593, node_dot: 1.25360430 },
            venus: { a: 0.72333566, e: 0.00677672, I: 3.39467605, L: 181.97909950, L_dot: 58517.81538729, lp: 131.60246718, lp_dot: 1.40224415, node: 76.67984255, node_dot: 0.90112060 },
            earth: { a: 1.00000261, e: 0.01671123, I: 0.00001531, L: 100.46457166, L_dot: 35999.37244981, lp: 102.93768193, lp_dot: 1.02119476, node: 0.0, node_dot: 0.0 },
            mars: { a: 1.52371034, e: 0.09339410, I: 1.84969142, L: -4.55343205, L_dot: 19140.30268499, lp: -23.94362959, lp_dot: 1.84074402, node: 49.55953891, node_dot: 0.77108146 },
            jupiter: { a: 5.20288700, e: 0.04838624, I: 1.30439695, L: 34.39644051, L_dot: 3034.74612775, lp: 14.72847983, lp_dot: 1.61996857, node: 100.47390909, node_dot: 1.02097740 },
            saturn: { a: 9.53667594, e: 0.05386179, I: 2.48599187, L: 49.95424423, L_dot: 1222.49362201, lp: 92.59887831, lp_dot: 1.96376941, node: 113.66242448, node_dot: 0.87708800 },
            uranus: { a: 19.1891646, e: 0.04725744, I: 0.77263783, L: 313.2381045, L_dot: 428.48202785, lp: 170.9542763, lp_dot: 1.40540441, node: 74.00595701, node_dot: 0.52112776 },
            neptune: { a: 30.0699227, e: 0.00860619, I: 1.77004347, L: -55.1200296, L_dot: 218.45945325, lp: 44.96476227, lp_dot: 0.76799153, node: 131.78405708, node_dot: 1.10220397 }
        };

        function scaleDistance(rAU, semiMajorAU) {
            const baseAU = (typeof semiMajorAU === 'number' && semiMajorAU > 0) ? semiMajorAU : rAU;
            const mapBase = (au) => {
                if (au <= 1.8) {
                    return 46 + (au - 0.387) * 95;
                } else {
                    const dx = au - 1.8;
                    return 180.235 + 42 * (Math.pow(1 + dx * 2.26, 0.56) - 1) / 0.56 / 2.26 * 2.26;
                }
            };
            const baseDist = mapBase(baseAU);
            const eccBoost = baseAU <= 2.0 ? 155 : 55;
            return Math.max(24, baseDist + (rAU - baseAU) * eccBoost);
        }

        function solveKepler(M, e) {
            let E = M;
            for (let i = 0; i < 7; i++) {
                const dE = (M - (E - e * Math.sin(E))) / (1 - e * Math.cos(E));
                E += dE;
                if (Math.abs(dE) < 1e-6) break;
            }
            return E;
        }

        function getPlanetHelioPosition(elem, T) {
            const rad = Math.PI / 180;
            const a = elem.a;
            const e = elem.e;
            const I = elem.I * rad;
            const L = (elem.L + elem.L_dot * T) * rad;
            const lp = (elem.lp + elem.lp_dot * T) * rad;
            const node = (elem.node + elem.node_dot * T) * rad;
            const omega = lp - node;

            let M = L - lp;
            M = (M % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

            const E = solveKepler(M, e);
            const xPrime = a * (Math.cos(E) - e);
            const yPrime = a * (Math.sqrt(1 - e * e) * Math.sin(E));

            const r = Math.sqrt(xPrime * xPrime + yPrime * yPrime);
            const nu = Math.atan2(yPrime, xPrime);

            const u = omega + nu;
            const xEcl = r * (Math.cos(node) * Math.cos(u) - Math.sin(node) * Math.sin(u) * Math.cos(I));
            const yEcl = r * (Math.sin(node) * Math.cos(u) + Math.cos(node) * Math.sin(u) * Math.cos(I));
            const zEcl = r * (Math.sin(u) * Math.sin(I));

            const distScaled = scaleDistance(r, elem.a);
            const factor = distScaled / r;
            return {
                x: xEcl * factor,
                y: zEcl * factor,
                z: -yEcl * factor,
                trueEcl: { x: xEcl, y: yEcl, z: zEcl, r: r, lon: Math.atan2(yEcl, xEcl) }
            };
        }

        const planetsConfig = [
            { id: 'mercury', name: '水星', radius: 2.0, color: 0xaaaaaa, rotPeriodHours: 1407.6, tiltDeg: 0.03 },
            { id: 'venus', name: '金星', radius: 3.5, color: 0xe3bb76, rotPeriodHours: -5832.5, tiltDeg: 177.36 },
            {
                id: 'earth', name: '地球', radius: 4.2, color: 0x2277ff, isEarth: true, rotPeriodHours: 23.9345, tiltDeg: 23.44,
                moons: [
                    {
                        name: '月', radius: 1.2, dist: 12.0, color: 0xffffff,
                        period: 27.321661, incDeg: 5.145, node0Deg: 125.0445, nodeRateDegPerDay: -0.05295392,
                        meanLon0Deg: 218.3164, meanLonRateDegPerDay: 13.1763965, dir: 1
                    }
                ]
            },
            {
                id: 'mars', name: '火星', radius: 2.6, color: 0xdd5533, rotPeriodHours: 24.6229, tiltDeg: 25.19,
                moons: [
                    {
                        name: 'フォボス', radius: 0.5, dist: 4.5, color: 0xaaaaaa,
                        period: 0.31891023, incDeg: 1.08, node0Deg: 47.0, nodeRateDegPerDay: 0.0,
                        meanLon0Deg: 35.0, meanLonRateDegPerDay: 360.0 / 0.31891023, dir: 1
                    }
                ]
            },
            {
                id: 'jupiter', name: '木星', radius: 8.5, color: 0xc89e74, rotPeriodHours: 9.925, tiltDeg: 3.13,
                moons: [
                    {
                        name: 'イオ', radius: 0.8, dist: 12.5, color: 0xffddaa,
                        period: 1.769137786, incDeg: 0.05, node0Deg: 43.977, nodeRateDegPerDay: 0.0,
                        meanLon0Deg: 200.39, meanLonRateDegPerDay: 360.0 / 1.769137786, dir: 1
                    },
                    {
                        name: 'エウロパ', radius: 0.7, dist: 16.5, color: 0xddddff,
                        period: 3.551181041, incDeg: 0.47, node0Deg: 219.106, nodeRateDegPerDay: 0.0,
                        meanLon0Deg: 36.22, meanLonRateDegPerDay: 360.0 / 3.551181041, dir: 1
                    },
                    {
                        name: 'ガニメデ', radius: 1.0, dist: 21.0, color: 0xcccccc,
                        period: 7.15455296, incDeg: 0.20, node0Deg: 63.552, nodeRateDegPerDay: 0.0,
                        meanLon0Deg: 43.80, meanLonRateDegPerDay: 360.0 / 7.15455296, dir: 1
                    }
                ]
            },
            {
                id: 'saturn', name: '土星', radius: 7.0, color: 0xdfcb97, hasRing: true, rotPeriodHours: 10.656, tiltDeg: 26.73,
                moons: [
                    {
                        name: 'タイタン', radius: 1.0, dist: 15.0, color: 0xeecc88,
                        period: 15.945421, incDeg: 0.35, node0Deg: 28.06, nodeRateDegPerDay: 0.0,
                        meanLon0Deg: 186.6, meanLonRateDegPerDay: 360.0 / 15.945421, dir: 1
                    }
                ]
            },
            { id: 'uranus', name: '天王星', radius: 4.8, color: 0x66ccbb, rotPeriodHours: -17.24, tiltDeg: 97.77 },
            { id: 'neptune', name: '海王星', radius: 4.6, color: 0x274687, rotPeriodHours: 16.11, tiltDeg: 28.32 }
        ];

        function computeOrbitPointThreeJS(elem, nuRad, T) {
            const rad = Math.PI / 180;
            const I = elem.I * rad;
            const node = (elem.node + elem.node_dot * T) * rad;
            const omega = ((elem.lp + elem.lp_dot * T) - (elem.node + elem.node_dot * T)) * rad;
            const r = elem.a * (1 - elem.e * elem.e) / (1 + elem.e * Math.cos(nuRad));
            const u = omega + nuRad;

            const xEcl = r * (Math.cos(node) * Math.cos(u) - Math.sin(node) * Math.sin(u) * Math.cos(I));
            const yEcl = r * (Math.sin(node) * Math.cos(u) + Math.cos(node) * Math.sin(u) * Math.cos(I));
            const zEcl = r * (Math.sin(u) * Math.sin(I));

            const distScaled = scaleDistance(r, elem.a);
            const factor = distScaled / r;
            return new THREE.Vector3(xEcl * factor, zEcl * factor, -yEcl * factor);
        }

        function computeMoonPositionThreeJS(moonData, dDays, T, angleRad) {
            const rad = Math.PI / 180;
            const inc = (moonData.incDeg || 0) * rad;
            const nodeDeg = (moonData.node0Deg || 0) + (moonData.nodeRateDegPerDay || 0) * dDays;
            const node = nodeDeg * rad;
            const dir = moonData.dir === -1 ? -1 : 1;
            const u = dir * (angleRad - node);

            const r = moonData.dist;
            const xEcl = r * (Math.cos(node) * Math.cos(u) - Math.sin(node) * Math.sin(u) * Math.cos(inc));
            const yEcl = r * (Math.sin(node) * Math.cos(u) + Math.cos(node) * Math.sin(u) * Math.cos(inc));
            const zEcl = r * (Math.sin(u) * Math.sin(inc));

            const parentTilt = moonData.attachToTiltGroup ? 0 : (moonData.parentTiltRad || 0);
            const yTilted = yEcl * Math.cos(parentTilt) - zEcl * Math.sin(parentTilt);
            const zTilted = yEcl * Math.sin(parentTilt) + zEcl * Math.cos(parentTilt);

            return new THREE.Vector3(xEcl, zTilted, -yTilted);
        }

        const planetMeshes = {};
        let earthMesh, tokyoMarker, moonMesh;

        planetsConfig.forEach(p => {
            const pivot = new THREE.Group();
            scene.add(pivot);

            const tiltGroup = new THREE.Group();
            tiltGroup.rotation.z = -((p.tiltDeg || 0) * Math.PI / 180);
            pivot.add(tiltGroup);

            const pGeo = new THREE.SphereGeometry(p.radius, 32, 32);
            const pMat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.75 });
            const mesh = new THREE.Mesh(pGeo, pMat);
            tiltGroup.add(mesh);

            if (p.hasRing) {
                const ringGeo = new THREE.RingGeometry(p.radius * 1.3, p.radius * 2.2, 48);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa9468, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                tiltGroup.add(ring);
            }

            if (p.isEarth) {
                earthMesh = mesh;
                const lat = 35.68 * (Math.PI / 180);
                const lon = 139.76 * (Math.PI / 180);
                const r = p.radius * 1.03;
                const x = r * Math.cos(lat) * Math.sin(lon);
                const y = r * Math.sin(lat);
                const z = r * Math.cos(lat) * Math.cos(lon);

                const markerGeo = new THREE.SphereGeometry(0.55, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({ color: 0xff1133 });
                tokyoMarker = new THREE.Mesh(markerGeo, markerMat);
                tokyoMarker.position.set(x, y, z);
                earthMesh.add(tokyoMarker);
            }

            const moonList = [];
            if (p.moons) {
                const attachToTiltGroup = (p.id === 'jupiter' || p.id === 'saturn');
                const parentHost = attachToTiltGroup ? tiltGroup : pivot;
                const parentTiltRad = attachToTiltGroup ? 0 : 0;
                p.moons.forEach(m => {
                    m.parentTiltRad = parentTiltRad;
                    m.attachToTiltGroup = attachToTiltGroup;
                    const orbitPts = [];
                    for (let step = 0; step <= 64; step++) {
                        const a = (step / 64) * Math.PI * 2;
                        orbitPts.push(computeMoonPositionThreeJS(m, 0, 0, a));
                    }
                    const mOrbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
                    const mOrbitLine = new THREE.Line(mOrbitGeo, new THREE.LineBasicMaterial({ color: 0x3a527a, transparent: true, opacity: 0.5 }));
                    parentHost.add(mOrbitLine);

                    const mGeo = new THREE.SphereGeometry(m.radius, 16, 16);
                    const mMat = new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.9 });
                    const mMesh = new THREE.Mesh(mGeo, mMat);
                    parentHost.add(mMesh);

                    if (p.isEarth && m.name === '月') moonMesh = mMesh;
                    moonList.push({ mesh: mMesh, orbitLine: mOrbitLine, data: m });
                });
            }

            const orbitPts = [];
            const elem = orbitalElements[p.id];
            const rad = Math.PI / 180;
            for (let deg = 0; deg <= 360; deg += 2) {
                orbitPts.push(computeOrbitPointThreeJS(elem, deg * rad, 0));
            }
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
            const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x2a436b, transparent: true, opacity: 0.55 }));
            scene.add(orbitLine);

            planetMeshes[p.id] = { pivot, tiltGroup, mesh, orbitLine, config: p, moons: moonList, elem: elem };
        });

        function getMoonGeocentricEclipticLon(dDays, T) {
            const rad = Math.PI / 180;
            const Lp = (218.3164477 + 481267.88123421 * T) % 360;
            const D = (297.8501921 + 445267.1114034 * T) % 360;
            const M = (357.5291092 + 35999.0502909 * T) % 360;
            const Mp = (134.9633964 + 477198.8675055 * T) % 360;

            let lon = Lp
                + 6.289 * Math.sin(Mp * rad)
                - 1.274 * Math.sin((2 * D - Mp) * rad)
                + 0.658 * Math.sin((2 * D) * rad)
                - 0.214 * Math.sin((2 * Mp) * rad)
                - 0.186 * Math.sin(M * rad);

            return (lon % 360 + 360) % 360;
        }

        // ==========================================
        // 2.5 天文潮の概算
        // ==========================================
        const TIDE_LUNAR_AMPLITUDE_M = 0.36;
        const TIDE_SOLAR_AMPLITUDE_M = 0.16;
        const TIDE_MEAN_LUNAR_DISTANCE_KM = 384400;
        const annualTideRangeCache = new Map();

        function tideHeightFromAltitudes(sunAltDeg, moonAltDeg, dDays, T, earthSunDistanceAU) {
            const rad = Math.PI / 180;
            const D = (297.8501921 + 445267.1114034 * T) * rad;
            const M = (357.5291092 + 35999.0502909 * T) * rad;
            const Mp = (134.9633964 + 477198.8675055 * T) * rad;

            const moonDistanceKm = 385000.56
                - 20905.4 * Math.cos(Mp)
                - 3699.1 * Math.cos(2 * D - Mp)
                - 2956.0 * Math.cos(2 * D)
                - 570.2 * Math.cos(2 * Mp)
                + 246.2 * Math.cos(2 * Mp - 2 * D)
                - 205.6 * Math.cos(M - 2 * D);

            const moonP2 = (3 * Math.pow(Math.sin(moonAltDeg * rad), 2) - 1) / 2;
            const sunP2 = (3 * Math.pow(Math.sin(sunAltDeg * rad), 2) - 1) / 2;
            const lunarDistanceFactor = Math.pow(TIDE_MEAN_LUNAR_DISTANCE_KM / moonDistanceKm, 3);
            const solarDistanceFactor = 1 / Math.pow(Math.max(0.9, earthSunDistanceAU), 3);

            const lunarTerm = TIDE_LUNAR_AMPLITUDE_M * lunarDistanceFactor * moonP2;
            const solarTerm = TIDE_SOLAR_AMPLITUDE_M * solarDistanceFactor * sunP2;
            return lunarTerm + solarTerm;
        }

        function getAstronomicalTideHeight(date) {
            const jd = (date.getTime() / 86400000.0) + 2440587.5;
            const dDays = jd - 2451545.0;
            const T = dDays / 36525.0;
            const earthPos = getPlanetHelioPosition(orbitalElements.earth, T).trueEcl;
            const sunGeo = { x: -earthPos.x, y: -earthPos.y, z: -earthPos.z };
            const sunHoriz = toHorizontal(sunGeo.x, sunGeo.y, sunGeo.z, dDays);
            const moonLon = getMoonGeocentricEclipticLon(dDays, T) * Math.PI / 180;
            const moonHoriz = toHorizontal(Math.cos(moonLon), Math.sin(moonLon), 0, dDays);
            return tideHeightFromAltitudes(sunHoriz.alt, moonHoriz.alt, dDays, T, earthPos.r);
        }

        // ==========================================
        // 2.6 港湾潮汐データ取得
        // ==========================================
        const TIDE_API = 'https://api.openwaters.io/tides';
        const TIDE_MAX_DISTANCE_KM = 50;
        const TIDE_BLOCK_MS = 7 * 86400000;

        const tideTimelineCache = new Map();
        const tideAnnualCache = new Map();
        const tidePending = new Set();
        const tideRetryAfter = new Map();

        function tideLocationKey() {
            return `${currentCity.lat.toFixed(4)},${currentCity.lon.toFixed(4)}`;
        }

        function tideDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function tideStationIsNear(data) {
            const s = data?.station;
            if (!s) return false;
            const lat = Number(s.latitude ?? s.lat);
            const lon = Number(s.longitude ?? s.lon ?? s.lng);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
            return tideDistanceKm(currentCity.lat, currentCity.lon, lat, lon) <= TIDE_MAX_DISTANCE_KM;
        }

        async function fetchTideJson(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Tide API error: ${response.status}`);
            return response.json();
        }

        function ensureActualTideData(date) {
            const location = tideLocationKey();
            const blockStart = Math.floor(date.getTime() / TIDE_BLOCK_MS) * TIDE_BLOCK_MS;
            const timelineKey = `${location}|${blockStart}`;

            if (!tideTimelineCache.has(timelineKey) && !tidePending.has(timelineKey) && Date.now() >= (tideRetryAfter.get(timelineKey) || 0)) {
                tidePending.add(timelineKey);
                const start = new Date(blockStart);
                const end = new Date(blockStart + TIDE_BLOCK_MS);
                const params = new URLSearchParams({ latitude: currentCity.lat, longitude: currentCity.lon, start: start.toISOString(), end: end.toISOString(), units: 'meters' });

                fetchTideJson(`${TIDE_API}/timeline?${params}`)
                    .then(data => {
                        if (!tideStationIsNear(data)) {
                            tideTimelineCache.set(timelineKey, { unavailable: true });
                            return;
                        }
                        const points = (data.timeline || []).map(p => ({ time: new Date(p.time).getTime(), level: Number(p.level) }))
                            .filter(p => Number.isFinite(p.time) && Number.isFinite(p.level)).sort((a, b) => a.time - b.time);
                        if (points.length < 2) {
                            tideTimelineCache.set(timelineKey, { unavailable: true });
                            return;
                        }
                        tideTimelineCache.set(timelineKey, { points, station: data.station.name });
                        while (tideTimelineCache.size > 12) tideTimelineCache.delete(tideTimelineCache.keys().next().value);
                    })
                    .catch(() => { tideRetryAfter.set(timelineKey, Date.now() + 120000); })
                    .finally(() => { tidePending.delete(timelineKey); if (isSkyMode) renderTokyoSky(simDate); });
            }

            const year = date.getFullYear();
            const annualKey = `${location}|${year}`;
            if (!tideAnnualCache.has(annualKey) && !tidePending.has(annualKey) && Date.now() >= (tideRetryAfter.get(annualKey) || 0)) {
                tidePending.add(annualKey);
                const params = new URLSearchParams({ latitude: currentCity.lat, longitude: currentCity.lon, start: new Date(Date.UTC(year, 0, 1)).toISOString(), end: new Date(Date.UTC(year + 1, 0, 1)).toISOString(), units: 'meters' });

                fetchTideJson(`${TIDE_API}/extremes?${params}`)
                    .then(data => {
                        if (!tideStationIsNear(data)) {
                            tideAnnualCache.set(annualKey, { unavailable: true });
                            return;
                        }
                        const levels = (data.extremes || []).map(p => Number(p.level)).filter(Number.isFinite);
                        if (!levels.length) {
                            tideAnnualCache.set(annualKey, { unavailable: true });
                            return;
                        }
                        tideAnnualCache.set(annualKey, { min: Math.min(...levels), max: Math.max(...levels) });
                        while (tideAnnualCache.size > 8) tideAnnualCache.delete(tideAnnualCache.keys().next().value);
                    })
                    .catch(() => { tideRetryAfter.set(annualKey, Date.now() + 120000); })
                    .finally(() => { tidePending.delete(annualKey); if (isSkyMode) renderTokyoSky(simDate); });
            }
        }

        function getActualTideAt(date) {
            const blockStart = Math.floor(date.getTime() / TIDE_BLOCK_MS) * TIDE_BLOCK_MS;
            const key = `${tideLocationKey()}|${blockStart}`;
            const entry = tideTimelineCache.get(key);
            if (!entry || entry.unavailable) return null;
            const points = entry.points;
            const time = date.getTime();
            let low = 0, high = points.length - 1;
            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                if (points[mid].time < time) low = mid + 1;
                else high = mid - 1;
            }
            const a = points[high], b = points[low];
            if (!a || !b) return null;
            const ratio = (time - a.time) / (b.time - a.time);
            return a.level + (b.level - a.level) * ratio;
        }

        function getActualAnnualTideRange(date) {
            const key = `${tideLocationKey()}|${date.getFullYear()}`;
            const result = tideAnnualCache.get(key);
            if (!result || result.unavailable) return null;
            return result;

        let weatherFetchedAt = 0;
        let weatherAvailable = false;
        const WEATHER_FADE_HOURS = 6; // 現在天気しかないため、未来6時間で徐々に非表示
        let currentWeather = {
            weatherCode: 0,
            cloudCover: 0,
            isRaining: false,
            isSnowing: false,
            icon: '☀️',
            textJa: '快晴',
            textEn: 'Clear',
            temperature: null
        };

        function parseWeatherCode(code, cloudCover) {
            let icon = '☀️', textJa = '快晴', textEn = 'Clear';
            let isRaining = false, isSnowing = false;

            if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
                icon = '❄️'; textJa = '雪'; textEn = 'Snow';
                isSnowing = true;
            } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) {
                icon = '🌧️'; textJa = '雨'; textEn = 'Rain';
                isRaining = true;
            } else if (code >= 45 && code <= 48) {
                icon = '🌫️'; textJa = '霧'; textEn = 'Fog';
            } else if (code === 3 || cloudCover >= 80) {
                icon = '☁️'; textJa = '曇り'; textEn = 'Overcast';
            } else if (code === 2 || cloudCover >= 40) {
                icon = '⛅'; textJa = '晴れ時々曇り'; textEn = 'Partly Cloudy';
            } else if (code === 1 || cloudCover >= 15) {
                icon = '🌤️'; textJa = 'おおむね晴れ'; textEn = 'Mostly Clear';
            }
            return { weatherCode: code, cloudCover, isRaining, isSnowing, icon, textJa, textEn, temperature: null };
        }

        function ensureWeatherData() {
            const key = `${currentCity.lat.toFixed(2)},${currentCity.lon.toFixed(2)}`;
            const cached = weatherCache.get(key);
            if (cached && (Date.now() - cached.fetchedAt < 15 * 60 * 1000)) {
                currentWeather = cached.data;
                weatherFetchedAt = cached.fetchedAt;
                weatherAvailable = true;
                return;
            }
            if (weatherPending) return;
            weatherPending = true;

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentCity.lat.toFixed(4)}&longitude=${currentCity.lon.toFixed(4)}&current=weather_code,cloud_cover,temperature_2m&timezone=auto`;
            fetch(url)
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data && data.current && data.current.weather_code !== undefined) {
                        const code = Number(data.current.weather_code) || 0;
                        const cover = Number(data.current.cloud_cover) || 0;
                        const parsed = parseWeatherCode(code, cover);
                        parsed.temperature = Number.isFinite(Number(data.current.temperature_2m))

                        currentWeather = parsed;

        // アンラップ付きTopoJSONデコーダー共通関数（日付変更線の横断ジャンプ・反転を完全に防止）
        function decodeTopoToUnwrappedPolys(topo, decodeArc) {
            const ringToLatLngs = (ring) => {
                const rawCoords = [];
                ring.forEach(arcIdx => {
                    decodeArc(arcIdx).forEach(([lon, lat]) => {
                        rawCoords.push([lat, lon]);
                    });
                });
                if (rawCoords.length === 0) return [];

                const unwrapped = [rawCoords[0]];
                let prevLon = rawCoords[0][1];
                let offset = 0;
                for (let i = 1; i < rawCoords.length; i++) {
                    const lat = rawCoords[i][0];
                    let lon = rawCoords[i][1] + offset;
                    const diff = lon - prevLon;
                    if (diff > 180) {
                        offset -= 360;
                        lon -= 360;
                    } else if (diff < -180) {
                        offset += 360;
                        lon += 360;
                    }
                    unwrapped.push([lat, lon]);
                    prevLon = lon;
                }

                let sumLon = 0;
                for (let i = 0; i < unwrapped.length; i++) sumLon += unwrapped[i][1];
                const avgLon = sumLon / unwrapped.length;
                if (avgLon > 180) {
                    const shift = -360 * Math.round(avgLon / 360);
                    for (let i = 0; i < unwrapped.length; i++) unwrapped[i][1] += shift;
                } else if (avgLon < -180) {
                    const shift = 360 * Math.round(-avgLon / 360);
                    for (let i = 0; i < unwrapped.length; i++) unwrapped[i][1] += shift;
                }

                return unwrapped;
            };

            const polys = [];
            topo.objects.countries.geometries.forEach(g => {
                if (g.type === 'Polygon') {
                    polys.push(g.arcs.map(ringToLatLngs));
                } else if (g.type === 'MultiPolygon') {
                    g.arcs.forEach(p => polys.push(p.map(ringToLatLngs)));
                }
            });
            return polys;
        }

        function ensureCustomRegionMap() {
            const mapEl = document.getElementById('customRegionMap');
            if (!mapEl || typeof L === 'undefined') return;

            if (!customRegionMap) {
                customRegionMap = L.map(mapEl, { worldCopyJump: true, minZoom: 1, maxZoom: 8 }).setView([20, 0], 1);
                const GridLayer = L.GridLayer.extend({

        function getAzimuthAtLocation(phi, dec, H, alt) {
            const east = -Math.cos(dec) * Math.sin(H);
            const north = Math.sin(dec) * Math.cos(phi) - Math.cos(dec) * Math.cos(H) * Math.sin(phi);
            if (Math.hypot(east, north) < 1e-12) return 0;
            let az = Math.atan2(east, north);
            if (az < 0) az += 2 * Math.PI;
            return az;
        }

        // ==========================================
        // 4. 地平座標変換 & 月の満ち欠け
        // ==========================================
        function toHorizontal(geoX, geoY, geoZ, dDays) {
            const eps = 23.4392911 * (Math.PI / 180);
            const phi = currentCity.lat * (Math.PI / 180);
            const lon = currentCity.lon;

            const eqX = geoX;
            const eqY = geoY * Math.cos(eps) - geoZ * Math.sin(eps);
            const eqZ = geoY * Math.sin(eps) + geoZ * Math.cos(eps);

            const ra = Math.atan2(eqY, eqX);
            const dec = Math.atan2(eqZ, Math.sqrt(eqX * eqX + eqY * eqY));

            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + lon) % 360) * (Math.PI / 180);
            const H = lmstRad - ra;

            const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
            const alt = Math.asin(sinAlt);
            const az = getAzimuthAtLocation(phi, dec, H, alt);

            return { alt: alt * (180 / Math.PI), az: az * (180 / Math.PI) };
        }

        function raDecToHorizontal(raDeg, decDeg, dDays) {
            const phi = currentCity.lat * (Math.PI / 180);
            const dec = decDeg * (Math.PI / 180);
            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + currentCity.lon) % 360) * (Math.PI / 180);
            const H = lmstRad - (raDeg * Math.PI / 180);

            const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
            const alt = Math.asin(sinAlt);
            const cosAz = (Math.sin(dec) - Math.sin(phi) * sinAlt) / (Math.cos(phi) * Math.cos(alt));
            const sinAz = -Math.cos(dec) * Math.sin(H) / Math.cos(alt);
            let az = Math.atan2(sinAz, cosAz);
            if (az < 0) az += 2 * Math.PI;

            return { alt: alt * (180 / Math.PI), az: az * (180 / Math.PI) };
        }

        function getMoonGeocentricVector3D(dDays, T) {
            const moonData = (planetsConfig.find(p => p.isEarth)?.moons || []).find(m => m.name === '月');
            const rad = Math.PI / 180;
            const angleRad = getMoonGeocentricEclipticLon(dDays, T) * rad;
            const inc = ((moonData && moonData.incDeg) || 5.145) * rad;
            const nodeDeg = ((moonData && moonData.node0Deg) || 125.0445) + ((moonData && moonData.nodeRateDegPerDay) || -0.05295392) * dDays;
            const node = nodeDeg * rad;
            const u = angleRad - node;
            const distKm = 384400;
            const xEcl = distKm * (Math.cos(node) * Math.cos(u) - Math.sin(node) * Math.sin(u) * Math.cos(inc));
            const yEcl = distKm * (Math.sin(node) * Math.cos(u) + Math.cos(node) * Math.sin(u) * Math.cos(inc));
            const zEcl = distKm * (Math.sin(u) * Math.sin(inc));
            return { x: xEcl, y: yEcl, z: zEcl };
        }

        function getObserverGeocentricVector3D(dDays) {
            const eps = 23.4392911 * (Math.PI / 180);
            const phi = currentCity.lat * (Math.PI / 180);
            const gmstDeg = (280.46061837 + 360.98564736629 * dDays) % 360;
            const lmstRad = ((gmstDeg + currentCity.lon) % 360) * (Math.PI / 180);
            const rEarthKm = 6378;

            const eqX = rEarthKm * Math.cos(phi) * Math.cos(lmstRad);
            const eqY = rEarthKm * Math.cos(phi) * Math.sin(lmstRad);
            const eqZ = rEarthKm * Math.sin(phi);

            const xEcl = eqX;
            const yEcl = eqY * Math.cos(eps) + eqZ * Math.sin(eps);
            const zEcl = -eqY * Math.sin(eps) + eqZ * Math.cos(eps);
            return { x: xEcl, y: yEcl, z: zEcl };
        }

        function drawMoonPhase3D(ctx, cx, cy, r, dDays, T, ePos, skyBgColor) {
            const vecSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
            const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
            const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
            const len = (a) => Math.hypot(a.x, a.y, a.z);
            const norm = (a) => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l, z: a.z / l }; };

            const AU_TO_KM = 149597870.7;
            const sunGeoKm = { x: -ePos.x * AU_TO_KM, y: -ePos.y * AU_TO_KM, z: -ePos.z * AU_TO_KM };
            const moonGeoKm = getMoonGeocentricVector3D(dDays, T);
            const obsGeoKm = getObserverGeocentricVector3D(dDays);

            const viewDir = norm(vecSub(moonGeoKm, obsGeoKm));
            const toSunDir = norm(vecSub(sunGeoKm, moonGeoKm));

            let screenUp3D = { x: 0, y: 0, z: 1 };
            const upDotView = dot(screenUp3D, viewDir);
            screenUp3D = { x: screenUp3D.x - upDotView * viewDir.x, y: screenUp3D.y - upDotView * viewDir.y, z: screenUp3D.z - upDotView * viewDir.z };
            if (len(screenUp3D) < 1e-6) screenUp3D = { x: 0, y: 1, z: 0 };
            screenUp3D = norm(screenUp3D);
            const screenRight3D = norm(cross(viewDir, screenUp3D));

            const sunInDisk = {
                x: toSunDir.x - dot(toSunDir, viewDir) * viewDir.x,
                y: toSunDir.y - dot(toSunDir, viewDir) * viewDir.y,
                z: toSunDir.z - dot(toSunDir, viewDir) * viewDir.z
            };

            const cosPhase = Math.max(-1, Math.min(1, dot(toSunDir, viewDir)));
            const diskProjLen = len(sunInDisk);

            const sunCanvasX = dot(sunInDisk, screenRight3D);
            const sunCanvasY = -dot(sunInDisk, screenUp3D);

            ctx.save();
            ctx.translate(cx, cy);

            const shadowColor = skyBgColor || '#020208';
            const lightColor = '#fffdf0';

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = shadowColor;
            ctx.fill();

            if (diskProjLen < 1e-4 && cosPhase > 0.9995) {
                ctx.restore();
                return;
            }

            if (diskProjLen < 1e-4 && cosPhase < -0.9995) {
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = lightColor;
                ctx.shadowColor = '#ffffcc';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
                return;
            }

            const lightAngle = Math.atan2(sunCanvasY, sunCanvasX);
            ctx.rotate(lightAngle);

            const litCos = Math.max(-1, Math.min(1, -cosPhase));
            const terminatorXFactor = -litCos;

            const steps = 64;
            ctx.beginPath();
            ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
            for (let i = steps; i >= 0; i--) {
                const theta = -Math.PI / 2 + (Math.PI * i) / steps;
                const y = r * Math.sin(theta);
                const maxX = r * Math.cos(theta);
                const x = terminatorXFactor * maxX;
                ctx.lineTo(x, y);
            }
            ctx.closePath();

            ctx.fillStyle = lightColor;
            ctx.shadowColor = '#ffffcc';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
        }

        // ==========================================
        // 4.5 背景薄雲・雨・雪の描画処理
        // ==========================================
        let cloudAnimTime = 0;
        function drawBackgroundClouds(ctx, w, horizonY, zenithY, sunAlt, weatherOpacity) {
            if (!showWeather || weatherOpacity <= 0 || currentWeather.cloudCover <= 3) return;

            // 雲量は最大でも透明度 0.28。未来へ進むほど現在天気の確度に合わせて薄くする
            const maxAlpha = Math.min(0.28, (currentWeather.cloudCover / 100) * 0.32) * weatherOpacity;
            const skyH = Math.max(100, horizonY - zenithY);
            const t = cloudAnimTime * 0.00008;

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, zenithY, w, horizonY - zenithY);
            ctx.clip();

            // 昼夜に応じた雲の色調
            const cloudColor = sunAlt > 0
                ? 'rgba(255, 255, 255,'
                : (sunAlt > -6 ? 'rgba(220, 190, 210,' : 'rgba(160, 185, 225,');

            // 5層のソフトな大円形雲塊を漂わせる
            const cloudBlobs = [
                { fx: 0.18, fy: 0.35, rx: w * 0.42, ry: skyH * 0.28, speed: 1.0 },
                { fx: 0.55, fy: 0.45, rx: w * 0.48, ry: skyH * 0.32, speed: 0.75 },
                { fx: 0.88, fy: 0.30, rx: w * 0.38, ry: skyH * 0.26, speed: 1.2 },
                { fx: 0.32, fy: 0.65, rx: w * 0.52, ry: skyH * 0.35, speed: 0.6 },
                { fx: 0.76, fy: 0.70, rx: w * 0.45, ry: skyH * 0.30, speed: 0.9 }
            ];

            cloudBlobs.forEach((b, i) => {
                const shiftX = ((b.fx + t * b.speed) % 1.4) - 0.2;
                const cx = shiftX * w;
                const cy = zenithY + b.fy * skyH;

                const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(b.rx, b.ry));
                grad.addColorStop(0, `${cloudColor} ${maxAlpha.toFixed(3)})`);
                grad.addColorStop(0.5, `${cloudColor} ${(maxAlpha * 0.5).toFixed(3)})`);
                grad.addColorStop(1, `${cloudColor} 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(cx, cy, b.rx, b.ry, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function drawPrecipitation(ctx, w, horizonY, zenithY, weatherOpacity) {
            if (!showWeather || weatherOpacity <= 0) return;
            const isRaining = currentWeather.isRaining;
            const isSnowing = currentWeather.isSnowing;
            if (!isRaining && !isSnowing) return;

            const skyH = Math.max(100, horizonY - zenithY);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, zenithY, w, horizonY - zenithY);
            ctx.clip();

            ctx.globalAlpha = weatherOpacity;
            if (isRaining) {
                ctx.strokeStyle = 'rgba(20, 20, 255, 0.62)';
                ctx.lineWidth = 2.0;
                rainParticles.forEach(p => {
                    p.y += p.speed;
                    p.x += p.speed * 0.22; // 斜めに降る
                    if (p.y > 1) { p.y = 0; p.x = Math.random(); }
                    if (p.x > 1) { p.x = 0; }

                    const px = p.x * w;
                    const py = zenithY + p.y * skyH;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + p.len * 0.22, py + p.len);
                    ctx.stroke();
                });
            } else if (isSnowing) {
                snowParticles.forEach(p => {
                    p.y += p.speedY;
                    p.swing += p.swingSpeed;
                    if (p.y > 1) { p.y = 0; p.x = Math.random(); }

                    const px = (p.x + Math.sin(p.swing) * 0.02) * w;
                    const py = zenithY + p.y * skyH;
                    ctx.beginPath();
                    ctx.arc(px, py, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(240, 250, 255, 0.65)';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                    ctx.shadowBlur = 3;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            ctx.restore();
        }
