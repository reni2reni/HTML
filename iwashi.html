<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イワシの群れシミュレーション (Boids)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #011627;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="info">鰯の数: <span id="count">0</span><br>画面クリックで集まります</div>
    <canvas id="simulationCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const countEl = document.getElementById('count');

        // 画面サイズに合わせる
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // シミュレーション設定パラメータ
        const CONFIG = {
            numSardines: 500,     // 鰯の数
            maxSpeed: 3,          // 最高速度
            maxForce: 0.1,        // 方向転換の最大力
            perceptionRadius: 50, // 周囲を認識する半径
            separationDist: 20,   // 他の魚と離れたい距離
            weights: {
                separation: 1.5,  // 衝突回避の強さ
                alignment: 1.0,   // 同調の強さ
                cohesion: 1.0,    // 結合の強さ
                mouse: 1.0        // マウスに集まる強さ
            }
        };

        countEl.textContent = CONFIG.numSardines;

        // マウス位置の記録
        let mouse = { x: null, y: null, active: false };
        window.addEventListener('mousedown', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
        window.addEventListener('mousemove', (e) => { if (mouse.active) { mouse.x = e.clientX; mouse.y = e.clientY; } });
        window.addEventListener('mouseup', () => { mouse.active = false; });
        window.addEventListener('touchstart', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; });
        window.addEventListener('touchmove', (e) => { if (mouse.active) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
        window.addEventListener('touchend', () => { mouse.active = false; });

        // 2次元ベクトルの簡易クラス
        class Vector2D {
            constructor(x = 0, y = 0) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() { let m = this.mag(); if (m !== 0) this.div(m); return this; }
            setMag(n) { return this.normalize().mult(n); }
            limit(max) { if (this.mag() > max) this.setMag(max); return this; }
            static dist(v1, v2) { return Math.sqrt((v1.x - v2.x) ** 2 + (v1.y - v2.y) ** 2); }
        }

        // 鰯（個体）のクラス
        class Sardine {
            constructor(x, y) {
                this.position = new Vector2D(x, y);
                // ランダムな初期速度
                let angle = Math.random() * Math.PI * 2;
                this.velocity = new Vector2D(Math.cos(angle), Math.sin(angle)).mult(Math.random() * 2 + 1);
                this.acceleration = new Vector2D(0, 0);
            }

            // 壁のすり抜け処理
            edges() {
                if (this.position.x < 0) this.position.x = canvas.width;
                if (this.position.x > canvas.width) this.position.x = 0;
                if (this.position.y < 0) this.position.y = canvas.height;
                if (this.position.y > canvas.height) this.position.y = 0;
            }

            // 位置の更新
            update() {
                this.position.add(this.velocity);
                this.velocity.add(this.acceleration).limit(CONFIG.maxSpeed);
                this.acceleration.mult(0); // 加速度のリセット
            }

            // 力を加える
            applyForce(force) {
                this.acceleration.add(force);
            }

            // 群れの3原則に基づく計算
            flock(sardines) {
                let sep = this.separate(sardines).mult(CONFIG.weights.separation);
                let ali = this.align(sardines).mult(CONFIG.weights.alignment);
                let coh = this.cohere(sardines).mult(CONFIG.weights.cohesion);

                this.applyForce(sep);
                this.applyForce(ali);
                this.applyForce(coh);

                if (mouse.active) {
                    let target = new Vector2D(mouse.x, mouse.y);
                    let mouseForce = this.seek(target).mult(CONFIG.weights.mouse);
                    this.applyForce(mouseForce);
                }
            }

            // ターゲットに向かう力を計算
            seek(target) {
                let desired = new Vector2D().add(target).sub(this.position).setMag(CONFIG.maxSpeed);
                return desired.sub(this.velocity).limit(CONFIG.maxForce);
            }

            // 1. 分離 (Separation): 近すぎる仲間から離れる
            separate(sardines) {
                let steer = new Vector2D();
                let count = 0;
                for (let other of sardines) {
                    let d = Vector2D.dist(this.position, other.position);
                    if ((other !== this) && (d < CONFIG.separationDist)) {
                        let diff = new Vector2D().add(this.position).sub(other.position).normalize().div(d); // 近いほど強く離れる
                        steer.add(diff);
                        count++;
                    }
                }
                if (count > 0) steer.div(count);
                if (steer.mag() > 0) steer.setMag(CONFIG.maxSpeed).sub(this.velocity).limit(CONFIG.maxForce);
                return steer;
            }

            // 2. 整列 (Alignment): 周囲の仲間と同じ方向・速度に合わせる
            align(sardines) {
                let sum = new Vector2D();
                let count = 0;
                for (let other of sardines) {
                    let d = Vector2D.dist(this.position, other.position);
                    if ((other !== this) && (d < CONFIG.perceptionRadius)) {
                        sum.add(other.velocity);
                        count++;
                    }
                }
                if (count > 0) {
                    sum.div(count).setMag(CONFIG.maxSpeed);
                    return sum.sub(this.velocity).limit(CONFIG.maxForce);
                }
                return new Vector2D();
            }

            // 3. 結合 (Cohesion): 周囲の仲間の中心に向かって泳ぐ
            cohere(sardines) {
                let sum = new Vector2D();
                let count = 0;
                for (let other of sardines) {
                    let d = Vector2D.dist(this.position, other.position);
                    if ((other !== this) && (d < CONFIG.perceptionRadius)) {
                        sum.add(other.position);
                        count++;
                    }
                }
                if (count > 0) {
                    sum.div(count);
                    return this.seek(sum);
                }
                return new Vector2D();
            }

            // 描画
            draw() {
                let theta = Math.atan2(this.velocity.y, this.velocity.x) + Math.PI / 2;
                ctx.save();
                ctx.translate(this.position.x, this.position.y);
                ctx.rotate(theta);

                // 鰯の体をグラデーションで描画
                ctx.beginPath();
                ctx.moveTo(0, -10);  // 頭
                ctx.lineTo(4, 2);    // 胴体右
                ctx.lineTo(1, 10);   // 尾鰭
                ctx.lineTo(-1, 10);  // 尾鰭
                ctx.lineTo(-4, 2);   // 胴体左
                ctx.closePath();

                // 水族館の照明が反射するような青銀色
                ctx.fillStyle = 'rgba(160, 210, 255, 0.8)';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#00f0ff';
                ctx.fill();
                ctx.restore();
            }
        }

        // イワシの配列初期化
        const flock = [];
        for (let i = 0; i < CONFIG.numSardines; i++) {
            flock.push(new Sardine(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // アニメーションループ
        function animate() {
            // 薄い黒を重ねることで移動軌跡（残像）を残し、滑らかに見せる
            ctx.fillStyle = 'rgba(1, 22, 39, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let sardine of flock) {
                sardine.flock(flock);
                sardine.update();
                sardine.edges();
                sardine.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
