<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS FM vs PSG ジュークボックス</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0b0b0e;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #14141f;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 440px;
            text-align: center;
            border: 1px solid #252538;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00ffcc, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
        }

        /* 音源切り替えスイッチのスタイル */
        .engine-selector {
            display: flex;
            background: #1d1d2b;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #2d2d3f;
        }

        .engine-btn {
            flex: 1;
            background: transparent;
            color: #888;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .engine-btn.active {
            background: #00ffcc;
            color: #0b0b0e;
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.2);
        }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .genre-btn {
            background: #1d1d2b;
            color: #aaa;
            border: 2px solid #2d2d3f;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 15px;
        }

        .genre-btn.active {
            background: #ff007f;
            color: white;
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .play-btn {
            background: #00ffcc;
            color: #0b0b0e;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .play-btn.playing {
            background: #e10053;
            color: white;
            box-shadow: 0 0 20px rgba(225, 0, 83, 0.4);
        }

        .desc-box {
            background: #191926;
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            text-align: left;
            color: #ccc;
            line-height: 1.6;
            min-height: 85px;
            border-left: 4px solid #00ffcc;
        }
    </style>
</head>

            // 制御変数（これまでのコードに追加してください）
            let audioCtx = null;
            let isPlaying = false;
            let timerId = null;
            let currentStep = 0;
            let currentGenre = 'synthwave';
            let soundEngine = 'FM';
            let nextNoteTime = 0.0;

            function selectGenre(genreKey) {
                // 1. ジャンルを切り替え
                currentGenre = genreKey;
                currentStep = 0; // 曲の最初からにする

                // 2. 詳細欄の更新（HTMLに id="description" がある前提）
                const descElement = document.getElementById('description');
                if (descElement && genres[genreKey]) {
                    descElement.innerText = genres[genreKey].desc;
                }

                // 3. ボタンの見た目を更新（activeクラスの付け替え）
                document.querySelectorAll('.genre-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.getAttribute('onclick').includes(genreKey)) {
                        btn.classList.add('active');
                    }
                });

                // 4. 再生中ならその場で次の曲へ反映される
                console.log("Selected: " + genreKey);
            }
            // 単音発音処理 (FM / PSG ハイブリッド)
            function playNote(inst, note, startTime) {
                if (!note) return;
                const freq = mtof(note);

                const mainGain = audioCtx.createGain();

                if (soundEngine === 'FM') {
                    // --- FM音源方式（2オペレータによる複雑な倍音合成） ---
                    const carrier = audioCtx.createOscillator();
                    const modulator = audioCtx.createOscillator();
                    const modGain = audioCtx.createGain();

                    carrier.frequency.setValueAtTime(freq, startTime);
                    modulator.frequency.setValueAtTime(freq * inst.ratio, startTime);

                    modGain.gain.setValueAtTime(inst.modS, startTime);
                    modGain.gain.linearRampToValueAtTime(inst.modE, startTime + inst.att);
                    modGain.gain.exponentialRampToValueAtTime(0.001, startTime + inst.att + inst.dec);

                    modulator.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);

                    modulator.start(startTime);
                    carrier.start(startTime);
                    modulator.stop(startTime + inst.att + inst.dec);
                    carrier.stop(startTime + inst.att + inst.dec);
                } else {
                    // --- PSG音源方式（矩形波によるレトロ・チープ合成） ---
                    const psgOsc = audioCtx.createOscillator();
                    psgOsc.type = 'square'; // レトロゲーム定番の矩形波
                    psgOsc.frequency.setValueAtTime(freq, startTime);

                    psgOsc.connect(mainGain);
                    psgOsc.start(startTime);
                    psgOsc.stop(startTime + inst.att + inst.dec);
                }

                // 全体音量エンベロープ（PSG/FM共通）
                mainGain.gain.setValueAtTime(0, startTime);
                mainGain.gain.linearRampToValueAtTime(inst.vol, startTime + inst.att);
                mainGain.gain.exponentialRampToValueAtTime(0.001, startTime + inst.att + inst.dec);
                mainGain.connect(audioCtx.destination);
            }

            // 先読みタイマー
            function scheduler() {
                const currentGenreData = genres[currentGenre];
                if (!currentGenreData) return; // データがない場合は中断

                const stepTime = 60 / currentGenreData.bpm / 4;
                const scheduleAheadTime = 0.1;

                // ここでカンマ区切りのデータを取得
                const leadScore = currentGenreData.raw.lead.split(",").map(Number);
                const bassScore = currentGenreData.raw.bass.split(",").map(Number);
                const padScore = currentGenreData.raw.pad.split(",").map(Number);

                while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                    const insts = currentGenreData.insts;

                    // 【修正】もしデータがそのステップになくても無視するようにする
                    if (leadScore[currentStep]) playNote(insts.lead, leadScore[currentStep], nextNoteTime);
                    if (bassScore[currentStep]) playNote(insts.bass, bassScore[currentStep], nextNoteTime);
                    if (padScore[currentStep]) playNote(insts.pad, padScore[currentStep], nextNoteTime);

                    nextNoteTime += stepTime;

                    // 【修正】配列の長さを動的に判定してループさせる
                    const maxLen = Math.max(leadScore.length, bassScore.length, padScore.length);
                    currentStep = (currentStep + 1) % maxLen;
                }
                timerId = setTimeout(scheduler, 25);
            }

        function updateUI() {
            document.getElementById('descBox').innerHTML = genres[currentGenre].desc;
        }

        // 音源モードの切り替え処理（演奏中もリアルタイムに変わります）
        function setEngine(mode) {
            soundEngine = mode;
            document.getElementById('fmBtn').classList.toggle('active', mode === 'FM');
            document.getElementById('psgBtn').classList.toggle('active', mode === 'PSG');
        }

        function selectGenre(genreType) {
            currentGenre = genreType;
            currentStep = 0; // ループを頭に戻す

            if (audioCtx) {
                nextNoteTime = audioCtx.currentTime + 0.02;
            }

            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateUI();
        }

        playBtn.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (isPlaying) {
                clearTimeout(timerId);
                playBtn.textContent = "▶ 演奏スタート";
                playBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                currentStep = 0;
                nextNoteTime = audioCtx.currentTime + 0.05;
                scheduler();
                playBtn.textContent = "■ 演奏ストップ";
                playBtn.classList.add('playing');
                isPlaying = true;
            }
        });

        updateUI();
    </script>

</body>

</html>
