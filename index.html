<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML App Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #334155;
  }
  h1 { font-size: 1.5rem; font-weight: 600; color: #38bdf8; }
  button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  button:hover { background: #334155; border-color: #38bdf8; }
  #status { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 20px; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
  .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
  .card-file { font-size: 0.8rem; color: #94a3b8; font-family: monospace; }
  .badge { margin-top: 14px; font-size: 0.75rem; color: #38bdf8; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>HTML APP LAUNCHER</h1>
    <button id="reloadBtn">再読み込み</button>
  </header>
  <div id="status">HTMLファイルを読み込み中...</div>
  <div id="grid" class="grid"></div>
</div>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');

async function fetchPageTitle(url, fallbackName) {
  try {
    const res = await fetch(url);
    if (!res.ok) return fallbackName;
    const text = await res.text();
    const match = text.match(/<title[^>]*>([^<]+)<\/title>/i);
    return match ? match[1].trim() : fallbackName;
  } catch {
    return fallbackName;
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

async function loadFromSitemap() {
  grid.innerHTML = '';
  statusEl.textContent = 'ファイル一覧を読み込み中...';

  try {
    // 同じサーバー内の sitemap.xml を取得（外部APIを使わないためブロックされない）
    const basePath = location.pathname.replace(/\/[^\/]*$/, '/');
    const res = await fetch(basePath + 'sitemap.xml?t=' + Date.now());
    if (!res.ok) throw new Error('sitemap.xml がまだ生成されていません（_config.yml追加後1〜2分お待ちください）');

    const xmlText = await res.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
    const locs = Array.from(xmlDoc.querySelectorAll('loc')).map(el => el.textContent.trim());

    const currentUrl = location.origin + location.pathname;
    const htmlUrls = locs.filter(url =>
      /\.html?$/i.test(url) &&
      url !== currentUrl &&
      !url.endsWith('/index.html')
    );

    if (htmlUrls.length === 0) {
      statusEl.textContent = '表示できる他のHTMLファイルが見つかりませんでした。';
      return;
    }

    statusEl.textContent = `${htmlUrls.length} 件のHTMLアプリが見つかりました`;

    for (const url of htmlUrls) {
      const fileName = decodeURIComponent(url.split('/').pop());
      const title = await fetchPageTitle(url, fileName);

      const card = document.createElement('a');
      card.className = 'card';
      card.href = url;
      card.target = '_blank';
      card.innerHTML = `
        <div>
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="card-file">${escapeHtml(fileName)}</div>
        </div>
        <div class="badge">クリックして起動 →</div>
      `;
      grid.appendChild(card);
    }
  } catch (err) {
    statusEl.textContent = err.message;
  }
}

document.getElementById('reloadBtn').addEventListener('click', loadFromSitemap);
loadFromSitemap();
</script>
</body>
</html>
