<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML App Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #38bdf8;
        }

        .repo-info {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
            font-family: monospace;
        }

        button {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #334155;
            border-color: #38bdf8;
        }

        #status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
            word-break: break-all;
        }

        .card-file {
            font-size: 0.8rem;
            color: #94a3b8;
            font-family: monospace;
        }

        .badge {
            display: inline-block;
            margin-top: 14px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 500;
        }

        .error-box {
            background: #1e293b;
            border: 1px solid #f43f5e;
            border-radius: 12px;
            padding: 20px;
            color: #fecdd3;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>HTML APP LAUNCHER</h1>
                <div class="repo-info" id="repoInfo"></div>
            </div>
            <button id="reloadBtn">再読み込み</button>
        </header>

        <div id="status">GitHubリポジトリ内のHTMLファイルを検索中...</div>
        <div id="grid" class="grid"></div>
        <div id="errorBox" class="error-box"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const statusEl = document.getElementById('status');
        const repoInfoEl = document.getElementById('repoInfo');
        const errorBox = document.getElementById('errorBox');

        // URL（〇〇.github.io/リポジトリ名/サブフォルダ/）からユーザー名・リポジトリ名・階層を自動判別
        function detectGitHubInfo() {
            const host = location.hostname; // 例: username.github.io
            const pathParts = location.pathname.split('/').filter(p => p.length > 0);

            // 末尾が .html で終わっている場合はファイル名を除外
            if (pathParts.length > 0 && /\.html?$/i.test(pathParts[pathParts.length - 1])) {
                pathParts.pop();
            }

            const user = host.replace('.github.io', '');
            // ユーザーページ(username.github.io直下)かプロジェクトページ(username.github.io/repo)かを判定
            const repo = pathParts.length > 0 ? pathParts : `${user}.github.io`;
            const subPath = pathParts.length > 1 ? pathParts.slice(1).join('/') : '';

            return { user, repo, subPath };
        }

        // 各HTMLファイルの中身から <title> タグを読み取る
        async function fetchPageTitle(url, fallbackName) {
            try {
                const res = await fetch(url);
                if (!res.ok) return fallbackName;
                const text = await res.text();
                const match = text.match(/<title[^>]*>([^<]+)<\/title>/i);
                return match ? match.trim() : fallbackName;
            } catch {
                return fallbackName;
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        async function loadGitHubFiles() {
            grid.innerHTML = '';
            errorBox.style.display = 'none';
            statusEl.textContent = 'GitHubリポジトリ内のHTMLファイルを検索中...';

            const { user, repo, subPath } = detectGitHubInfo();
            repoInfoEl.textContent = `${user} / ${repo}${subPath ? ' / ' + subPath : ''}`;

            try {
                // GitHub Contents API を叩いてファイル一覧を取得（認証不要・パブリックリポジトリ対応）
                const apiUrl = `https://github.com{user}/${repo}/contents/${subPath}`;
                const res = await fetch(apiUrl);

                if (!res.ok) {
                    throw new Error(`GitHub API エラー (HTTP ${res.status}): プライベートリポジトリの場合は一覧取得が制限されます。`);
                }

                const items = await res.json();
                const currentFile = decodeURIComponent(location.pathname.split('/').pop()) || 'index.html';

                // 同じフォルダ内の .html / .htm ファイルのみ抽出（自分自身とindex.htmlは除外）
                const htmlFiles = items.filter(item =>
                    item.type === 'file' &&
                    /\.(html|htm)$/i.test(item.name) &&
                    item.name !== currentFile &&
                    item.name.toLowerCase() !== 'index.html'
                );

                if (htmlFiles.length === 0) {
                    statusEl.textContent = 'このフォルダ内に他のHTMLファイルが見つかりませんでした。';
                    return;
                }

                statusEl.textContent = `${htmlFiles.length} 件のHTMLアプリが見つかりました`;

                for (const file of htmlFiles) {
                    const title = await fetchPageTitle(file.name, file.name);

                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = encodeURI(file.name);
                    card.target = '_blank';
                    card.innerHTML = `
        <div>
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="card-file">${escapeHtml(file.name)}</div>
        </div>
        <div class="badge">クリックして起動 →</div>
      `;
                    grid.appendChild(card);
                }
            } catch (err) {
                statusEl.textContent = '一覧の取得に失敗しました。';
                errorBox.style.display = 'block';
                errorBox.innerHTML = `
      <strong>取得エラー:</strong> ${escapeHtml(err.message)}<br>
      ※ GitHub Pagesに反映されるまで数分かかる場合があります。また、リポジトリが「Public（公開）」になっているか確認してください。
    `;
            }
        }

        document.getElementById('reloadBtn').addEventListener('click', loadGitHubFiles);
        loadGitHubFiles();
    </script>
</body>

</html>
