<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超リアル陰毛ジェネレーター Pro Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* コントロールパネル */
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(30, 30, 30, 0.95);
            color: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            max-width: 98vw;
            width: max-content;
        }

        .controls select,
        .controls input[type="text"] {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #555;
        }

        .controls-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .control-column {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 3px;
            min-width: 135px;
        }

        /* 縦置き（サイドパネル）時の2列レイアウト構成 */
        .controls.side-panel {
            width: max-content !important;
            max-width: calc(100vw - 20px) !important;
            padding: 8px 10px;
        }

        .controls.side-panel .controls-row {
            display: flex;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 12px;
        }

        /* 左列：ボタン・セッティング操作系 */
        .controls.side-panel .panel-left-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 175px;
        }

        /* 右列：各種スライダー系 */
        .controls.side-panel .panel-right-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 185px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            font-size: 11px;
            color: #eee;
            white-space: nowrap;
        }

        .control-group label {
            min-width: 52px;
        }

        .control-group input[type="range"] {
            width: 80px;
        }

        .control-group span.val {
            min-width: 22px;
            font-weight: bold;
            text-align: right;
            display: inline-block;
        }

        /* カラーニュアンス */
        .c-r {
            color: #e74c3c;
            font-weight: bold;
        }

        .c-g {
            color: #2ecc71;
            font-weight: bold;
        }

        .c-b {
            color: #3d47dd;
            font-weight: bold;
        }

        .color-row {
            justify-content: flex-start !important;
        }

        .color-row input[type="color"] {
            width: 40px;
            height: 24px;
            padding: 1px;
        }

        .draw-color-row {
            gap: 5px !important;
        }

        .draw-color-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid #777;
            border-radius: 4px;
            background: #111111;
            flex: 0 0 auto;
        }

        .draw-color-hex {
            font: 10px monospace;
            min-width: 50px;
            color: #eee;
        }

        .eraser-column {
            min-width: 100%;
        }

        #eraserToggleBtn {
            background: #777;
            white-space: nowrap;
            width: 100%;
        }

        #eraserToggleBtn.active {
            background: #c0392b;
        }

        #eraserCursor {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, .95);
            outline: 1px solid rgba(0, 0, 0, .85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
        }

        #movePanelBtn {
            background: #6c5ce7;
            white-space: nowrap;
        }

        #movePanelBtn:hover {
            background: #5848c8;
        }

        #darkModeBtn {
            background: #34495e;
            white-space: nowrap;
        }

        #darkModeBtn:hover {
            background: #2c3e50;
        }

        .preset-column {
            width: 100%;
        }

        .preset-column>label {
            font-size: 12px;
            font-weight: bold;
            color: #eee;
        }

        .preset-select,
        .preset-name-input {
            width: 100%;
            min-width: 0;
            font-size: 11px;
        }

        .action-column {
            width: 100%;
        }

        .action-column button,
        .action-column .file-select-btn {
            width: 100%;
            font-size: 11px;
            padding: 4px;
            text-align: center;
        }

        #drop-area {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #drop-area.highlight {
            background-color: #2b3a4a;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            cursor: crosshair;
            display: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .instructions-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1;
        }

        .instructions {
            color: #ccc;
            font-size: 18px;
            border: 3px dashed #555;
            padding: 40px;
            border-radius: 12px;
            background: rgba(26, 26, 26, 0.8);
            margin-bottom: 15px;
            pointer-events: none;
        }

        button,
        .file-select-btn {
            background: #4dadf7;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        button:hover,
        .file-select-btn:hover {
            background: #3b95db;
        }

        #clearBtn {
            background: #ff6b6b;
        }

        #clearBtn:hover {
            background: #fa5252;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>

    <div class="controls dark-mode" id="controlsPanel">
        <div class="controls-row" id="controlsRow">

            <!-- 左ブロック（ボタン・ファイル・消しゴム・プリセット等） -->
            <div class="panel-left-col">
                <div class="control-column">
                    <label class="file-select-btn" for="fileInput">画像読み込み</label>
                    <div class="control-group color-row">
                        <label for="colorPicker">基調色</label>
                        <input type="color" id="colorPicker" value="#111111" title="クリックして基調色を選択">
                    </div>
                    <div class="control-group color-row draw-color-row">
                        <label>描画色</label>
                        <span id="drawColorPreview" class="draw-color-preview"></span>
                        <span id="drawColorHex" class="draw-color-hex">#111111</span>
                    </div>
                </div>

                <div class="control-column eraser-column">
                    <button id="eraserToggleBtn" type="button" aria-pressed="false">消しゴム：OFF</button>
                    <div class="control-group"><label for="eraserSize">大きさ</label><input type="range" id="eraserSize"
                            min="2" max="160" value="30"><span class="val" id="eraserSizeVal">30</span></div>
                    <div class="control-group"><label for="eraserBlur">ぼかし</label><input type="range" id="eraserBlur"
                            min="0" max="100" value="20"><span class="val" id="eraserBlurVal">20</span></div>
                </div>

                <div class="control-column preset-column">
                    <label for="presetSelect">セッティング</label>
                    <select id="presetSelect" class="preset-select">
                        <option value="1">1: 陰毛</option>
                        <option value="2">2: 脇毛</option>
                        <option value="3">3: 髪の毛</option>
                        <option value="4">4: スロット 4 (空き)</option>
                        <option value="5">5: スロット 5 (空き)</option>
                    </select>
                    <input type="text" id="presetNameInput" class="preset-name-input" placeholder="名称">
                    <div style="display:flex; gap:4px; width:100%; margin-top:2px;">
                        <button id="savePresetBtn" class="btn-save"
                            style="flex:1; min-width:0; font-size:10px; padding:3px; white-space:nowrap; background:#2ecc71;">保存</button>
                        <button id="deletePresetBtn" type="button"
                            style="flex:1; min-width:0; background:#c0392b; color:white; font-size:10px; padding:3px; white-space:nowrap;">削除</button>
                    </div>
                </div>

                <div class="control-column action-column" style="gap:3px;">
                    <button id="clearBtn">リセット</button>
                    <button id="downloadBtn" style="background:#e67e22">JPG合成保存</button>
                    <button id="downloadBgBtn" style="background:#d35400">背景保存(PNG)</button>
                    <button id="downloadHairBtn" style="background:#2980b9">毛レイヤー(PNG)</button>
                    <button id="movePanelBtn" type="button">表示位置：右</button>
                    <button id="darkModeBtn" type="button">ダーク：ON</button>
                </div>
            </div>

            <!-- 右ブロック（スライダー系全般） -->
            <div class="panel-right-col">
                <div class="control-group"><label for="colorRed" class="c-r">赤</label><input type="range" id="colorRed"
                        min="0" max="100" value="0"><span class="val" id="redVal">0</span></div>
                <div class="control-group"><label for="colorGreen" class="c-g">緑</label><input type="range"
                        id="colorGreen" min="0" max="100" value="0"><span class="val" id="greenVal">0</span></div>
                <div class="control-group"><label for="colorBlue" class="c-b">青</label><input type="range"
                        id="colorBlue" min="0" max="100" value="0"><span class="val" id="blueVal">0</span></div>
                <div class="control-group"><label for="whiteHairRatio">白髪率</label><input type="range"
                        id="whiteHairRatio" min="0" max="100" value="0"><span class="val"
                        id="whiteHairRatioVal">0%</span></div>
                <div class="control-group" style="justify-content: flex-start; gap: 4px;">
                    <input type="checkbox" id="whiteHairTipOnly">
                    <label for="whiteHairTipOnly" style="min-width: auto; cursor: pointer;">先端50%</label>
                </div>
                <div class="control-group"><label for="strokeStabilizer">補正</label><input type="range"
                        id="strokeStabilizer" min="1" max="10" value="5"><span class="val"
                        id="strokeStabilizerVal">5</span></div>
                <div class="control-group"><label for="hairLength">長さ</label><input type="range" id="hairLength" min="5"
                        max="200" value="40"><span class="val" id="lengthVal">40</span></div>
                <div class="control-group"><label for="strokeSpeed">スピード</label><input type="range" id="strokeSpeed"
                        min="1" max="100" value="100"><span class="val" id="strokeSpeedVal">100</span></div>
                <div class="control-group"><label for="hairOpacity">濃さ</label><input type="range" id="hairOpacity"
                        min="0.1" max="1" step="0.1" value="0.8"><span class="val" id="opacityVal">0.8</span></div>
                <div class="control-group"><label for="hairThickness">太さ</label><input type="range" id="hairThickness"
                        min="0.1" max="2" step="0.1" value="1.5"><span class="val" id="thicknessVal">1.5</span></div>
                <div class="control-group"><label for="taperEffect">入減衰</label><input type="range" id="taperEffect"
                        min="0" max="100" value="0"><span class="val" id="taperVal">0</span></div>
                <div class="control-group"><label for="hairGlobalScale">スケール</label><input type="range"
                        id="hairGlobalScale" min="0.1" max="3.0" step="0.1" value="1.0"><span class="val"
                        id="globalScaleVal">1.0</span></div>
                <div class="control-group"><label for="hairCount">本数</label><input type="range" id="hairCount" min="1"
                        max="50" value="1"><span class="val" id="countVal">1</span></div>
                <div class="control-group"><label for="hairSpread">密集度</label><input type="range" id="hairSpread"
                        min="0" max="10" value="1"><span class="val" id="spreadVal">1</span></div>
                <div class="control-group"><label for="hairRandom">ランダム</label><input type="range" id="hairRandom"
                        min="0" max="10" value="0"><span class="val" id="randomVal">0</span></div>
                <div class="control-group" id="spreadGroup"><label for="hairSpreadAngle">広がり</label><input type="range"
                        id="hairSpreadAngle" min="1" max="180" value="1"><span class="val" id="spreadAngleVal">1°</span>
                </div>
                <div class="control-group"><label for="hairCurl">ちぢれ</label><input type="range" id="hairCurl" min="0"
                        max="30" value="0"><span class="val" id="curlVal">0</span></div>
                <div class="control-group"><label for="hairCurlAmp">ちぢれ振幅</label><input type="range" id="hairCurlAmp"
                        min="1" max="10" value="5"><span class="val" id="curlAmpVal">5</span></div>
            </div>

        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <div id="drop-area">
        <div class="instructions-container" id="instructionsContainer">
            <div class="instructions">ここに画像をドラッグ＆ドロップしてください</div>
            <label class="file-select-btn" for="fileInput"
                style="font-size: 16px; padding: 10px 20px;">パソコンからファイルを選択</label>
        </div>
        <canvas id="canvas"></canvas>
        <div id="eraserCursor" aria-hidden="true"></div>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hairCanvas = document.createElement('canvas');
        const hairCtx = hairCanvas.getContext('2d');
        const eraserToggleBtn = document.getElementById('eraserToggleBtn');
        const eraserSize = document.getElementById('eraserSize');
        const eraserBlur = document.getElementById('eraserBlur');
        const eraserCursor = document.getElementById('eraserCursor');
        let eraserMode = false;
        const instructionsContainer = document.getElementById('instructionsContainer');
        const fileInput = document.getElementById('fileInput');

        const colorPicker = document.getElementById('colorPicker');
        const drawColorPreview = document.getElementById('drawColorPreview');
        const drawColorHex = document.getElementById('drawColorHex');
        const colorRed = document.getElementById('colorRed');
        const colorGreen = document.getElementById('colorGreen');
        const colorBlue = document.getElementById('colorBlue');
        const whiteHairRatio = document.getElementById('whiteHairRatio');
        const whiteHairTipOnly = document.getElementById('whiteHairTipOnly');
        const strokeStabilizer = document.getElementById('strokeStabilizer');

        const hairLength = document.getElementById('hairLength');
        const strokeSpeed = document.getElementById('strokeSpeed');
        const hairThickness = document.getElementById('hairThickness');
        const hairOpacity = document.getElementById('hairOpacity');
        const taperEffect = document.getElementById('taperEffect');
        const hairCount = document.getElementById('hairCount');
        const hairSpread = document.getElementById('hairSpread');
        const hairRandom = document.getElementById('hairRandom');
        const hairSpreadAngle = document.getElementById('hairSpreadAngle');
        const hairCurl = document.getElementById('hairCurl');
        const hairCurlAmp = document.getElementById('hairCurlAmp');
        const hairGlobalScale = document.getElementById('hairGlobalScale');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const presetSelect = document.getElementById('presetSelect');
        const presetNameInput = document.getElementById('presetNameInput');
        const savePresetBtn = document.getElementById('savePresetBtn');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const controlsPanel = document.getElementById('controlsPanel');

        const defaultPresetNames = {
            1: "陰毛",
            2: "脇毛",
            3: "髪の毛",
            4: "スロット 4 (空き)",
            5: "スロット 5 (空き)"
        };

        const bindSlider = (slider, txtId) => {
            slider.addEventListener('input', (e) => document.getElementById(txtId).textContent = e.target.value);
        };
        bindSlider(colorRed, 'redVal');
        bindSlider(colorGreen, 'greenVal');
        bindSlider(colorBlue, 'blueVal');
        whiteHairRatio.addEventListener('input', () => { document.getElementById('whiteHairRatioVal').textContent = `${whiteHairRatio.value}%`; });
        bindSlider(strokeStabilizer, 'strokeStabilizerVal');
        bindSlider(hairLength, 'lengthVal');
        bindSlider(strokeSpeed, 'strokeSpeedVal');
        bindSlider(hairThickness, 'thicknessVal');
        bindSlider(hairOpacity, 'opacityVal');
        taperEffect.addEventListener('input', () => { document.getElementById('taperVal').textContent = taperEffect.value; });
        bindSlider(hairCount, 'countVal');
        bindSlider(hairSpread, 'spreadVal');
        bindSlider(hairRandom, 'randomVal');
        hairSpreadAngle.addEventListener('input', () => { document.getElementById('spreadAngleVal').textContent = `${hairSpreadAngle.value}°`; });
        bindSlider(hairCurl, 'curlVal');
        bindSlider(hairCurlAmp, 'curlAmpVal');
        bindSlider(hairGlobalScale, 'globalScaleVal');

        function getAdjustedDrawColor() {
            const hex = colorPicker.value;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const rr = Math.min(255, Math.max(0, r + Number(colorRed.value)));
            const gg = Math.min(255, Math.max(0, g + Number(colorGreen.value)));
            const bb = Math.min(255, Math.max(0, b + Number(colorBlue.value)));
            return '#' + [rr, gg, bb].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
        }
        function updateDrawColorPreview() {
            const color = getAdjustedDrawColor();
            drawColorPreview.style.backgroundColor = color;
            drawColorHex.textContent = color.toUpperCase();
        }
        [colorPicker, colorRed, colorGreen, colorBlue].forEach(el => {
            el.addEventListener('input', updateDrawColorPreview);
            el.addEventListener('change', updateDrawColorPreview);
        });
        updateDrawColorPreview();

        document.querySelectorAll('input[type="range"]').forEach(slider => {
            slider.addEventListener('wheel', (e) => {
                e.preventDefault();
                const min = Number(slider.min || 0);
                const max = Number(slider.max || 100);
                const step = slider.step && slider.step !== 'any' ? Number(slider.step) : 1;
                const current = Number(slider.value);
                const next = e.deltaY < 0 ? current + step : current - step;
                slider.value = String(Math.max(min, Math.min(max, Number(next.toFixed(5)))));
                slider.dispatchEvent(new Event('input', { bubbles: true }));
                slider.dispatchEvent(new Event('change', { bubbles: true }));
            }, { passive: false });
        });

        let isDarkMode = localStorage.getItem('beard_dark_mode') !== 'false';
        function applyDarkMode(enable) {
            isDarkMode = enable;
            controlsPanel.classList.toggle('dark-mode', isDarkMode);
            darkModeBtn.textContent = isDarkMode ? 'ダーク：ON' : 'ダーク：OFF';
            localStorage.setItem('beard_dark_mode', isDarkMode);
        }
        darkModeBtn.addEventListener('click', () => {
            applyDarkMode(!isDarkMode);
        });
        applyDarkMode(isDarkMode);

        const movePanelBtn = document.getElementById('movePanelBtn');
        const panelPositions = ['top', 'right', 'bottom', 'left'];
        let panelPositionIndex = parseInt(localStorage.getItem('beard_panel_pos') || "1");

        function setPanelPosition() {
            const pos = panelPositions[panelPositionIndex];
            const isSide = (pos === 'left' || pos === 'right');

            controlsPanel.style.position = 'fixed';
            controlsPanel.style.transform = 'none';
            controlsPanel.style.margin = '0';
            controlsPanel.style.maxHeight = 'none';
            controlsPanel.style.overflow = 'visible';

            controlsPanel.style.left = pos === 'left' ? '10px' : (pos === 'right' ? 'auto' : '10px');
            controlsPanel.style.right = pos === 'right' ? '10px' : 'auto';
            controlsPanel.style.top = pos === 'top' ? '10px' : (pos === 'bottom' ? 'auto' : '10px');
            controlsPanel.style.bottom = pos === 'bottom' ? '10px' : 'auto';

            controlsPanel.classList.toggle('side-panel', isSide);
            movePanelBtn.textContent = '表示位置：' + ({ top: '上', right: '右', bottom: '下', left: '左' }[pos]);
        }

        setPanelPosition();

        movePanelBtn.addEventListener('click', () => {
            panelPositionIndex = (panelPositionIndex + 1) % panelPositions.length;
            localStorage.setItem('beard_panel_pos', panelPositionIndex);
            setPanelPosition();
        });

        const state = {
            img: new Image(),
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            isDrawing: false,
            isPanning: false,
            startX: 0, startY: 0,
            lastCanvasX: 0, lastCanvasY: 0,
            strokeCount: 0,
            undoStack: [],
            redoStack: []
        };

        state.img.onload = function () {
            instructionsContainer.style.display = 'none';
            canvas.style.display = 'block';

            canvas.width = state.img.width;
            canvas.height = state.img.height;
            hairCanvas.width = state.img.width;
            hairCanvas.height = state.img.height;
            hairCtx.clearRect(0, 0, hairCanvas.width, hairCanvas.height);

            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const scaleW = winW / canvas.width;
            const scaleH = winH / canvas.height;
            state.scale = Math.min(scaleW, scaleH, 1) * 0.85;

            state.offsetX = (winW - (canvas.width * state.scale)) / 2;
            state.offsetY = (winH - (canvas.height * state.scale)) / 2;

            state.undoStack = [];
            state.redoStack = [];
            saveHistory();
            redraw();
        };

        const blankCanvas = document.createElement('canvas');
        blankCanvas.width = 1200;
        blankCanvas.height = 800;
        const blankCtx = blankCanvas.getContext('2d');
        blankCtx.fillStyle = '#e8b89b';
        blankCtx.fillRect(0, 0, blankCanvas.width, blankCanvas.height);
        instructionsContainer.style.display = 'none';
        state.img.src = blankCanvas.toDataURL('image/png');

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px) scale(${state.scale})`;
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (state.img.src) {
                ctx.drawImage(state.img, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(hairCanvas, 0, 0);
            }
            updateCanvasTransform();
        }

        function getCanvasCoordinates(e) {
            const rect = dropArea.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            return [(mouseX - state.offsetX) / state.scale, (mouseY - state.offsetY) / state.scale];
        }

        function loadFile(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = () => { state.img.src = reader.result; };
                reader.readAsDataURL(file);
            }
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => dropArea.addEventListener(n, e => {
            e.preventDefault(); e.stopPropagation();
        }, false));
        ['dragenter', 'dragover'].forEach(n => dropArea.addEventListener(n, () => dropArea.classList.add('highlight'), false));
        ['dragleave', 'drop'].forEach(n => dropArea.addEventListener(n, () => dropArea.classList.remove('highlight'), false));
        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;

        dropArea.addEventListener('wheel', (e) => {
            if (!state.img.src) return;
            e.preventDefault();
            const rect = dropArea.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const canvasX = (mouseX - state.offsetX) / state.scale;
            const canvasY = (mouseY - state.offsetY) / state.scale;
            const zoomFactor = 1.1;
            state.scale = e.deltaY < 0 ? state.scale * zoomFactor : state.scale / zoomFactor;
            state.scale = Math.max(0.1, Math.min(15, state.scale));
            state.offsetX = mouseX - canvasX * state.scale;
            state.offsetY = mouseY - canvasY * state.scale;
            updateCanvasTransform();
        }, { passive: false });

        function saveHistory() {
            const imgData = hairCtx.getImageData(0, 0, hairCanvas.width, hairCanvas.height);
            state.undoStack.push(imgData);
            state.redoStack = [];
            if (state.undoStack.length > 50) state.undoStack.shift();
        }

        function undo() {
            if (state.undoStack.length > 1) {
                const current = state.undoStack.pop();
                state.redoStack.push(current);
                const previous = state.undoStack[state.undoStack.length - 1];
                hairCtx.putImageData(previous, 0, 0);
                redraw();
            }
        }

        function redo() {
            if (state.redoStack.length > 0) {
                const next = state.redoStack.pop();
                state.undoStack.push(next);
                hairCtx.putImageData(next, 0, 0);
                redraw();
            }
        }

            if (!state.img.src) return;
            const isCtrl = e.ctrlKey || e.metaKey;
            if (isCtrl && e.key.toLowerCase() === 'z') {

                if (e.shiftKey) redo();

            }
        });

        async function triggerEyeDropper() {

        dropArea.addEventListener('mousedown', (e) => {
            if (!state.img.src) return;
            const [canvasX, canvasY] = getCanvasCoordinates(e);

            if (e.button === 0) {
                state.isDrawing = true;
                state.hasMoved = false;
                state.strokeCount = 0;
                [state.lastCanvasX, state.lastCanvasY] = [canvasX, canvasY];
                if (eraserMode) eraseHairsAt(canvasX, canvasY);
            } else if (e.button === 2) {
                state.isPanning = true;
                state.startX = e.clientX - state.offsetX;
                state.startY = e.clientY - state.offsetY;
                state.lastClickX = e.clientX;
                state.lastClickY = e.clientY;
            }
        });

        dropArea.addEventListener('mousemove', (e) => {
            updateEraserCursor(e);
            if (state.isDrawing) {
                state.hasMoved = true;
                if (eraserMode) eraseHairsAlong(e);
                else drawAdvancedBeard(e);
            } else if (state.isPanning) {
                state.offsetX = e.clientX - state.startX;
                state.offsetY = e.clientY - state.startY;
                updateCanvasTransform();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                if (state.isDrawing) {
                    if (!state.hasMoved && !eraserMode) drawSingleHairAt(state.lastCanvasX, state.lastCanvasY);
                    state.isDrawing = false;
                    saveHistory();
                }
            } else if (e.button === 2) {
                if (state.isPanning) {
                    state.isPanning = false;
                    if (Math.hypot(e.clientX - state.lastClickX, e.clientY - state.lastClickY) < 3) triggerEyeDropper();
                }
            }
        });

        function drawAdvancedBeard(e) {
            const [rawCanvasX, rawCanvasY] = getCanvasCoordinates(e);
            const speedVal = Number(strokeSpeed.value);
            const dxLast = rawCanvasX - state.lastCanvasX;
            const dyLast = rawCanvasY - state.lastCanvasY;
            const distLast = Math.hypot(dxLast, dyLast);
            const threshold = (101 - speedVal) * 0.15;
            if (speedVal < 100 && distLast < threshold) return;

            const stabilizer = Number(strokeStabilizer.value);
            const smoothingFactor = Math.max(0.18, 1 - stabilizer * 0.075);
            const currentCanvasX = state.lastCanvasX + (rawCanvasX - state.lastCanvasX) * smoothingFactor;
            const currentCanvasY = state.lastCanvasY + (rawCanvasY - state.lastCanvasY) * smoothingFactor;
            const dx = currentCanvasX - state.lastCanvasX;
            const dy = currentCanvasY - state.lastCanvasY;

            if (Math.sqrt(dx * dx + dy * dy) < 1.0) return;

            const gScale = parseFloat(hairGlobalScale.value);
            const baseLen = parseFloat(hairLength.value) * gScale;
            const baseThick = parseFloat(hairThickness.value) * gScale;
            const baseOpacity = parseFloat(hairOpacity.value);
            const taperSetting = parseFloat(taperEffect.value); // 0〜100
            const numHairs = parseInt(hairCount.value);
            const spreadSetting = parseInt(hairSpread.value) * gScale;
            const randomSetting = parseFloat(hairRandom.value);
            const spreadAngleSetting = parseFloat(hairSpreadAngle.value);
            const curlSetting = parseFloat(hairCurl.value);
            const curlAmpSetting = parseFloat(hairCurlAmp.value);
            const whiteRatioVal = parseFloat(whiteHairRatio.value);
            const isTipOnly = whiteHairTipOnly.checked;

            const baseHex = colorPicker.value;
            const baseR = parseInt(baseHex.slice(1, 3), 16);
            const baseG = parseInt(baseHex.slice(3, 5), 16);
            const baseB = parseInt(baseHex.slice(5, 7), 16);
            const addR = parseInt(colorRed.value);
            const addG = parseInt(colorGreen.value);
            const addB = parseInt(colorBlue.value);

            state.strokeCount += 1;

            // 入減衰（taperSetting）の計算
            // 0のとき：細い状態から時間をかけて太くなり、終わり際に細くなる
            // 100のとき：最初から太く描く
            let startScale = 1.0;
            let endScaleFactor = 1.0;

            if (taperSetting < 100) {
                // 0のときは時間をかけて太く（約25ステップ）、100に近づくほど一瞬で太くなる（約1ステップ）
                const rampSteps = 1 + ((100 - taperSetting) / 100) * 24;
                const progress = Math.min(1.0, state.strokeCount / rampSteps);

                // 描き始めの細さ（0のときは0.15からスタート、100に近づくと1.0に）
                const minRatio = 0.15 + (0.85 * (taperSetting / 100));
                startScale = minRatio + (1.0 - minRatio) * progress;

                // 0のときは終わり際（またはストローク進行後半）に再度細くする効果を付与
                if (taperSetting < 50) {
                    // ストロークが長くなったときに先端を細くするフェードアウト係数
                    const tipFade = Math.max(0.3, 1.0 - (state.strokeCount / 60) * (1 - taperSetting / 50));
                    endScaleFactor = tipFade;
                }
            }

            const currentThickness = baseThick * startScale * endScaleFactor;
            const currentOpacity = baseOpacity * Math.min(1.0, startScale * 1.1);

            hairCtx.save();
            const angle = Math.atan2(dy, dx);

            for (let i = 0; i < numHairs; i++) {
                const spreadX = numHairs === 1 ? 0 : (Math.random() - 0.5) * spreadSetting;
                const spreadY = numHairs === 1 ? 0 : (Math.random() - 0.5) * spreadSetting;
                const startX = state.lastCanvasX + spreadX;
                const startY = state.lastCanvasY + spreadY;
                const actualLength = baseLen * (0.7 + Math.random() * 0.6);

                const fanAngleOffset = (Math.random() - 0.5) * spreadAngleSetting * Math.PI / 180;
                const randomAngleOffset = (Math.random() - 0.5) * (randomSetting / 50) * Math.PI * 0.5;
                const finalAngle = angle + fanAngleOffset + randomAngleOffset;
                const waveDir = Math.random() < 0.5 ? -1 : 1;

                let endX, endY;
                const points = [{ x: startX, y: startY }];

                if (curlSetting > 0) {
                    const ux = Math.cos(finalAngle);
                    const uy = Math.sin(finalAngle);
                    const nx = -uy;
                    const ny = ux;
                    const segments = Math.max(8, Math.round(curlSetting * 0.6));
                    const amplitude = (3 + curlSetting * 0.35) * gScale * waveDir * (curlAmpSetting / 5);
                    const totalPhase = (curlSetting / 10) * Math.PI;

                    for (let s = 1; s <= segments; s++) {
                        const t = s / segments;
                        const along = actualLength * t * (1 - (curlSetting / 30) * 0.15);
                        const taperAmp = (1 - t * 0.7);
                        const wave = Math.sin(t * totalPhase) * amplitude * Math.min(1, t * 2.5) * taperAmp;
                        const noise = (Math.random() - 0.5) * (randomSetting * 0.5) * gScale * taperAmp;
                        points.push({ x: startX + ux * along + nx * (wave + noise), y: startY + uy * along + ny * (wave + noise) });
                    }
                    endX = points[points.length - 1].x;
                    endY = points[points.length - 1].y;
                } else {
                    endX = startX + Math.cos(finalAngle) * actualLength;
                    endY = startY + Math.sin(finalAngle) * actualLength;
                }

                const isWhite = Math.random() * 100 < whiteRatioVal;
                const colorNoise = (Math.random() - 0.3) * 15;
                const finalR = Math.min(255, Math.max(0, baseR + addR + colorNoise));
                const finalG = Math.min(255, Math.max(0, baseG + addG + colorNoise));
                const finalB = Math.min(255, Math.max(0, baseB + addB + colorNoise));
                const baseRgbStr = `${Math.floor(finalR)}, ${Math.floor(finalG)}, ${Math.floor(finalB)}`;

                const whiteRgbVal = Math.floor(Math.min(255, 220 + (Math.random() - 0.5) * 35));
                const whiteRgbStr = `${whiteRgbVal}, ${whiteRgbVal}, ${whiteRgbVal}`;

                const gradient = hairCtx.createLinearGradient(startX, startY, endX, endY);
                if (isWhite) {
                    if (isTipOnly) {
                        gradient.addColorStop(0, `rgba(${baseRgbStr}, ${currentOpacity})`);
                        gradient.addColorStop(0.5, `rgba(${baseRgbStr}, ${currentOpacity * 0.85})`);
                        gradient.addColorStop(0.8, `rgba(${whiteRgbStr}, ${currentOpacity * 0.7})`);
                        gradient.addColorStop(1, `rgba(${whiteRgbStr}, 0)`);
                    } else {
                        gradient.addColorStop(0, `rgba(${whiteRgbStr}, ${currentOpacity})`);
                        gradient.addColorStop(0.6, `rgba(${whiteRgbStr}, ${currentOpacity * 0.7})`);
                        gradient.addColorStop(1, `rgba(${whiteRgbStr}, 0)`);
                    }
                } else {
                    gradient.addColorStop(0, `rgba(${baseRgbStr}, ${currentOpacity})`);
                    gradient.addColorStop(0.6, `rgba(${baseRgbStr}, ${currentOpacity * 0.7})`);
                    gradient.addColorStop(1, `rgba(${baseRgbStr}, 0)`);
                }

                hairCtx.beginPath();
                hairCtx.moveTo(startX, startY);

                if (curlSetting > 0) {
                    for (let p = 1; p < points.length - 1; p++) {
                        const xc = (points[p].x + points[p + 1].x) / 2;
                        const yc = (points[p].y + points[p + 1].y) / 2;
                        hairCtx.quadraticCurveTo(points[p].x, points[p].y, xc, yc);
                    }
                    hairCtx.lineTo(endX, endY);
                } else {
                    const cpFactor = 0.35;
                    const sideRandomOffset = (Math.random() - 0.5) * (randomSetting * 0.8) * gScale;
                    const sideAngle = finalAngle + (Math.random() > 0.5 ? 1 : -1) * 0.3;
                    const cpX = startX + Math.cos(sideAngle) * (actualLength * cpFactor) + Math.cos(sideAngle + Math.PI / 2) * sideRandomOffset;
                    const cpY = startY + Math.sin(sideAngle) * (actualLength * cpFactor) + Math.sin(sideAngle + Math.PI / 2) * sideRandomOffset;
                    hairCtx.quadraticCurveTo(cpX, cpY, endX, endY);
                }

                hairCtx.lineWidth = currentThickness * (0.5 + Math.random() * 0.8);
                hairCtx.lineCap = 'round';
                hairCtx.strokeStyle = gradient;
                hairCtx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                hairCtx.shadowBlur = 1;
                hairCtx.stroke();
            }

            hairCtx.restore();
            state.lastCanvasX = currentCanvasX;
            state.lastCanvasY = currentCanvasY;
            redraw();
        }

        eraserToggleBtn.addEventListener('click', () => {
            eraserMode = !eraserMode;
            eraserToggleBtn.classList.toggle('active', eraserMode);
            eraserToggleBtn.textContent = eraserMode ? '消しゴム：ON' : '消しゴム：OFF';
            eraserToggleBtn.setAttribute('aria-pressed', String(eraserMode));
            canvas.style.cursor = eraserMode ? 'none' : 'crosshair';
            if (!eraserMode) eraserCursor.style.display = 'none';
        });

        function drawSingleHairAt(x, y) {
            const gScale = parseFloat(hairGlobalScale.value);
            const baseLen = parseFloat(hairLength.value) * gScale;
            const baseThick = parseFloat(hairThickness.value) * gScale;
            const baseOpacity = parseFloat(hairOpacity.value);
            const randomSetting = parseFloat(hairRandom.value);
            const curlSetting = parseFloat(hairCurl.value);
            const curlAmpSetting = parseFloat(hairCurlAmp.value);
            const whiteRatioVal = parseFloat(whiteHairRatio.value);
            const isTipOnly = whiteHairTipOnly.checked;

            const baseHex = colorPicker.value;
            const baseR = parseInt(baseHex.slice(1, 3), 16);
            const baseG = parseInt(baseHex.slice(3, 5), 16);
            const baseB = parseInt(baseHex.slice(5, 7), 16);
            const addR = parseInt(colorRed.value);
            const addG = parseInt(colorGreen.value);
            const addB = parseInt(colorBlue.value);

            const finalAngle = Math.random() * Math.PI * 2;
            const actualLength = baseLen * (0.8 + Math.random() * 0.4);
            const waveDir = Math.random() < 0.5 ? -1 : 1;

            let endX, endY;
            const points = [{ x: x, y: y }];

            hairCtx.save();

            if (curlSetting > 0) {
                const ux = Math.cos(finalAngle);
                const uy = Math.sin(finalAngle);
                const nx = -uy;
                const ny = ux;
                const segments = Math.max(8, Math.round(curlSetting * 0.6));
                const amplitude = (3 + curlSetting * 0.35) * gScale * waveDir * (curlAmpSetting / 5);
                const totalPhase = (curlSetting / 10) * Math.PI;

                for (let s = 1; s <= segments; s++) {
                    const t = s / segments;
                    const along = actualLength * t * (1 - (curlSetting / 30) * 0.15);
                    const taperAmp = (1 - t * 0.7);
                    const wave = Math.sin(t * totalPhase) * amplitude * Math.min(1, t * 2.5) * taperAmp;
                    const noise = (Math.random() - 0.5) * (randomSetting * 0.5) * gScale * taperAmp;
                    points.push({ x: x + ux * along + nx * (wave + noise), y: y + uy * along + ny * (wave + noise) });
                }
                endX = points[points.length - 1].x;
                endY = points[points.length - 1].y;
            } else {
                endX = x + Math.cos(finalAngle) * actualLength;
                endY = y + Math.sin(finalAngle) * actualLength;
            }

            const isWhite = Math.random() * 100 < whiteRatioVal;
            const colorNoise = (Math.random() - 0.3) * 15;
            const finalR = Math.min(255, Math.max(0, baseR + addR + colorNoise));
            const finalG = Math.min(255, Math.max(0, baseG + addG + colorNoise));
            const finalB = Math.min(255, Math.max(0, baseB + addB + colorNoise));
            const baseRgbStr = `${Math.floor(finalR)}, ${Math.floor(finalG)}, ${Math.floor(finalB)}`;

            const whiteRgbVal = Math.floor(Math.min(255, 220 + (Math.random() - 0.5) * 35));
            const whiteRgbStr = `${whiteRgbVal}, ${whiteRgbVal}, ${whiteRgbVal}`;

            const gradient = hairCtx.createLinearGradient(x, y, endX, endY);
            if (isWhite) {
                if (isTipOnly) {
                    gradient.addColorStop(0, `rgba(${baseRgbStr}, ${baseOpacity})`);
                    gradient.addColorStop(0.5, `rgba(${baseRgbStr}, ${baseOpacity * 0.85})`);
                    gradient.addColorStop(0.8, `rgba(${whiteRgbStr}, ${baseOpacity * 0.7})`);
                    gradient.addColorStop(1, `rgba(${whiteRgbStr}, 0)`);
                } else {
                    gradient.addColorStop(0, `rgba(${whiteRgbStr}, ${baseOpacity})`);
                    gradient.addColorStop(0.6, `rgba(${whiteRgbStr}, ${baseOpacity * 0.7})`);
                    gradient.addColorStop(1, `rgba(${whiteRgbStr}, 0)`);
                }
            } else {
                gradient.addColorStop(0, `rgba(${baseRgbStr}, ${baseOpacity})`);
                gradient.addColorStop(0.6, `rgba(${baseRgbStr}, ${baseOpacity * 0.7})`);
                gradient.addColorStop(1, `rgba(${baseRgbStr}, 0)`);
            }

            hairCtx.beginPath();
            hairCtx.moveTo(x, y);

            if (curlSetting > 0) {
                for (let p = 1; p < points.length - 1; p++) {
                    const xc = (points[p].x + points[p + 1].x) / 2;
                    const yc = (points[p].y + points[p + 1].y) / 2;
                    hairCtx.quadraticCurveTo(points[p].x, points[p].y, xc, yc);
                }
                hairCtx.lineTo(endX, endY);
            } else {
                const cpFactor = 0.35;
                const sideRandomOffset = (Math.random() - 0.5) * (randomSetting * 0.8) * gScale;
                const sideAngle = finalAngle + (Math.random() > 0.5 ? 1 : -1) * 0.3;
                const cpX = x + Math.cos(sideAngle) * (actualLength * cpFactor) + Math.cos(sideAngle + Math.PI / 2) * sideRandomOffset;
                const cpY = y + Math.sin(sideAngle) * (actualLength * cpFactor) + Math.sin(sideAngle + Math.PI / 2) * sideRandomOffset;
                hairCtx.quadraticCurveTo(cpX, cpY, endX, endY);
            }

            hairCtx.lineWidth = baseThick;
            hairCtx.lineCap = 'round';
            hairCtx.strokeStyle = gradient;
            hairCtx.shadowColor = 'rgba(0, 0, 0, 0.15)';
            hairCtx.shadowBlur = 1;
            hairCtx.stroke();
            hairCtx.restore();
            redraw();
        }

        function updateEraserCursor(e) {
            const rect = dropArea.getBoundingClientRect();
            const radius = (parseFloat(eraserSize.value) / 2 + parseFloat(eraserBlur.value)) * state.scale;
            eraserCursor.style.width = `${Math.max(2, radius * 2)}px`;
            eraserCursor.style.height = `${Math.max(2, radius * 2)}px`;
            eraserCursor.style.left = `${e.clientX - rect.left}px`;
            eraserCursor.style.top = `${e.clientY - rect.top}px`;
            eraserCursor.style.display = eraserMode && state.img.src ? 'block' : 'none';
        }
        function eraseHairsAt(x, y) {
            const inner = parseFloat(eraserSize.value) / 2;
            const blur = parseFloat(eraserBlur.value);
            const outer = Math.max(inner + 0.1, inner + blur);
            hairCtx.save();
            hairCtx.globalCompositeOperation = 'destination-out';
            const grad = hairCtx.createRadialGradient(x, y, 0, x, y, outer);
            if (blur > 0) {
                grad.addColorStop(0, 'rgba(0,0,0,1)');
                grad.addColorStop(inner / outer, 'rgba(0,0,0,1)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
            } else {
                grad.addColorStop(0, 'rgba(0,0,0,1)');
                grad.addColorStop(1, 'rgba(0,0,0,1)');
            }
            hairCtx.fillStyle = grad;
            hairCtx.beginPath();
            hairCtx.arc(x, y, outer, 0, Math.PI * 2);
            hairCtx.fill();
            hairCtx.restore();
            redraw();
        }
        function eraseHairsAlong(e) {
            const [x, y] = getCanvasCoordinates(e);
            const dx = x - state.lastCanvasX;
            const dy = y - state.lastCanvasY;
            const dist = Math.hypot(dx, dy);
            const step = Math.max(1, parseFloat(eraserSize.value) / 5);
            const count = Math.max(1, Math.ceil(dist / step));
            for (let i = 1; i <= count; i++) {
                const t = i / count;
                eraseHairsAt(state.lastCanvasX + dx * t, state.lastCanvasY + dy * t);
            }
            state.lastCanvasX = x;
            state.lastCanvasY = y;
        }
        eraserSize.addEventListener('input', () => { document.getElementById('eraserSizeVal').textContent = eraserSize.value; });
        eraserBlur.addEventListener('input', () => { document.getElementById('eraserBlurVal').textContent = eraserBlur.value; });
        dropArea.addEventListener('mouseleave', () => { eraserCursor.style.display = 'none'; });
        dropArea.addEventListener('mouseenter', (e) => updateEraserCursor(e));

        clearBtn.addEventListener('click', () => {
            if (state.img.src) {
                hairCtx.clearRect(0, 0, hairCanvas.width, hairCanvas.height);
                redraw();
                state.undoStack = [];
                state.redoStack = [];
                saveHistory();
            }
        });

        // 従来のJPG合成保存
        downloadBtn.addEventListener('click', () => {
            if (!state.img.src) {
                alert('画像が読み込まれていません。');
                return;
            }
            try {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                const link = document.createElement('a');
                link.download = 'beard_generator_output.jpg';
                link.href = dataUrl;
                link.click();
            } catch (error) {
                console.error('画像の保存に失敗しました:', error);
                alert('ブラウザのセキュリティ制限により保存に失敗しました。');
            }
        });

        // 背景画像の保存（Photoshop用）
        document.getElementById('downloadBgBtn').addEventListener('click', () => {
            if (!state.img.src) {
                alert('画像が読み込まれていません。');
                return;
            }
            const link = document.createElement('a');
            link.download = 'background_image.png';
            link.href = state.img.src;
            link.click();
        });

        // 描き込んだ毛レイヤー（透過PNG）の保存（Photoshop用）
        document.getElementById('downloadHairBtn').addEventListener('click', () => {
            if (!state.img.src) {
                alert('画像が読み込まれていません。');
                return;
            }
            const link = document.createElement('a');
            link.download = 'hair_layer.png';
            link.href = hairCanvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
