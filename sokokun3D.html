            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs / 1000);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + durationMs / 1000);
            } catch (e) { }

                const ctx = c.getContext("2d");
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = textColor;
                // 横長ボタンに合わせてフォントサイズを36pxに調整
                ctx.font = "bold 36px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(text, w / 2, h / 2);
                return new THREE.CanvasTexture(c);
            }

            function createBoxTexture(text) {
                const c = document.createElement("canvas");
                c.width = 128; c.height = 128;
                const ctx = c.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, 128, 128);
                ctx.font = "80px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(text, 64, 64);
                return new THREE.CanvasTexture(c);
            }
            const texBox = createBoxTexture("🔯");
            const texGoalBox = createBoxTexture("📦");

            // メニュー用テクスチャ（横長 256x100）
            const texMenu = createTextTexture("MENU", "#a0a0a0", "#ffffff");
            const texStartOn = createTextTexture("START", "#00c800", "#ffffff");
            const texStartOff = createTextTexture("START", "#a0a0a0", "#ffffff");
            const texSelectOn = createTextTexture("SELECT", "#00c800", "#ffffff");
            const texSelectOff = createTextTexture("SELECT", "#a0a0a0", "#ffffff");

        // ゲームオブジェクト用グループ
        const gameGroup = new THREE.Group();
        scene.add(gameGroup);

        const menuGroup = new THREE.Group();
        scene.add(menuGroup);

        // メニュープレーンの構築
        const planeGeo = new THREE.PlaneGeometry(200, 80);
        const meshMenu = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ map: texMenu }));
        meshMenu.position.set(0, 80, 0);
        menuGroup.add(meshMenu);

        const matStart = new THREE.MeshBasicMaterial({ map: texStartOn });
        const meshStart = new THREE.Mesh(planeGeo, matStart);
        meshStart.position.set(0, 0, 0);
        menuGroup.add(meshStart);

        const matSelect = new THREE.MeshBasicMaterial({ map: texSelectOff });
        const meshSelect = new THREE.Mesh(planeGeo, matSelect);
        meshSelect.position.set(0, -80, 0);
        menuGroup.add(meshSelect);

        // キーボード操作
        window.addEventListener("keydown", (e) => {
            initAudio();
            let handled = true;

            if (m0 === 0) { // メニュー
                if (e.key === "ArrowUp") {
                    if (cu === 1) { cu = 0; beep(358, 100); }
                } else if (e.key === "ArrowDown") {
                    if (cu === 0) { cu = 1; beep(358, 100); }
                } else if (e.key === "z" || e.key === "Z") {
                    m0 = cu + 1;
                    if (m0 === 1) {
                        mset(mno);
                        mm = 0;
                        disp(); // ★ここを追加（開始時に即座に3Dステージを描画）
                    }
                    beep(358, 300);
                } else handled = false;
            } else if (m0 === 2) { // ステージセレクト
                if (e.key === "ArrowRight") {
                    if (mno < TOTAL_STAGES - 1) { mno++; beep(358, 80); }
                } else if (e.key === "ArrowLeft") {
                    if (mno > 0) { mno--; beep(358, 80); }
                } else if (e.key === "z" || e.key === "Z") {
                    m0 = 1;
                    mm = 0;
                    mset(mno);
                    beep(358, 300);
                } else handled = false;
                mset(mno);
                disp();
            } else if (m0 === 1) { // プレイ中
                if (e.key === "x" || e.key === "X") {
                    if (wk > 0) {
                        rewak();
                        beep(220, 50);
                        disp();
                    }
                } else if (e.key === "ArrowUp") {
                    if (dmap[ply - 1]?.[plx] != 1) idou(0, 0, -1, -2, 1);
                } else if (e.key === "ArrowRight") {
                    if (dmap[ply]?.[plx + 1] != 1) idou(1, 2, 0, 0, 2);
                } else if (e.key === "ArrowDown") {
                    if (dmap[ply + 1]?.[plx] != 1) idou(0, 0, 1, 2, 3);
                } else if (e.key === "ArrowLeft") {
                    if (dmap[ply]?.[plx - 1] != 1) idou(-1, -2, 0, 0, 4);
                } else handled = false;
            }

            if (handled) e.preventDefault();
        });

        // --- マウスドラッグでカメラ回転（左右・上下に最大約90度） ---
            container.addEventListener("mousedown", (e) => {
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });

            window.addEventListener("mouseup", () => isDragging = false);

            window.addEventListener("mousemove", (e) => {
                if (!isDragging || m0 === 0) return; // メニュー画面では無効

                const deltaX = e.clientX - prevMouseX;
                const deltaY = e.clientY - prevMouseY;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;

                // 左右・上下ともに約 ±45度（±0.78ラジアン、合計約90度）に制限
                camRotY = Math.max(-0.78, Math.min(0.78, camRotY - deltaX * 0.005));
                camRotX = Math.max(-0.5, Math.min(0.5, camRotX - deltaY * 0.005));
            });

        // 移動処理（修正済みロジック）
        function idou(x1, x2, y1, y2, cs) {
            let bz = 1;
            let cf = 0;
            let target1 = dmap[ply + y1]?.[plx + x1];
            let target2 = dmap[ply + y2]?.[plx + x2];

            if (target1 === 0) {
                mxy[mm] = (cs - 1) * 4;
                mm++;
                cf = 1;
            } else if (target1 === 2) {
                mxy[mm] = (cs - 1) * 4 + 1;
                mm++;
                cf = 1;
            } else if (target1 === 3) {
                if (target2 === 0) {
                    dmap[ply + y1][plx + x1] = 0;
                    dmap[ply + y2][plx + x2] = 3;
                    mxy[mm] = (cs - 1) * 4 + 2;
                    mm++;
                    cf = 1;
                } else if (target2 === 2) {
                    dmap[ply + y1][plx + x1] = 0;
                    dmap[ply + y2][plx + x2] = 4;
                    bz = 2;
                    mxy[mm] = (cs - 1) * 4 + 2;
                    mm++;
                    boxc++;
                    cf = 1;
                }
            } else if (target1 === 4) {
                if (target2 === 0) {
                    dmap[ply + y1][plx + x1] = 2;
                    dmap[ply + y2][plx + x2] = 3;
                    mxy[mm] = (cs - 1) * 4 + 3;
                    mm++;
                    boxc--;
                    cf = 1;
                } else if (target2 === 2) {
                    dmap[ply + y1][plx + x1] = 2;
                    dmap[ply + y2][plx + x2] = 4;
                    bz = 2;
                    mxy[mm] = (cs - 1) * 4 + 3;
                    mm++;
                    cf = 1;
                }
            }

            if (cf === 1) {
                pnf(x1, y1);
                disp();
                beep(240 * bz, 60);
                wk++;
                checkClear();
            }
        }

        function rewak() {
            mm--;
            let dir = Math.floor(mxy[mm] / 4);
            let type = mxy[mm] % 4;

            if (type === 0) {
                dmap[ply][plx] = 0;
            } else if (type === 1) {
                dmap[ply][plx] = 2;
            } else if (type === 2) {
                let bx = plx - mmf[0][dir];
                let by = ply - mmf[1][dir];
                if (dmap[by][bx] === 4) {
                    dmap[by][bx] = 2;
                    boxc--;
                } else {
                    dmap[by][bx] = 0;
                }
                dmap[ply][plx] = 3;
            } else if (type === 3) {
                let bx = plx - mmf[0][dir];
                let by = ply - mmf[1][dir];
                if (dmap[by][bx] === 4) {
                    dmap[by][bx] = 2;
                    boxc--;
                } else {
                    dmap[by][bx] = 0;
                }
                dmap[ply][plx] = 4;
                boxc++;
            }

            plx = plx + mmf[0][dir];
            ply = ply + mmf[1][dir];
            wk--;
        }

        function pnf(x, y) {
            if (x === 0) {
                if (y > 0) ply++;
                if (y < 0) ply--;
            }
            if (y === 0) {
                if (x > 0) plx++;
                if (x < 0) plx--;
            }
        }

        let isClearing = false; // クリア演出中の操作制御用

            function checkClear() {
                if (boxmax > 0 && boxmax === boxc && !isClearing) {
                    isClearing = true;

                    // ファンファーレ音
                    for (let i = 0; i < 4; i++) {
                        setTimeout(() => beep(285 * (i + 1), 100), i * 120);
                    }
                    setTimeout(() => beep(285 * 4, 400), 480);

                    // 「面番号 + Clear」を画面中央に表示
                    const msgEl = document.getElementById("clear-msg");
                    msgEl.innerHTML = `STAGE ${mno + 1}<br>CLEAR!!`;
                    msgEl.style.display = "block";

                    // 2秒後に非表示にして次の面へ進む
                    setTimeout(() => {
                        msgEl.style.display = "none";
                        isClearing = false;
                        mno++;
                        if (mno >= TOTAL_STAGES) mno = 0;
                        mset(mno);
                        mm = 0;
                        // カメラ角度をリセットしたい場合は次の2行のコメントを外してください
                        // camRotY = 0;
                        // camRotX = 0;
                        disp();
                    }, 2000);
                }
            }

        function mset(mnum) {
            maxx = 0;
            maxy = 0;
            boxmax = 0;
            boxc = 0;
            wk = 0;
            mxy = [];

            for (let y = 0; y < 18; y++) {
                for (let x = 0; x < 23; x++) {
                    let dd = map[y + mnum * 18][x];
                    if (dd !== 0) {
                        if (maxx < x) maxx = x;
                        if (maxy < y) maxy = y;
                    }
                    dmap[y][x] = dd;
                    if (dd === 5) {
                        dmap[y][x] = 0;
                        plx = x;
                        ply = y;
                    }
                    if (dd === 3 || dd === 4) boxmax++;
                    if (dd === 4) boxc++;
                }
            }

            // カメラ位置（p5.js の計算式を再現）
            const cx = (maxx / 2) * 50;
            const cy = 500 + (maxx + maxy) * 5;
            const cz = (maxy / 2) * 50 + 500 * (maxx + maxy) * 0.05;
            camera.position.set(cx, cy, cz);
            camera.lookAt(cx, 0, (maxy / 2) * 50);
        }

        // 3D 空間の描画
        function disp() {
            // 既存のメッシュを破棄・クリア
            while (gameGroup.children.length > 0) {
                const obj = gameGroup.children[0];
                gameGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
            }

            const box50Geo = new THREE.BoxGeometry(50, 50, 50);
            const box40Geo = new THREE.BoxGeometry(40, 40, 40);
            const sphereGeo = new THREE.SphereGeometry(25, 24, 24);

            const wallMat = new THREE.MeshLambertMaterial({ color: 0x969696 });
            const goalMat = new THREE.MeshLambertMaterial({ color: 0xc80000, transparent: true, opacity: 0.35 });
            const playerMat = new THREE.MeshLambertMaterial({ color: 0xffff00 });
            const boxMat = new THREE.MeshLambertMaterial({ map: texBox });
            const goalBoxMat = new THREE.MeshLambertMaterial({ map: texGoalBox });

            // プレイヤー描画 (球体)
            const playerMesh = new THREE.Mesh(sphereGeo, playerMat);
            playerMesh.position.set(plx * 50, 25, ply * 50);
            gameGroup.add(playerMesh);

            // マップ要素描画
            for (let yy = 0; yy < 18; yy++) {
                for (let xx = 0; xx < 23; xx++) {
                    let chip = dmap[yy][xx];
                    let px = xx * 50;
                    let pz = yy * 50;

                    // ゴール床（赤い透過ボックス）
                    if (chip === 2 || chip === 4) {
                        const goalMesh = new THREE.Mesh(box50Geo, goalMat);
                        goalMesh.position.set(px, 25, pz);
                        gameGroup.add(goalMesh);
                    }

                    // 壁
                    if (chip === 1) {
                        const wallMesh = new THREE.Mesh(box50Geo, wallMat);
                        wallMesh.position.set(px, 25, pz);
                        gameGroup.add(wallMesh);
                    }
                    // 荷物
                    else if (chip === 3) {
                        const bMesh = new THREE.Mesh(box40Geo, boxMat);
                        bMesh.position.set(px, 20, pz);
                        gameGroup.add(bMesh);
                    }
                    // ゴール上の荷物
                    else if (chip === 4) {
                        const gbMesh = new THREE.Mesh(box40Geo, goalBoxMat);
                        gbMesh.position.set(px, 20, pz);
                        gameGroup.add(gbMesh);
                    }
                }
            }
        }

        // メインループ
        function animate() {
            requestAnimationFrame(animate);

            if (m0 === 0) {
                // メニュー画面
                menuGroup.visible = true;
                gameGroup.visible = false;
                camera.position.set(0, 0, 350);
                camera.lookAt(0, 0, 0);

                matStart.map = (cu === 0) ? texStartOn : texStartOff;
                matStart.needsUpdate = true;
                matSelect.map = (cu === 1) ? texSelectOn : texSelectOff;
                matSelect.needsUpdate = true;

                uiOverlay.innerHTML = "MENU";
            } else if (m0 === 1 || m0 === 2) {
                // ゲーム画面 または セレクト画面
                menuGroup.visible = false;
                gameGroup.visible = true;

                if (m0 === 1) {
                    uiOverlay.innerHTML = `MAP: ${mno + 1} 　|　 WALK: ${wk} 　|　 BOX: ${boxc} / ${boxmax}`;
                } else {
                    uiOverlay.innerHTML = `[STAGE SELECT] MAP: ${mno + 1} (左右キーで選択 / Zで決定)`;
                }

                // マウスドラッグ角度を反映したカメラ計算
                const targetX = (maxx / 2) * 50;
                const targetZ = (maxy / 2) * 50;
                const dist = 500 + (maxx + maxy) * 8; // 注視点からの距離
                const elevation = 0.8 + camRotX;     // 見下ろし角度

                camera.position.x = targetX + Math.sin(camRotY) * dist * Math.cos(elevation);
                camera.position.y = dist * Math.sin(elevation);
                camera.position.z = targetZ + Math.cos(camRotY) * dist * Math.cos(elevation);
                camera.lookAt(targetX, 0, targetZ);
            }

            renderer.render(scene, camera);
        }

        // 開始
        animate();
    </script>
</body>
